<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Classroom Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=2026-09-30b">
<script src="shared/core.js?v=2026-09-30b"></script>
<script>window.PAGE_VERSION = '2026-09-30b';</script>
<style>
.dash{max-width:1180px;margin:0 auto;padding:min(28px,3vh) 20px 16px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:40px;align-items:start}
.clock{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:clamp(64px,min(11vw,17vh),156px);line-height:1}
.clock .sec{font-family:var(--sans);font-size:.34em;color:var(--ink-2);font-weight:500;margin-left:.14em}
.clock .ap{font-family:var(--sans);font-size:.24em;color:var(--ink-2);font-weight:600;margin-left:.3em;letter-spacing:.1em}
.date{font-size:22px;font-weight:500;letter-spacing:.04em;color:var(--ink-2);margin:8px 0 min(30px,3vh)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 44px;align-items:end}
.hero .date{margin-bottom:0}
.status h1{font-size:clamp(30px,min(3.6vw,6.5vh),52px);margin-bottom:4px}
@media (max-width:1100px){.hero{grid-template-columns:1fr;gap:0}.hero .date{margin-bottom:min(30px,3vh)}.status h1{font-size:clamp(32px,min(4.6vw,7vh),56px)}}
.status .range{font-size:19px;color:var(--ink-2)}
.progress{height:16px;background:var(--wash);border:2px solid var(--edge);border-radius:999px;overflow:hidden;margin:12px 0 8px;max-width:640px}
.progress span{display:block;height:100%;background:var(--land)}
.left{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.nextup{font-size:17px;color:var(--ink-2);margin-top:4px}
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:min(34px,3.5vh);max-width:820px;align-items:start}
.cards-row:empty{display:none}
.agendabox{margin-top:min(26px,3vh);max-width:820px;background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:12px 18px 14px}
.agendabox h2{font-size:22px}
.agline{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:6px 0;border-top:1px solid var(--rule)}
.boxhead+.agline{border-top:0}
.agline .k{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-top:3px}
.agline .v{font-size:18px}
.agline .target{font-weight:600}
.aglist{margin:0;padding-left:22px;font-size:18px;columns:2;column-gap:28px}
.aglist li{break-inside:avoid;padding:1px 0}
.agadd{margin-top:min(18px,2vh)}
.ag-dialog{max-width:620px}
.ag-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ag-grid label{display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:700}
.ag-l{display:block;font-size:14px;font-weight:700;margin:12px 0 3px}
.ag-dialog .field,.ag-dialog textarea,.ag-dialog select{width:100%}
.ag-also{margin-top:12px}
#ag-others{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
#ag-others label{font-size:15px;display:flex;gap:5px;align-items:center}
.classbox,.comingbox{background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:12px 18px 14px}
.classbox h2{font-size:22px;margin-bottom:6px}
.stand{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.boxhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.boxhead h2{margin:0!important}
.stand li{display:flex;align-items:center;padding:2px 0;border-top:1px solid var(--rule);font-size:16px}
.stand li:nth-child(-n+2){border-top:0}
.stand li b{margin-left:auto;font-family:var(--serif);font-size:23px;font-weight:400}
.today{background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:16px 18px;position:sticky;top:16px;display:flex;flex-direction:column;max-height:calc(100vh - 130px);max-height:calc(100dvh - 130px)}
.today h2{font-size:22px;padding-bottom:6px;border-bottom:3px solid var(--land);margin-bottom:6px}
.today ol{list-style:none;margin:0 0 12px;padding:0;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin}
.today .edit{flex:none}
.today li{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:7px 8px;border-left:3px solid transparent;font-size:16px;font-variant-numeric:tabular-nums}
.today li .t{color:var(--ink-2)}
.today li.brk .n{font-style:italic;color:var(--ink-2)}
.today li.pass{font-size:14px;padding:2px 8px;color:var(--ink-2)}
.today li.past{opacity:.45}
.today li.now{background:var(--wash);border-left-color:var(--land);font-weight:700}
.today li.now .t{color:var(--ink)}
.comingbox h2{font-size:22px;margin-bottom:6px}
.coming{list-style:none;margin:0;padding:0}
.coming li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--rule)}
.coming li:first-child{border-top:0}
.coming .what{font-size:17px;font-weight:500}
.coming .when{text-align:right;white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.coming .when b{font-family:var(--serif);font-weight:400;font-size:28px}
.coming .when span{font-size:13px;color:var(--ink-2)}
.today .none{color:var(--ink-2);padding:10px 0}
@media (max-width:860px){.dash{grid-template-columns:1fr;gap:28px}.today{position:static;max-height:none}.today ol{overflow:visible}}
</style>
</head>
<body>
<header id="suite-nav"></header>
<main class="dash">
  <section>
    <div class="hero">
      <div><div class="clock" aria-live="off"><span id="hm"></span><span class="sec" id="sec"></span><span class="ap" id="ap"></span></div>
        <div class="date" id="date"></div></div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
    <div id="agenda"></div>
    <div class="cards-row"><div id="classbox"></div><div id="coming"></div></div>
  </section>
  <aside class="today" aria-labelledby="day-label">
    <h2 id="day-label"></h2>
    <ol id="sched"></ol>
    <div class="edit small"><a href="settings.html#schedule">Edit the bell schedule</a> · <a href="#" data-a="agedit">Plan a day</a> · <a href="sub.html">Sub page</a></div>
  </aside>
</main>
<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  let sig = '';

  const secOf = t => Suite.toMin(t) * 60;
  const mmss = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0') : m + ':' + String(r).padStart(2, '0'); };

  function standings(cls){
    const T = Suite.get('tracker', null);
    const act = Suite.activeTables(cls);
    if (!T || !act.length) return '';
    const pts = tid => (T.log || []).reduce((a, e) => a + (e.c === cls.id && e.t === tid && e.q === T.quarter && e.w === T.week ? e.d : 0), 0);
    const rows = act.map(t => [t, pts(t.id)]).sort((a, b) => b[1] - a[1]);
    return `<ul class="stand">${rows.map(([t, p]) => `<li><span class="swatch" style="background:${esc(t.color)}"></span>${esc(t.name)}<b>${p}</b></li>`).join('')}</ul>`;
  }

  const nextReal = (P, i) => P.slice(i + 1).find(p => !Suite.isPassing(p)) || null;


  /* ---------- agenda ---------- */
  function currentClass(){
    const now = new Date(), day = Suite.scheduleFor(now), st = Suite.periodStatus(day.periods, now);
    const p = st.cur >= 0 && !Suite.isPassing(day.periods[st.cur]) ? day.periods[st.cur] : st.next >= 0 ? day.periods.slice(st.next).find(x => !Suite.isPassing(x) && !x.isBreak) : null;
    return Suite.classForPeriod(p, Suite.classes());
  }
  function renderAgenda(cls, now){
    const el = $('#agenda');
    if (!cls) { el.innerHTML = ''; return; }
    const key = Suite.dateKey(now), a = Suite.agendaFor(key, cls.id);
    if (!a) { el.innerHTML = `<div class="agadd"><button class="btn quiet small" data-a="agedit" data-id="${esc(cls.id)}">+ Add today's plan for ${esc(cls.name)}</button></div>`; return; }
    el.innerHTML = `<div class="agendabox">
      <div class="boxhead"><h2>Today in ${esc(cls.name)}</h2><button class="btn quiet small" data-a="agedit" data-id="${esc(cls.id)}">Edit</button></div>
      ${a.target ? `<div class="agline"><span class="k">Learning target</span><span class="v target">${esc(a.target)}</span></div>` : ''}
      ${a.items && a.items.length ? `<div class="agline"><span class="k">Agenda</span><ol class="aglist">${a.items.map(i => `<li>${esc(i)}</li>`).join('')}</ol></div>` : ''}
      ${a.homework ? `<div class="agline"><span class="k">Homework</span><span class="v">${esc(a.homework)}</span></div>` : ''}
    </div>`;
  }
  function openAgendaEditor(classId){
    const list = Suite.classes(); if (!list.length) return;
    let cid = classId || list[0].id, date = Suite.dateKey(new Date()), dirty = false;
    const back = document.createElement('div');
    back.className = 'suite-dialog-back';
    back.innerHTML = `<div class="suite-dialog ag-dialog" role="dialog" aria-modal="true" aria-labelledby="ag-title">
      <h2 id="ag-title">Daily plan</h2>
      <div class="ag-grid">
        <label>Class<select id="ag-class">${list.map(k => `<option value="${esc(k.id)}"${k.id === cid ? ' selected' : ''}>${esc(k.name)}</option>`).join('')}</select></label>
        <label>Date<input type="date" class="field" id="ag-date" value="${date}"></label>
      </div>
      <label class="ag-l" for="ag-target">Learning target</label>
      <input class="field" id="ag-target" placeholder="I can explain why the Nile mattered to Egyptian farmers.">
      <label class="ag-l" for="ag-items">Agenda <span class="muted small">(one step per line)</span></label>
      <textarea id="ag-items" rows="5" placeholder="Warm-up&#10;Map activity&#10;Exit ticket"></textarea>
      <label class="ag-l" for="ag-hw">Homework</label>
      <input class="field" id="ag-hw" placeholder="Optional">
      <div class="ag-also"><span class="small"><b>Also use this plan for:</b></span><div id="ag-others"></div></div>
      <div class="suite-dialog-actions" style="justify-content:space-between;flex-wrap:wrap">
        <span class="bar"><button class="btn quiet small" data-g="last">Start from the last plan</button><button class="btn quiet danger small" data-g="clear">Clear this plan</button></span>
        <span class="bar"><button class="btn" data-g="cancel">Cancel</button><button class="btn primary" data-g="save">Save plan</button></span>
      </div></div>`;
    document.body.appendChild(back);
    const $$ = id => back.querySelector('#' + id);
    const fill = e => { $$('ag-target').value = (e && e.target) || ''; $$('ag-items').value = ((e && e.items) || []).join('\n'); $$('ag-hw').value = (e && e.homework) || ''; dirty = false; };
    const others = () => { $$('ag-others').innerHTML = list.filter(k => k.id !== cid).map(k => `<label><input type="checkbox" value="${esc(k.id)}"> ${esc(k.name)}</label>`).join('') || '<span class="muted small">No other classes.</span>'; };
    fill(Suite.agendaFor(date, cid)); others();
    back.addEventListener('input', e => { if (/ag-(target|items|hw)/.test(e.target.id)) dirty = true; });
    back.addEventListener('change', e => {
      if (e.target.id === 'ag-class') { cid = e.target.value; others(); if (!dirty) fill(Suite.agendaFor(date, cid)); }
      else if (e.target.id === 'ag-date' && e.target.value) { date = e.target.value; if (!dirty) fill(Suite.agendaFor(date, cid)); }
    });
    const close = () => { back.remove(); document.removeEventListener('keydown', onKey, true); };
    const onKey = e => { if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); } };
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('click', e => {
      if (e.target === back) return close();
      const b = e.target.closest('[data-g]'); if (!b) return;
      const g = b.dataset.g;
      const ids = [cid].concat([...back.querySelectorAll('#ag-others input:checked')].map(x => x.value));
      if (g === 'cancel') close();
      else if (g === 'last') { const l = Suite.lastAgenda(date, cid); if (l) { fill(l); dirty = true; } else Suite.toast('No earlier plan for this class'); }
      else if (g === 'clear') { Suite.saveAgenda(date, [cid], null); close(); Suite.toast('Plan cleared'); }
      else if (g === 'save') {
        const entry = { target: $$('ag-target').value.trim(), items: $$('ag-items').value.split('\n').map(x => x.trim()).filter(Boolean), homework: $$('ag-hw').value.trim() };
        Suite.saveAgenda(date, ids, entry.target || entry.items.length || entry.homework ? entry : null);
        close(); Suite.toast(ids.length > 1 ? 'Plan saved for ' + ids.length + ' classes' : 'Plan saved');
      }
    });
    $$('ag-target').focus();
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a="agedit"]'); if (!b) return;
    e.preventDefault();
    openAgendaEditor(b.dataset.id || (currentClass() || {}).id);
  });

  function keepCurrentInView(st){
    const ol = $('#sched'), rows = ol.children, i = st.cur >= 0 ? st.cur : st.next;
    if (i < 0 || !rows[i]) return;
    const anchor = rows[Math.max(0, i - 1)];
    // room after the last period, so late-day periods can still scroll up near the top
    ol.style.paddingBottom = '0px';
    const shown = rows[rows.length - 1].offsetTop + rows[rows.length - 1].offsetHeight - anchor.offsetTop;
    ol.style.paddingBottom = Math.max(0, ol.clientHeight - shown) + 'px';
    const top = anchor.offsetTop - ol.offsetTop;
    const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    ol.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' });
  }

  function renderComing(){
    const today = Suite.dateKey(new Date());
    const list = Suite.countdowns().filter(cd => cd.date && cd.date >= today && cd.label)
      .sort((a, b) => a.date.localeCompare(b.date)).slice(0, 4);
    $('#coming').innerHTML = list.length ? `<div class="comingbox"><h2>Coming up</h2><ul class="coming">${list.map(cd => {
      const n = Suite.daysUntil(cd.date, cd.school);
      const when = cd.date === today ? '<b>Today</b>' : n === 1 && !cd.school ? '<b>Tomorrow</b>'
        : `<b>${n}</b><span>${cd.school ? 'school ' : ''}day${n === 1 ? '' : 's'}</span>`;
      return `<li><span class="what">${esc(cd.label)}</span><span class="when">${when}</span></li>`; }).join('')}</ul></div>` : '';
  }

  function renderDay(now){
    const day = Suite.scheduleFor(now);
    const st = Suite.periodStatus(day.periods, now);
    const P = day.periods;
    $('#day-label').textContent = day.label;
    $('#sched').innerHTML = P.length ? P.map((p, i) => {
      const cls = i === st.cur ? 'now' : secOf(p.end) <= st.sec ? 'past' : '';
      return `<li class="${cls}${Suite.isPassing(p) ? ' pass' : p.isBreak ? ' brk' : ''}"${i === st.cur ? ' aria-current="true"' : ''}><span class="t">${Suite.fmt12(p.start)}</span><span class="n">${esc(p.name)}</span></li>`;
    }).join('') : `<li class="none">No bells today.</li>`;

    let html = '', focus = null;
    if (!P.length) html = `<h1>${esc(day.label)}</h1>`;
    else if (st.cur >= 0 && Suite.isPassing(P[st.cur])) {
      const p = P[st.cur], nx = nextReal(P, st.cur);
      focus = nx;
      html = `<h1>Passing time</h1>
        <div class="range">${nx ? esc(nx.name) + ' starts at ' + Suite.fmt12(nx.start) : 'Until ' + Suite.fmt12(p.end)}</div>
        <div class="progress" role="progressbar" aria-label="Passing time used" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div>
        <div class="left"><span id="left"></span> left</div>`;
    }
    else if (st.cur >= 0) {
      const p = P[st.cur], nx = nextReal(P, st.cur);
      focus = p;
      html = `<h1>${esc(p.name)}</h1><div class="range">${Suite.fmt12(p.start)} to ${Suite.fmt12(p.end)}</div>
        <div class="progress" role="progressbar" aria-label="Time through this period" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div>
        <div class="left"><span id="left"></span> left</div>
        ${nx ? `<div class="nextup">Next: ${esc(nx.name)} at ${Suite.fmt12(nx.start)}</div>` : ''}`;
    } else if (st.next >= 0) {
      const nx = Suite.isPassing(P[st.next]) ? nextReal(P, st.next) || P[st.next] : P[st.next];
      focus = nx;
      html = `<h1>${st.next === 0 ? 'Before school' : 'Passing time'}</h1>
        <div class="range">${esc(nx.name)} starts at ${Suite.fmt12(nx.start)}</div>
        <div class="left" style="margin-top:14px">Starts in <span id="left"></span></div>`;
    } else html = `<h1>School's out</h1><div class="range">See you tomorrow.</div>`;
    $('#status').innerHTML = html;

    const cls = Suite.classForPeriod(focus, Suite.classes());
    $('#classbox').innerHTML = cls ? `<div class="classbox">
        <div class="boxhead"><h2>${esc(cls.name)} this week</h2><a class="small" href="tracker.html#class=${esc(cls.id)}">Open</a></div>
        ${standings(cls) || '<p class="muted">No points yet this week.</p>'}</div>` : '';
    $('#classbox').hidden = !cls;
    renderAgenda(cls, now);
    renderComing();
    $('#coming').hidden = !$('#coming').innerHTML;
    keepCurrentInView(st);
    return { P, st };
  }

  let state = null;
  function tick(){
    const now = new Date();
    let h = now.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    $('#hm').textContent = h + ':' + String(now.getMinutes()).padStart(2, '0');
    $('#sec').textContent = ':' + String(now.getSeconds()).padStart(2, '0');
    $('#ap').textContent = ap;
    $('#date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

    const day = Suite.scheduleFor(now), st = Suite.periodStatus(day.periods, now);
    const s = Suite.dateKey(now) + '|' + st.cur + '|' + st.next + '|' + day.periods.length;
    if (s !== sig || !state) { sig = s; state = renderDay(now); }
    const { P } = state, sec = st.sec;
    const left = $('#left'), bar = $('#bar');
    if (st.cur >= 0) {
      const a = secOf(P[st.cur].start), b = secOf(P[st.cur].end);
      if (left) left.textContent = mmss(b - sec);
      if (bar) bar.style.width = Math.min(100, (sec - a) / (b - a) * 100).toFixed(1) + '%';
    } else if (st.next >= 0 && left) left.textContent = mmss(secOf(P[st.next].start) - sec);
  }

  window.addEventListener('suite:change', () => { state = null; tick(); });
  Suite.mountNav('dashboard');
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
