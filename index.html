<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Classroom Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=2026-10-08a">
<script src="shared/core.js?v=2026-10-08a"></script>
<script>window.PAGE_VERSION = '2026-10-08a';</script>
<style>
.dash{max-width:1180px;margin:0 auto;padding:min(22px,2.4vh) 20px 16px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px;align-items:stretch}
@media (min-width:861px){
  .dash{height:calc(100vh - var(--navh,70px));height:calc(100dvh - var(--navh,70px));grid-template-rows:minmax(0,1fr)}
  .dash>section{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .fill{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;margin-top:min(16px,1.8vh)}
  /* the plan takes what's left and scrolls inside if it's long; the cards below keep their size */
  .fill>#agenda{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
  .fill>#agenda:empty{flex:0 0 auto}
  .fill>#agenda .agendabox{margin-top:0;min-height:0;max-height:100%;overflow:auto}
  .fill>#agenda .agadd{margin-top:0}
  .fill>.cards-row{flex:1 0 auto;margin-top:0;align-items:stretch}
  .cards-row>div{display:flex;flex-direction:column}
  .cards-row .classbox,.cards-row .comingbox{flex:1 1 auto}
  .dash .today{position:static;max-height:none;min-height:0}
}
.clock{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:clamp(52px,min(9vw,12vh),140px);line-height:1}
.clock .sec{font-family:var(--sans);font-size:.34em;color:var(--ink-2);font-weight:500;margin-left:.14em}
.clock .ap{font-family:var(--sans);font-size:.24em;color:var(--ink-2);font-weight:600;margin-left:.3em;letter-spacing:.1em}
.date{font-size:clamp(15px,2.3vh,19px);font-weight:500;letter-spacing:.04em;color:var(--ink-2);margin:6px 0 0}
.hero{display:block}
.hero .date{margin-bottom:min(14px,1.6vh)}
.status h1{font-size:clamp(26px,min(3.6vw,5.2vh),48px);margin-bottom:2px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.status h1 .range{font-family:var(--sans);font-size:18px}
.pline{display:flex;align-items:center;gap:14px;max-width:700px;margin:8px 0 2px}
.pline .progress{flex:1;margin:0}
.status .range{font-size:18px;color:var(--ink-2)}
.progress{height:16px;background:var(--wash);border:2px solid var(--edge);border-radius:999px;overflow:hidden;margin:12px 0 8px;max-width:640px}
.progress span{display:block;height:100%;background:var(--land)}
.left{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.nextup{font-size:15px;color:var(--ink-2);margin-top:2px}
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:min(34px,3.5vh);max-width:820px;align-items:start}
.cards-row:empty{display:none}
.agendabox{margin-top:min(22px,2.4vh);max-width:820px;background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:10px 18px 12px}
.agendabox h2{font-size:21px}
.agendabox .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-right:10px}
.ag-target{font-size:17px;font-weight:600;margin-top:2px}
.ag-steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ag-steps li{display:flex;align-items:center;gap:7px;border:1.5px solid var(--rule);border-radius:999px;padding:2px 12px 2px 3px;font-size:15px;background:var(--paper)}
.ag-steps li b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--sea);color:var(--on-sea);font-size:12px}
.ag-hw{font-size:15px;margin-top:8px}
.ag-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lchip{font:inherit;font-size:14px;font-weight:600;color:var(--sea);background:var(--paper);border:1.5px solid var(--edge);border-radius:999px;padding:3px 12px;text-decoration:none;cursor:pointer}
.lchip:hover{background:var(--wash)}
.evtoday{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 0}
.evtoday:empty{display:none}
.evtoday .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-right:2px}
.evc{background:var(--land);color:var(--on-land);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:600}
.evc span{font-weight:400;margin-left:6px;opacity:.9}
.coming .evli .day{font-family:var(--sans);font-weight:700;font-size:17px}
.agadd{margin-top:min(18px,2vh)}
.ag-dialog{max-width:620px}
.ag-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ag-grid label{display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:700}
.ag-l{display:block;font-size:14px;font-weight:700;margin:12px 0 3px}
.ag-dialog .field,.ag-dialog textarea,.ag-dialog select{width:100%}
.ag-also{margin-top:12px}
#ag-others{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
#ag-others label{font-size:15px;display:flex;gap:5px;align-items:center}
.classbox,.comingbox{background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:12px 18px 14px}
.classbox h2{font-size:22px;margin-bottom:6px}
.stand{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.boxhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.boxhead h2{margin:0!important}
.stand li{display:flex;align-items:center;padding:2px 0;border-top:1px solid var(--rule);font-size:16px}
.stand li{border:1.5px solid var(--rule)!important;border-radius:999px;padding:2px 4px 2px 10px!important;gap:6px;font-size:14px!important;background:var(--paper)}
.stand li .swatch{margin-right:0}
.stand li b{margin-left:4px;font-family:var(--serif);font-size:20px;font-weight:400;background:var(--sheet);border-radius:999px;padding:0 8px;line-height:1.3}
.today{background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:16px 18px;position:sticky;top:calc(var(--navh,70px) + 14px);display:flex;flex-direction:column;max-height:calc(100vh - var(--navh,70px) - 44px);max-height:calc(100dvh - var(--navh,70px) - 44px)}
.today h2{font-size:22px;padding-bottom:6px;border-bottom:3px solid var(--land);margin-bottom:6px}
.today ol{list-style:none;margin:0 0 12px;padding:0;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin}
.today .edit{flex:none}
.today li{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:7px 8px;border-left:3px solid transparent;font-size:16px;font-variant-numeric:tabular-nums}
.today li .t{color:var(--ink-2)}
.today li.brk .n{font-style:italic;color:var(--ink-2)}
.why{font-size:13px;color:var(--ink-2);margin:-2px 0 6px}
.today h2+.why:empty{display:none}
.today li.staff{font-size:14px;color:var(--ink-2)}
.today li.staff .n{font-style:italic}
.today li.pass{font-size:14px;padding:2px 8px;color:var(--ink-2)}
.today li.past{opacity:.45}
.today li.now{background:var(--wash);border-left-color:var(--land);font-weight:700}
.today li.now .t{color:var(--ink)}
.comingbox h2{font-size:22px;margin-bottom:6px}
.coming{list-style:none;margin:0;padding:0}
.coming li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--rule)}
.coming li:first-child{border-top:0}
.coming .what{font-size:17px;font-weight:500;display:flex;flex-direction:column}
.coming .at{font-size:13px;color:var(--ink-2);font-weight:400}
.comingbox .more{display:inline-block;margin-top:6px}
.cdlive{font-variant-numeric:tabular-nums}
.coming .when b.hrs{margin-left:6px}
.coming .when{text-align:right;white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.coming .when b{font-family:var(--serif);font-weight:400;font-size:28px}
.coming .when span{font-size:13px;color:var(--ink-2)}
.today .none{color:var(--ink-2);padding:10px 0}
@media (max-width:860px){.dash{grid-template-columns:1fr;gap:28px}.today{position:static;max-height:none}.today ol{overflow:visible}}
</style>
</head>
<body>
<header id="suite-nav"></header>
<main class="dash">
  <section>
    <div class="hero">
      <div><div class="clock" aria-live="off"><span id="hm"></span><span class="sec" id="sec"></span><span class="ap" id="ap"></span></div>
        <div class="date" id="date"></div><div class="evtoday" id="evtoday"></div></div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
    <div class="fill">
      <div id="agenda"></div>
      <div class="cards-row"><div id="classbox"></div><div id="coming"></div></div>
    </div>
  </section>
  <aside class="today" aria-labelledby="day-label">
    <h2 id="day-label"></h2>
    <div class="why" id="day-why"></div>
    <ol id="sched"></ol>
    <div class="edit small"><a href="settings.html#schedule">Edit the bell schedule</a> · <a href="planner.html">Planner</a> · <a href="sub.html">Sub page</a></div>
  </aside>
</main>
<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  let sig = '';

  const secOf = t => Suite.toMin(t) * 60;
  const mmss = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0') : m + ':' + String(r).padStart(2, '0'); };

  function standings(cls){
    const T = Suite.get('tracker', null);
    const act = Suite.activeTables(cls);
    if (!T || !act.length) return '';
    const pts = tid => (T.log || []).reduce((a, e) => a + (e.c === cls.id && e.t === tid && e.q === T.quarter && e.w === T.week ? e.d : 0), 0);
    const rows = act.map(t => [t, pts(t.id)]).sort((a, b) => b[1] - a[1]);
    return `<ul class="stand">${rows.map(([t, p]) => `<li><span class="swatch" style="background:${esc(t.color)}"></span>${esc(t.name)}<b>${p}</b></li>`).join('')}</ul>`;
  }

  const nextReal = (P, i) => P.slice(i + 1).find(p => !Suite.isPassing(p)) || null;


  /* ---------- agenda ---------- */
  function currentClass(){
    const now = new Date(), day = Suite.scheduleFor(now), st = Suite.periodStatus(day.periods, now);
    const p = st.cur >= 0 && !Suite.isPassing(day.periods[st.cur]) ? day.periods[st.cur] : st.next >= 0 ? day.periods.slice(st.next).find(x => !Suite.isPassing(x) && !x.isBreak) : null;
    return Suite.classForPeriod(p, Suite.classes());
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-file]'); if (!b) return;
    const r = await Suite.files.get(b.dataset.file);
    if (r && r.blob) window.open(URL.createObjectURL(r.blob), '_blank'); else Suite.toast("Couldn't find that file");
  });
  function renderAgenda(cls, now){
    const el = $('#agenda');
    if (!cls) { el.innerHTML = ''; return; }
    const key = Suite.dateKey(now), a = Suite.agendaFor(key, cls.id);
    const plan = `planner.html#date=${key}&class=${encodeURIComponent(cls.id)}`;
    if (!a) { el.innerHTML = `<div class="agadd"><a class="btn quiet small" href="${plan}">+ Add today's plan for ${esc(cls.name)}</a></div>`; return; }
    el.innerHTML = `<div class="agendabox">
      <div class="boxhead"><h2>Today in ${esc(cls.name)}</h2><a class="btn quiet small" href="${plan}">Edit</a></div>
      ${a.target ? `<div class="ag-target"><span class="k">Target</span>${esc(a.target)}</div>` : ''}
      ${a.items && a.items.length ? `<ol class="ag-steps">${a.items.map((x, i) => `<li><b>${i + 1}</b>${esc(x)}</li>`).join('')}</ol>` : ''}
      ${a.homework ? `<div class="ag-hw"><span class="k">Homework</span>${esc(a.homework)}</div>` : ''}
      ${(a.materials || []).length ? `<div class="ag-links">${a.materials.map(m => m.kind === 'link'
        ? `<a class="lchip" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title || (m.url || '').replace(/^https?:\/\/(www\.)?/, '').split('/')[0])}</a>`
        : `<button class="lchip" data-file="${esc(m.file.id)}">${esc(m.title || m.file.name)}</button>`).join('')}</div>` : ''}
    </div>`;
  }

  function keepCurrentInView(st){
    const ol = $('#sched'), rows = ol.children, i = st.cur >= 0 ? st.cur : st.next;
    if (i < 0 || !rows[i]) return;
    const anchor = rows[Math.max(0, i - 1)];
    // room after the last period, so late-day periods can still scroll up near the top
    ol.style.paddingBottom = '0px';
    const shown = rows[rows.length - 1].offsetTop + rows[rows.length - 1].offsetHeight - anchor.offsetTop;
    ol.style.paddingBottom = Math.max(0, ol.clientHeight - shown) + 'px';
    const top = anchor.offsetTop - ol.offsetTop;
    const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    ol.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' });
  }

  function renderComing(){
    const now = new Date(), today = Suite.dateKey(now);
    const evToday = Suite.eventsOn(today);
    $('#evtoday').innerHTML = evToday.length ? `<span class="k">Today</span>${evToday.map(e => `<span class="evc">${esc(e.title)}${e.note ? `<span>${esc(e.note)}</span>` : ''}</span>`).join('')}` : '';
    const soon = [];
    for (let i = 1; i <= 7; i++) { const d = new Date(now); d.setDate(d.getDate() + i); const k = Suite.dateKey(d);
      Suite.eventsOn(k).forEach(e => { if (!soon.some(x => x.e.id === e.id) && !evToday.some(x => x.id === e.id)) soon.push({ e, d }); }); }
    const all = Suite.countdowns().filter(cd => Suite.countdownLive(cd, now)).sort((a, b) => Suite.countdownEnd(a) - Suite.countdownEnd(b));
    const list = all.slice(0, soon.length ? 2 : 3), more = all.length - list.length;
    const dayName = k => { const [y, m, dd] = k.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString(undefined, { weekday: 'short' }); };
    const evHtml = soon.slice(0, 3).map(({ e, d }) => `<li class="evli"><span class="what">${esc(e.title)}${e.note ? `<span class="at">${esc(e.note)}</span>` : ''}</span><span class="when"><b class="day">${d.toLocaleDateString(undefined, { weekday: 'short' })}</b>${e.end && e.end !== e.start ? `<span>to ${esc(dayName(e.end))}</span>` : ''}</span></li>`).join('');
    $('#coming').innerHTML = list.length || evHtml ? `<div class="comingbox"><h2>Coming up</h2><ul class="coming">${evHtml}${list.map(cd => {
      const end = Suite.countdownEnd(cd), ms = end - now;
      let when;
      if (cd.time && ms < 86400000) when = `<b class="cdlive" data-end="${end.getTime()}">${Suite.fmtDuration(ms)}</b>`;
      else if (cd.time && !cd.school) {
        const d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000);
        when = `<b>${d}</b><span>day${d === 1 ? '' : 's'}</span><b class="hrs">${h}</b><span>hr${h === 1 ? '' : 's'}</span>`;
      }
      else if (cd.date === today) when = '<b>Today</b>';
      else {
        const n = Suite.daysUntil(cd.date, cd.school);
        when = n === 1 && !cd.school ? '<b>Tomorrow</b>' : `<b>${n}</b><span>${cd.school ? 'school ' : ''}day${n === 1 ? '' : 's'}</span>`;
      }
      const at = cd.time ? `<span class="at">${cd.date === today ? '' : end.toLocaleDateString(undefined, { weekday: 'short' }) + ' '}${Suite.fmt12(cd.time)}</span>` : '';
      return `<li><span class="what">${esc(cd.label)}${at}</span><span class="when">${when}</span></li>`; }).join('')}</ul>
      ${more ? `<a class="small more" href="settings.html#countdowns">+${more} more</a>` : ''}</div>` : '';
    $('#coming').hidden = !$('#coming').innerHTML;
  }
  // live hours:minutes:seconds for timed countdowns in their last day
  function tickCountdowns(){
    let ended = false;
    document.querySelectorAll('.cdlive').forEach(b => { const ms = +b.dataset.end - Date.now(); if (ms <= 0) ended = true; else b.textContent = Suite.fmtDuration(ms); });
    if (ended) renderComing();
  }

  function renderDay(now){
    const day = Suite.scheduleFor(now);
    const st = Suite.periodStatus(day.periods, now);
    const P = day.periods;
    $('#day-label').textContent = day.label;
    $('#day-why').textContent = [day.why, day.offset ? 'Bells shifted ' + (day.offset > 0 ? '+' : '') + day.offset + ' min' : ''].filter(Boolean).join(' · ');
    $('#sched').innerHTML = P.length ? P.map((p, i) => {
      const cls = i === st.cur ? 'now' : secOf(p.end) <= st.sec ? 'past' : '';
      return `<li class="${cls}${Suite.isPassing(p) ? ' pass' : p.staff ? ' staff' : p.isBreak ? ' brk' : ''}"${i === st.cur ? ' aria-current="true"' : ''}><span class="t">${Suite.fmt12(p.start)}</span><span class="n">${esc(p.name)}</span></li>`;
    }).join('') : `<li class="none">No bells today.</li>`;

    let html = '', focus = null;
    if (!P.length) html = `<h1>${esc(day.label)}</h1>`;
    else if (st.cur >= 0 && Suite.isPassing(P[st.cur])) {
      const p = P[st.cur], nx = nextReal(P, st.cur);
      focus = nx;
      html = `<h1>Passing time <span class="range">${nx ? esc(nx.name) + ' starts at ' + Suite.fmt12(nx.start) : 'until ' + Suite.fmt12(p.end)}</span></h1>
        <div class="pline"><div class="progress" role="progressbar" aria-label="Passing time used" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div><div class="left"><span id="left"></span> left</div></div>`;
    }
    else if (st.cur >= 0) {
      const p = P[st.cur], nx = nextReal(P, st.cur);
      focus = p;
      html = `<h1>${esc(p.name)} <span class="range">${Suite.fmt12(p.start).replace(/ (AM|PM)$/, '')} to ${Suite.fmt12(p.end)}</span></h1>
        <div class="pline"><div class="progress" role="progressbar" aria-label="Time through this period" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div><div class="left"><span id="left"></span> left</div></div>
        ${nx ? `<div class="nextup">Next: ${esc(nx.name)} at ${Suite.fmt12(nx.start)}</div>` : ''}`;
    } else if (st.next >= 0) {
      const nx = Suite.isPassing(P[st.next]) ? nextReal(P, st.next) || P[st.next] : P[st.next];
      focus = nx;
      html = `<h1>${st.next === 0 ? 'Before school' : 'Passing time'}</h1>
        <div class="range">${esc(nx.name)} starts at ${Suite.fmt12(nx.start)}</div>
        <div class="left" style="margin-top:8px">Starts in <span id="left"></span></div>`;
    } else html = `<h1>School's out</h1><div class="range">See you tomorrow.</div>`;
    $('#status').innerHTML = html;

    const cls = Suite.classForPeriod(focus, Suite.classes());
    $('#classbox').innerHTML = cls ? `<div class="classbox">
        <div class="boxhead"><h2>${esc(cls.name)} this week</h2><a class="small" href="tracker.html#class=${esc(cls.id)}">Open</a></div>
        ${standings(cls) || '<p class="muted">No points yet this week.</p>'}</div>` : '';
    $('#classbox').hidden = !cls;
    renderAgenda(cls, now);
    renderComing();
    $('#coming').hidden = !$('#coming').innerHTML;
    keepCurrentInView(st);
    return { P, st };
  }

  let state = null;
  function tick(){
    const now = new Date();
    let h = now.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    $('#hm').textContent = h + ':' + String(now.getMinutes()).padStart(2, '0');
    $('#sec').textContent = ':' + String(now.getSeconds()).padStart(2, '0');
    $('#ap').textContent = ap;
    $('#date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

    const day = Suite.scheduleFor(now), st = Suite.periodStatus(day.periods, now);
    const s = Suite.dateKey(now) + '|' + st.cur + '|' + st.next + '|' + day.periods.length;
    if (s !== sig || !state) { sig = s; state = renderDay(now); }
    const { P } = state, sec = st.sec;
    const left = $('#left'), bar = $('#bar');
    if (st.cur >= 0) {
      const a = secOf(P[st.cur].start), b = secOf(P[st.cur].end);
      if (left) left.textContent = mmss(b - sec);
      if (bar) bar.style.width = Math.min(100, (sec - a) / (b - a) * 100).toFixed(1) + '%';
    } else if (st.next >= 0 && left) left.textContent = mmss(secOf(P[st.next].start) - sec);
    tickCountdowns();
  }

  window.addEventListener('suite:change', () => { state = null; tick(); });
  Suite.mountNav('dashboard');
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
