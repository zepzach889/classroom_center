<style>
:root{--ink-blue:#27468a;--ink-red:#c4281c;--ink-green:#3f7d2b;--ink-date:#b8433b}
html,body{height:100%}
body{overflow:hidden;display:flex;flex-direction:column}
.tw{flex:1;min-height:0;display:flex;flex-direction:column}
/* control rail (suite style) */
.rail{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--paper);border-bottom:2px solid var(--rule)}
.rail .pills{display:flex;gap:6px;flex-wrap:wrap}
.rail .pills button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:transparent;border:2px solid var(--edge);border-radius:999px;padding:4px 14px;cursor:pointer;white-space:nowrap}
.rail .pills button[aria-checked="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.rail .status{flex:1;min-width:180px;font-size:14px;color:var(--ink-2);text-align:center}
.rail .status b{color:var(--ink)}
.rail .bar .btn{min-height:36px;padding:4px 14px;font-size:14px}
.steps{display:flex;gap:4px;align-items:center}
.steps i{width:10px;height:10px;border-radius:50%;border:2px solid var(--edge);display:inline-block;cursor:pointer}
.steps i.on{background:var(--land);border-color:var(--land)}
.steps i.lesson{border-radius:3px}
/* stage */
.stage-wrap{flex:1;min-height:0;display:grid;place-items:center;padding:10px;background:#0f1720}
.stage{position:relative;width:min(100%,calc((100vh - var(--navh,70px) - var(--railh,58px) - 20px) * 16 / 9));aspect-ratio:16/9;background:#333 center/cover no-repeat;border-radius:12px;overflow:hidden;container-type:inline-size}
body.full .stage-wrap{padding:0}
body.full .stage{width:min(100vw,100vh * 16 / 9);border-radius:0}
body.full #suite-nav,body.full .rail{display:none}
.region{position:absolute}
.region[hidden]{display:none}
.date{display:grid;place-items:center;justify-items:var(--tj,center);text-align:var(--ta,center)}
#dateText{font-family:var(--bf,Georgia),"Times New Roman",serif;font-weight:700;font-size:calc(3.05cqw * var(--fit,1) * var(--sz,1));color:var(--bc,var(--ink-date));text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.12em;white-space:nowrap}
.board{padding:1.2cqw 3cqw 1.4cqw}
.board-fit{height:100%;overflow:hidden;font-size:calc(2.2cqw * var(--fit,1))}
.heading{margin:0 0 .25em;text-align:var(--hta,center);font-family:"Architects Daughter","Comic Sans MS",cursive;font-weight:400;-webkit-text-stroke:.035em currentColor;font-size:2.1em;line-height:1.1;color:var(--ink-green);letter-spacing:.02em}
.lines{margin:0;padding:0 0 0 1.1em;font-family:"Chelsea Market","Trebuchet MS",sans-serif;font-weight:400;line-height:1.4;list-style:disc}
.lines b{font-weight:700}
.lines li{margin-bottom:.2em;padding-left:.15em}
.lines li.lv1{margin-left:1.6em;list-style-type:circle}
.lines li.lv2{margin-left:3.2em;list-style-type:square}
.lines li.hide{visibility:hidden}
.lines .emph{color:var(--ink-red);text-decoration:underline;text-decoration-thickness:.08em}
.cork{padding:1cqw 1.2cqw}
.cork-fit{height:100%;overflow:hidden;font-size:calc(1.9cqw * var(--fit,1))}
.have-out{margin:0 0 .2em;font-family:"Chelsea Market","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:1.45em;line-height:1.05;white-space:normal;color:var(--ink-green);text-transform:uppercase}
.have-list{margin:0;padding-left:1.1em;font-family:"Chelsea Market","Arial Rounded MT Bold",sans-serif;font-weight:400;line-height:1.35;color:var(--ink-blue);text-transform:uppercase}
.have-list li{white-space:normal;overflow-wrap:normal;word-break:normal}
.rs{position:fixed;inset:0;z-index:90;background:rgba(10,16,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
.rs-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;width:min(1200px,96vw);color:#fff}
.rs-head h2{color:#fff;font-size:22px}
.rs-stage{position:relative;width:min(1200px,96vw,calc((100vh - 170px) * 16 / 9));aspect-ratio:16/9;background:#333 center/cover no-repeat;border-radius:8px;overflow:hidden;touch-action:none}
.rsbox{position:absolute;border:3px dashed var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);cursor:move;touch-action:none}
.rsbox span{position:absolute;left:4px;top:3px;background:var(--c);color:#fff;font:700 13px var(--sans);padding:1px 8px;border-radius:999px;pointer-events:none}
.rsbox i{position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid #fff;cursor:nwse-resize}
.rsbox.off{display:none}
.rs-note{color:#dfe6ec;font-size:14px;margin:0}
.lines{text-align:var(--ta,left)}
.region[style*="--ta:center"] .lines,.region[style*="--ta:right"] .lines{list-style:none;padding-left:0}
.region[style*="--ta:center"] .lines li,.region[style*="--ta:right"] .lines li{list-style:none;margin-left:0;padding-left:0}
.region[style*="--ta:center"] .lines li::before,.region[style*="--ta:right"] .lines li::before{content:"\2022\00a0";}
.region[style*="--ta:center"] .lines li.lv1::before,.region[style*="--ta:right"] .lines li.lv1::before{content:"\25E6\00a0"}
.region[style*="--ta:center"] .lines li.lv2::before,.region[style*="--ta:right"] .lines li.lv2::before{content:"\25AA\00a0"}
.have-out,.have-list{text-align:var(--ta,left)}
.region[style*="--ta:center"] .have-list,.region[style*="--ta:right"] .have-list{list-style:none;padding-left:0}
.region[style*="--ta:center"] .have-list li::before,.region[style*="--ta:right"] .have-list li::before{content:"\2022\00a0"}
.x-fit{text-align:var(--ta,left)}
/* Chelsea Market and Architect's Daughter have no bold of their own, so give bold a little more weight */
#stage b,#stage strong,#stage [style*="font-weight:700"],#stage [style*="font-weight: bold"]{-webkit-text-stroke:.035em currentColor}
.bm{pointer-events:none}
.pic img{width:100%;height:100%;object-fit:contain}
.region{--sz:1}
.board-fit{font-size:calc(2.2cqw * var(--fit,1) * var(--sz,1))}
.cork-fit{font-size:calc(1.9cqw * var(--fit,1) * var(--sz,1))}
.lines{font-family:var(--bf,"Chelsea Market"),"Trebuchet MS",sans-serif}
.have-list{font-family:var(--bf,"Chelsea Market"),"Arial Rounded MT Bold",sans-serif;color:var(--bc,var(--ink-blue))}
.have-out{color:var(--bc,var(--ink-green))}
.x-fit{font-family:var(--bf,"Chelsea Market"),"Trebuchet MS",sans-serif;color:var(--bc,var(--ink-blue));font-size:calc(1.9cqw * var(--fit,1) * var(--sz,1))}
.stage.editing .region.ed{outline:2px dashed rgba(47,111,208,.75);outline-offset:3px}
.stage.editing .region.ed:hover{outline-color:#2f6fd0;outline-style:solid}
.stage.editing .bm.ed,.stage.editing .pic.ed,.stage.editing .timer.ed{pointer-events:auto;cursor:move}
.stage.editing .tool.ed .w-in{pointer-events:none;opacity:.85}
.grip{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:#2f6fd0;color:#fff;display:grid;place-items:center;font:700 16px var(--sans);cursor:move;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.3);touch-action:none}
.rz{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #2f6fd0;cursor:nwse-resize;z-index:5;touch-action:none}
.xdel{position:absolute;right:-12px;top:-12px;width:26px;height:26px;border-radius:50%;border:0;background:#c4281c;color:#fff;font:700 16px/1 var(--sans);cursor:pointer;z-index:5}
.stage.editing [contenteditable]{outline:none;cursor:text;min-height:1em}
.stage.editing [contenteditable]:focus{background:rgba(47,111,208,.06);border-radius:4px}
.stage.editing .lines li.rv{border-bottom:2px dashed rgba(196,40,28,.5)}
.stage.editing .lines li.rv::after{content:" (hidden until click)";font-size:.55em;color:#c4281c;font-family:var(--sans)}
.stage.editing .lines:empty::before,.stage.editing .have-list:empty::before,.stage.editing .x-fit:empty::before{content:"Type here";opacity:.5}
.planned{font:600 1cqw var(--sans);color:#555;background:rgba(255,255,255,.85);border-radius:8px;padding:.4em .7em;margin-top:.6em}
.ftb{position:fixed;z-index:95;display:flex;flex-wrap:wrap;gap:4px;align-items:center;max-width:min(760px,96vw);background:var(--sheet);color:var(--ink);border:2px solid var(--edge);border-radius:14px;padding:6px 8px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.ftb[hidden]{display:none}
.ftb button{font:inherit;font-size:13px;min-width:30px;height:30px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;padding:0 7px;white-space:nowrap}
.ftb button:hover{border-color:var(--edge)}
.ftb button[aria-pressed="true"]{background:var(--sea);color:var(--on-sea);border-color:var(--sea)}
.ftb button svg{display:block}
.ftb .cdot{width:22px;min-width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--edge)}
.ftb select{font:inherit;font-size:13px;height:30px;border-radius:8px}
.ftb .sep{width:1px;height:22px;background:var(--rule);margin:0 2px}
.edhint{max-width:420px}
.pieces{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;width:100%;font-size:14px;padding:2px 0}
.pieces label{display:flex;align-items:center;gap:4px;font-weight:600}
.daybar{display:inline-flex;align-items:center;gap:2px;border:2px solid var(--edge);border-radius:999px;padding:1px 4px}
.daybar .btn.quiet{min-height:0;padding:2px 10px;font-size:18px;line-height:1}
.dpick{position:relative;font-weight:700;font-size:14px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.dpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.dpick input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.dnav{display:flex;align-items:center;gap:4px}
.dnav input{height:34px;font-size:14px;padding:0 8px;width:150px}
.dnav .btn.quiet{font-size:20px;line-height:1;padding:2px 10px;min-height:34px}
.idle-stage{background:var(--sea)}
.idle.st-dashboard{background:var(--sea);color:var(--on-sea,#fff)}
.idle.st-dashboard .i-date{color:var(--ia,var(--land));font-family:var(--sans);letter-spacing:.08em;text-transform:uppercase;font-size:2cqw}
.idle.st-dashboard .i-now{font-family:var(--serif);color:var(--on-sea,#fff);-webkit-text-stroke:0;font-size:6.4cqw}
.idle.st-dashboard .i-left b{color:var(--ia,var(--land))}
.idle.st-board{background:#f4eee1}
.idle.st-board .i-now{color:var(--ia,var(--ink-green))}
.idle.st-dark{background:#151b22;color:#eef1f4}
.idle.st-dark .i-date{color:var(--ia,#ffd27a)}.idle.st-dark .i-now{font-family:var(--sans);font-weight:700;-webkit-text-stroke:0;color:#fff}.idle.st-dark .i-left b{color:var(--ia,#ffd27a)}
.idle.st-light{background:#fff;color:#1d2a35}
.idle.st-light .i-date{color:var(--ia,#2f6fd0)}.idle.st-light .i-now{font-family:var(--sans);font-weight:700;-webkit-text-stroke:0;color:#1d2a35}.idle.st-light .i-left b{color:var(--ia,#2f6fd0)}
.idle .i-msg{font:600 2.4cqw/1.3 var(--sans);max-width:70%;opacity:.95}
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;text-align:center;color:#24323d}
.idle .i-date{font:700 2.6cqw Georgia,serif;color:var(--ink-date)}
.idle .i-now{font:400 7cqw/1.05 "Architects Daughter",cursive;color:var(--ink-green);-webkit-text-stroke:.03em currentColor}
.idle .i-left{font:600 2.2cqw var(--sans)}.idle .i-left b{font-size:4cqw;font-variant-numeric:tabular-nums;margin:0 .4cqw}.idle .i-left span{opacity:.75}
.idle .i-next{font:600 2cqw var(--sans);opacity:.85}
.plannote{background:var(--paper);border:1.5px solid var(--rule);border-radius:12px;padding:8px 12px;font-size:14px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.betanote{background:var(--wash);border-left:4px solid var(--land);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 10px}
.cboard{border:1.5px solid var(--rule);border-radius:12px;padding:8px 10px;margin-bottom:8px}
body.editing-screen .stage-wrap{background:#1b2633;padding-top:64px}
body.editing-screen .stage{width:min(100%,calc((100vh - var(--navh,70px) - var(--railh,58px) - 74px) * 16 / 9))}
.bm img{position:absolute;bottom:0;left:50%;height:100%;width:auto;max-width:none;transform:translateX(-50%)}
.rtb{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--sheet);padding:6px 0 8px;border-bottom:1.5px solid var(--rule);margin-bottom:10px}
.rtb button{font:inherit;font-size:14px;min-width:30px;height:30px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;padding:0 6px}
.rtb button:hover{border-color:var(--edge)}
.rtb .cdot{width:22px;min-width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--edge)}
.rtb select{font:inherit;font-size:13px;height:30px;border-radius:8px}
.rtb .sep{width:1px;height:22px;background:var(--rule);margin:0 2px}
.rline{min-height:30px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:4px 8px;font-family:"Chelsea Market",var(--sans);font-size:15px;line-height:1.35;outline:none}
.rline:focus{border-color:var(--sea);box-shadow:0 0 0 2px rgba(0,0,0,.05)}
.rline:empty::before{content:attr(data-ph);color:var(--ink-2)}
.lrow.lv1 .rline{margin-left:22px}.lrow.lv2 .rline{margin-left:44px}
.bmrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sched li{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:6px;align-items:center;padding:4px 0}
.sched{list-style:none;margin:6px 0;padding:0}
.stage.bg-paper{background-color:#f4eee1;background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.7),transparent 60%),repeating-linear-gradient(0deg,rgba(120,100,70,.035) 0 2px,transparent 2px 5px)}
.stage.bg-chalk{background:#2f3d36;background-image:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.07),transparent 65%),radial-gradient(ellipse at 20% 80%,rgba(255,255,255,.04),transparent 40%);box-shadow:inset 0 0 0 1.4cqw #6b4a2e,inset 0 0 0 1.7cqw #3e2a18}
.stage.bg-cork{background:#c79d68;background-image:radial-gradient(rgba(90,55,20,.25) 1px,transparent 1.6px),radial-gradient(rgba(255,240,210,.18) 1px,transparent 1.8px);background-size:.9cqw .9cqw,1.3cqw 1.3cqw;background-position:0 0,.4cqw .5cqw}
.pn-card{background:rgba(255,255,255,.94);border-radius:1.2cqw;box-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.18)}
.pn-banner{background:#fbf5e6;border:.35cqw solid #d5b26a;border-radius:.8cqw;box-shadow:0 .3cqw .9cqw rgba(0,0,0,.18)}
.pn-dark{background:rgba(18,24,30,.74);border-radius:1.2cqw}
.ink-light{--ink-blue:#b4d0ff;--ink-red:#ff9e93;--ink-green:#b0e8a8;--ink-date:#ffd88a;color:#f4f1ea}
.xbox{padding:1cqw 1.4cqw}
.x-fit{height:100%;overflow:hidden;font-family:"Chelsea Market","Trebuchet MS",sans-serif;font-size:calc(1.9cqw * var(--fit,1));line-height:1.3;color:var(--ink-blue);white-space:pre-wrap}
/* timer: each style is sized from its own box, so nothing floats outside it */
.timer{display:grid;place-items:center;border:0;padding:0;margin:0;cursor:pointer;background:none;container-type:size;color:inherit}
.timer .tm-in{display:grid;place-items:center;width:100%;height:100%}
.timer .tm-num{font-variant-numeric:tabular-nums;line-height:1}
.tm-digital .tm-num{font:700 min(46cqh,16cqw)/1 var(--sans);letter-spacing:.04em;color:#fff;background:var(--tc);padding:8cqh 9cqh;border-radius:16cqh;box-shadow:0 2cqh 6cqh rgba(0,0,0,.25)}
.tm-flip .tm-row{display:flex;align-items:center;gap:min(3cqh,1cqw)}
.tm-flip .fl{font:700 min(50cqh,24cqw)/1 var(--sans);color:#fff;background:linear-gradient(180deg,#3a3f47 0 49%,#24282e 51% 100%);width:min(38cqh,18cqw);height:min(72cqh,34cqw);display:grid;place-items:center;border-radius:6cqh;box-shadow:0 2cqh 5cqh rgba(0,0,0,.3);position:relative}
.tm-flip .fl::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.2cqh;background:rgba(0,0,0,.45)}
.tm-flip .fl-colon{font:700 min(46cqh,20cqw)/1 var(--sans);color:var(--tc)}
.tm-ring .tm-ring{position:relative;height:96cqh;aspect-ratio:1;display:grid;place-items:center}
.tm-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tm-ring .r-bg{fill:rgba(255,255,255,.9);stroke:rgba(0,0,0,.12);stroke-width:8}
.tm-ring .r-fg{fill:none;stroke:var(--tc);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.tm-ring .tm-num{position:relative;font:700 26cqh/1 var(--sans);color:#1f2a33}
.tm-chalk .tm-num{font:400 min(70cqh,30cqw)/1 "Architects Daughter",cursive;color:var(--tc);text-shadow:0 0 .03em currentColor}
.tm-chalk.on-dark .tm-num{color:#f6f3ea;text-shadow:0 0 .06em rgba(255,255,255,.5)}
.tm-minimal .tm-num{font:700 min(70cqh,30cqw)/1 var(--sans);color:var(--tc)}
.tm-minimal.on-dark .tm-num{color:#fff}
.timer.done{animation:blink .6s steps(2,jump-none) 6}
@keyframes blink{50%{opacity:.25}}
/* move-text mode */
.mv{position:absolute;inset:0;z-index:20}
.mvbox{position:absolute;border:3px dashed var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);cursor:move;touch-action:none}
.mvbox .mvl{position:absolute;left:4px;top:3px;display:flex;gap:4px;align-items:center}
.mvbox .mvl b{background:var(--c);color:#fff;font:700 12px var(--sans);padding:1px 8px;border-radius:999px}
.mvbox .mvl button{font:600 11px var(--sans);background:#fff;color:#222;border:1.5px solid var(--c);border-radius:999px;padding:0 7px;cursor:pointer}
.mvbox i{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid #fff;cursor:nwse-resize}
/* lesson and overlay */
.lesson{position:absolute;inset:0;background:#0f1720;z-index:5}
.lesson iframe{width:100%;height:100%;border:0;display:block}
.tmenu{position:relative;display:inline-flex}
.tmenu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:80;min-width:200px;background:var(--sheet);border:2px solid var(--edge);border-radius:14px;padding:6px;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.tmenu-list[hidden]{display:none}
.tmenu-list button{font:inherit;font-size:15px;font-weight:600;text-align:left;background:none;border:0;border-radius:10px;padding:8px 12px;color:var(--ink);cursor:pointer}
.tmenu-list button:hover{background:var(--wash)}
.fstools{position:absolute;right:1cqw;bottom:1cqw;z-index:6;opacity:.35;transition:opacity .15s}
.fstools:hover,.fstools:focus-within{opacity:1}
.lesson .fstools{z-index:6}
.lesson .fstools .btn{background:rgba(15,23,32,.55);color:#fff;border-color:rgba(255,255,255,.5)}
.fstools .tmenu-list{top:auto;bottom:calc(100% + 6px)}
.tool{container-type:size;background:rgba(255,255,255,.92);border-radius:1cqw;box-shadow:0 .3cqw 1cqw rgba(0,0,0,.2);display:grid;place-items:center;overflow:visible;color:#1f2a33}
.tool>.w-in{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;border-radius:inherit}
.w-btn{font:700 max(12px,9cqh) var(--sans);background:#2f6fd0;color:#fff;border:0;border-radius:999px;padding:3cqh 8cqh;cursor:pointer}
.w-btn.sm{font-size:max(11px,8cqh);padding:2.5cqh 5cqh}
.w-pick{display:flex;flex-direction:column;align-items:center;gap:5cqh;width:100%;padding:0 4cqw;text-align:center}
.w-name{font:700 min(26cqh,14cqw) var(--sans);min-height:30cqh;line-height:1.1}
.w-name.pop{animation:wpop .35s ease}
@keyframes wpop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.w-noise{width:88%;display:flex;flex-direction:column;align-items:center;gap:5cqh}
.w-nlab{font:700 min(18cqh,10cqw) var(--sans)}
.w-meter{position:relative;width:100%;height:22cqh;border:2px solid #1f2a33;border-radius:999px;background:#eef1f3;overflow:hidden}
.w-meter span{position:absolute;inset:0 auto 0 0;width:0;background:#5e806b;transition:width .08s linear}
.w-noise[data-z="warn"] .w-meter span{background:#c99a3e}.w-noise[data-z="loud"] .w-meter span{background:#c4281c}
.w-meter i{position:absolute;top:0;bottom:0;width:3px;background:#1f2a33}
.w-timer{display:flex;flex-direction:column;align-items:center;gap:4cqh}
.w-time{font:700 min(40cqh,22cqw)/1 var(--sans);font-variant-numeric:tabular-nums}
.w-row{display:flex;gap:2cqw}
.w-pts{width:88%;font:600 min(9cqh,6cqw) var(--sans)}
.w-ph{font-weight:800;margin-bottom:2cqh}
.w-pr{display:flex;align-items:center;gap:3cqw;padding:1.2cqh 0;border-top:1px solid #dfe3e6}
.w-pr span:nth-child(2){flex:1}.w-pr .dot{width:1.1em;height:1.1em;border-radius:50%;border:1.5px solid #1f2a33}
.bell{position:absolute;z-index:8;background:rgba(18,26,36,.86);color:#fff;font-family:var(--sans);border-radius:1.2cqw;padding:.8cqw 1.4cqw;box-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.3);pointer-events:none;transition:background .3s}
.bell[hidden]{display:none}
.bell .b-main{display:flex;align-items:baseline;gap:.8cqw;white-space:nowrap}
.bell .b-lead{font-size:1.25cqw;font-weight:600;opacity:.9}
.bell .b-time{font-size:2.6cqw;font-weight:800;font-variant-numeric:tabular-nums}
.bell .b-next{font-size:1.05cqw;opacity:.85;margin-top:.15cqw}
.bell .b-msg{font-size:1.4cqw;font-weight:700;margin-top:.5cqw;padding-top:.5cqw;border-top:1px solid rgba(255,255,255,.35)}
.bell.warn{background:rgba(181,121,20,.94)}
.bell.urgent{background:rgba(190,38,28,.95)}
.bell.hasmsg{animation:bellin .5s ease}
@keyframes bellin{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.bell-badge.corner-tr{top:1.2cqw;right:1.2cqw}.bell-badge.corner-tl{top:1.2cqw;left:1.2cqw}.bell-badge.corner-br{bottom:1.2cqw;right:1.2cqw}.bell-badge.corner-bl{bottom:1.2cqw;left:1.2cqw}
.bell-strip{left:0;right:0;border-radius:0;display:flex;align-items:center;justify-content:center;gap:2.5cqw;padding:.7cqw 2cqw}
.bell-strip .b-next,.bell-strip .b-msg{margin:0;padding:0;border:0}
.bell-strip.strip-top{top:0}.bell-strip.strip-bottom{bottom:0}
.bellslot{pointer-events:none;container-type:size;z-index:9}
.bellslot .bell{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4cqh 5cqw;overflow:hidden}
.bellslot .bell .b-lead{font-size:min(10cqh,5.5cqw)}.bellslot .bell .b-time{font-size:min(24cqh,13cqw);line-height:1.05}
.bellslot .bell .b-next{font-size:min(8.5cqh,4.6cqw)}.bellslot .bell .b-msg{font-size:min(9cqh,4.8cqw);line-height:1.2;margin-top:2.5cqh;padding-top:2.5cqh}
.bellbox{border:2px dashed #b57914;background:rgba(181,121,20,.15);display:grid;place-items:center;text-align:center;font:700 1.2cqw var(--sans);color:#7a520e}
.bmsg{display:grid;grid-template-columns:64px auto 1fr auto auto;gap:6px;align-items:center;margin-top:6px}
.evs{display:flex;flex-wrap:wrap;gap:.6cqw;align-items:center;justify-content:center;container-type:size}
.evtag{background:#2f6fd0;color:#fff;border-radius:999px;padding:.35cqw 1.2cqw;font:700 min(58cqh,2.2cqw) var(--sans)}
.evtag small{font-weight:500;margin-left:.6cqw;opacity:.9}
.evtag.ph{background:rgba(47,111,208,.25);color:#1f3f75}
.lessonbtns{position:absolute;left:1cqw;bottom:1cqw;z-index:6;display:flex;gap:.6cqw}
.lessonbtns .backboards{position:static}
.backboards{position:absolute;left:1cqw;bottom:1cqw;z-index:6;font:700 1.1cqw var(--sans);background:rgba(15,23,32,.55);color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:.5cqw 1.2cqw;cursor:pointer;opacity:.35;transition:opacity .15s}
.backboards:hover,.backboards:focus{opacity:1}
.lesson-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:.6em;padding:0 12cqw;font-size:1.6cqw;color:#f4efe4}
.lesson-empty .t{font-family:var(--serif);font-size:2.4em;color:var(--land)}
.overlay{position:fixed;inset:0;z-index:60;background:var(--paper)}
.overlay iframe{width:100%;height:100%;border:0}
.overlay .close{position:fixed;top:12px;right:12px;z-index:61}
/* editing drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:70;background:var(--sheet);color:var(--ink);border-left:2px solid var(--edge);box-shadow:-12px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:2px solid var(--rule)}
.dhead h2{font-size:22px}
.dbody{flex:1;overflow:auto;padding:12px 16px 20px}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:2px solid var(--rule)}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.daynav b{flex:1;text-align:center;font-family:var(--serif);font-weight:400;font-size:19px}
.scope{background:var(--wash);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.scope select{margin-left:6px}
details.sec{border:1.5px solid var(--rule);border-radius:14px;padding:8px 12px;margin-bottom:10px;background:var(--paper)}
details.sec>summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .muted{font-weight:400}
.lineup{list-style:none;margin:0;padding:0}
.lineup li{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--rule)}
.lineup li:first-child{border-top:0}
.lineup li span{flex:1}
.lineup .btn{min-height:0;padding:1px 9px;font-size:14px}
.lrow{display:grid;grid-template-columns:22px 1fr auto auto;gap:6px;align-items:start;margin-top:6px}
.lrow .sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge);cursor:pointer;padding:0}
.lrow input.field{width:100%;min-width:0}
.lrow.lv1 input.field{margin-left:22px;width:calc(100% - 22px)}
.lrow.lv2 input.field{margin-left:44px;width:calc(100% - 44px)}
.lrow .rv{font-size:12px;display:flex;gap:3px;align-items:center;white-space:nowrap}
.lrow .x{min-height:0;padding:1px 8px}
.src{display:flex;gap:12px;font-size:14px;margin:6px 0}
.src label{display:flex;gap:4px;align-items:center}
.fromplan{font-size:14px;background:var(--sheet);border:1.5px dashed var(--rule);border-radius:10px;padding:6px 10px;margin-top:6px}
.fromplan ul{margin:4px 0 0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--edge);border-radius:999px;background:var(--sheet);color:var(--ink);padding:3px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.lb{display:block;font-size:14px;font-weight:700;margin:8px 0 3px}
.dbody .field.wide{width:100%}
.note{font-size:13px;margin:4px 0 0}
.note.warn{color:var(--plum);font-weight:600}
.hintline{font-size:12px;color:var(--ink-2);margin:6px 0 0}
.lookrow{display:grid;grid-template-columns:1fr 160px;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--rule);font-size:15px}
.lookrow:first-of-type{border-top:0}
</style>
</head>
<body>
<header id="suite-nav"></header>
<div class="tw">
  <div class="rail" id="rail"></div>
  <main class="stage-wrap"><div class="stage" id="stage"></div></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Edit this day"></aside>
<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  const clone = x => JSON.parse(JSON.stringify(x));

  /* ---------- backgrounds and where the text goes (measured on 1920x1080) ---------- */
  // Built-in backgrounds are plain and neutral. Every piece of text can be moved, per background.
  const LOOKS = {
    paper: { name: 'Paper', bgStyle: 'paper' },
    chalk: { name: 'Chalkboard', bgStyle: 'chalk', dark: true },
    cork:  { name: 'Corkboard', bgStyle: 'cork' },
    solid: { name: 'Solid color', bgStyle: 'solid' }
  };
  const NEUTRAL = { date: [460, 40, 1000, 100], board: [440, 170, 1040, 600], cork: [1540, 170, 330, 600], timer: [760, 800, 400, 190], bm: [60, 250, 360, 800], pic: [980, 320, 470, 420], bell: [1400, 30, 480, 130], events: [460, 140, 1000, 54] };
  const NEUTRAL_PANELS = {};
  const PANELS = ['none', 'card', 'dark'], PANEL_NAMES = { none: 'No box', card: 'White card', dark: 'Dark card' };
  const BITMOJI = {};
  const BOARDS = {
    welcome:  { label: 'Welcome', heading: 'WELCOME!' },
    warmup:   { label: 'Warm-up', heading: 'WARM-UP' },
    returned: { label: 'Returned work', heading: 'Returned Work' },
    due:      { label: 'Things that are due', heading: 'THINGS THAT ARE DUE' },
    agenda:   { label: "Today's agenda", heading: "TODAY'S AGENDA" }
  };
  const isCustom = t => t === 'custom' || /^c-/.test(t);
  const boardOf = (rec, t) => (rec.boards || {})[t] || { heading: BOARDS[t] ? BOARDS[t].heading : 'MY BOARD', lines: [] };
  const plainOf = h => String(h || '').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&#39;|&apos;/g, "'").replace(/&quot;/g, '"').trim();
  const boardLabel = (rec, t) => BOARDS[t] ? BOARDS[t].label : (plainOf(boardOf(rec, t).heading) || 'Custom board');
  const STARTER_LINES = [
    { color: 'blue', level: 0, text: 'Find your seat and get settled.' },
    { color: 'blue', level: 0, text: 'Get out the materials listed under Have Out.' },
    { color: 'green', level: 0, text: 'Start the warm-up when you are ready.' }];
  const COMMON = ['Pen or pencil', 'Notebook', 'Binder', 'Textbook', 'Laptop', 'Planner', 'Colored pencils', 'Calculator'];
  const INK = { blue: 'var(--ink-blue)', red: 'var(--ink-red)', green: 'var(--ink-green)' }, INK_ORDER = ['blue', 'red', 'green'];

  const BLANK = { mode: 'auto', rows: {}, days: {}, flags: {}, flagBg: null, custom: {}, bitmojis: {}, bmAdj: {}, layouts: {}, bell: null, library: [] };
  let T = Object.assign(clone(BLANK), Suite.get('today', {}));
  T.layouts = T.layouts || {};
  const save = () => Suite.set('today', T);
  let viewDate = Suite.dateKey(new Date()), screen = 0, reveal = 0, lesson = false, full = false, editing = false;
  let editMode = false;   // editing right on the screen
  const urls = {};
  async function fileUrl(id){ if (!id) return null; if (urls[id]) return urls[id]; const r = await Suite.files.get(id); return r && r.blob ? (urls[id] = URL.createObjectURL(r.blob)) : null; }

  /* ---------- classes, courses, and each row's usual setup ---------- */
  const classes = () => Suite.classes();
  const rowKeyOf = cid => { const co = Suite.courseOf(cid); return co ? Suite.courseKey(co.id) : cid; };
  const rowName = cid => { const co = Suite.courseOf(cid); return co ? co.name : (classes().find(c => c.id === cid) || {}).name || ''; };
  function usual(cid){
    const key = rowKeyOf(cid);
    if (!T.rows[key]) {
      T.rows[key] = {
        look: 'paper', bgColor: '#dfe8ee', bitmoji: 'none', schedule: [], deckUrl: '', timer: { on: false, min: 3, auto: false, style: 'digital', color: '#2f6fd0' },
        lineup: ['welcome', 'agenda'],
        haveOut: ['Pen or pencil', 'Notebook'],
        boards: {
          welcome: { heading: BOARDS.welcome.heading, lines: clone(STARTER_LINES) },
          warmup: { heading: BOARDS.warmup.heading, lines: [] },
          returned: { heading: BOARDS.returned.heading, lines: [] },
          due: { heading: BOARDS.due.heading, source: 'plan', lines: [] },
          agenda: { heading: BOARDS.agenda.heading, source: 'plan', lines: [] }
        }
      };
      save();
    }
    return T.rows[key];
  }
  // the day's setup for a class: its own (one period), else its course's, else the usual
  function dayFor(date, cid){
    const d = T.days[date] || {}, own = d[cid], co = d[rowKeyOf(cid)];
    const u = usual(cid), rec = own || co;
    if (!rec) return { lineup: u.lineup, haveOut: u.haveOut, boards: u.boards, slideLink: '' };
    return Object.assign({}, { lineup: u.lineup, haveOut: u.haveOut, slideLink: '' }, rec, { boards: Object.assign({}, u.boards, rec.boards || {}) });
  }
  let scope = 'course';   // edit for the course, or just this period
  function editable(date, cid){
    const key = scope === 'period' ? cid : rowKeyOf(cid);
    T.days[date] = T.days[date] || {};
    if (!T.days[date][key]) { const cur = dayFor(date, cid); T.days[date][key] = clone({ lineup: cur.lineup, haveOut: cur.haveOut, boards: cur.boards, slideLink: cur.slideLink || '' }); }
    return T.days[date][key];
  }

  /* ---------- which class is on screen ---------- */
  function autoPick(){
    const now = new Date(), day = Suite.scheduleFor(now), P = day.periods, st = Suite.periodStatus(P, now), list = classes();
    const real = i => { for (let k = i; k >= 0 && k < P.length; k++) if (!Suite.isPassing(P[k]) && !P[k].isBreak) return P[k]; return null; };
    const cur = st.cur >= 0 && !Suite.isPassing(P[st.cur]) && !P[st.cur].isBreak ? P[st.cur] : null;
    const p = cur || (st.next >= 0 ? real(st.next) : null) || (st.cur >= 0 ? real(st.cur + 1) : null);
    const c = p ? Suite.classForPeriod(p, list) : null;
    const same = c && c.name.trim().toLowerCase() === (p ? p.name : '').trim().toLowerCase();
    if (c) return { cid: c.id, text: cur ? `${same ? '' : p.name + ' '}until ${Suite.fmt12(p.end)}` : `up next${same ? '' : ': ' + p.name} at ${Suite.fmt12(p.start)}`, period: p };
    return { cid: (list[0] || {}).id, text: 'no class right now, so the between-classes screen is up. Pick a class above to plan for it', period: null, idle: true };
  }
  function idleInfo(){
    const now = new Date(), day = Suite.scheduleFor(now), P = day.periods, st = Suite.periodStatus(P, now), list = classes();
    const curP = st.cur >= 0 ? P[st.cur] : null;
    const label = !P.length ? (day.label || 'No school today') : curP ? (Suite.isPassing(curP) ? 'Passing period' : curP.name) : st.next >= 0 ? 'Before school' : 'After school';
    const endHM = curP ? curP.end : st.next >= 0 ? P[st.next].start : null;
    let nx = null; const from = curP ? st.cur + 1 : st.next; for (let i = from; from >= 0 && i < P.length; i++) if (!Suite.isPassing(P[i]) && Suite.classForPeriod(P[i], list)) { nx = P[i]; break; }
    let left = null; if (endHM) { const [h, m] = endHM.split(':').map(Number), e = new Date(now); e.setHours(h, m, 0, 0); left = e - now; }
    const kind = !P.length ? 'none' : !curP ? (st.next >= 0 ? 'before' : 'after') : Suite.isPassing(curP) ? 'passing' : curP.staff ? 'staff' : curP.isBreak ? (/lunch/i.test(curP.name) ? 'lunch' : 'break') : /lunch/i.test(curP.name) ? 'lunch' : 'other';
    // go-home reminder: after the time you set, count up how long you've stayed (off unless turned on)
    const G = idleCfg().goHome; let over = null;
    if (G.on && P.length && G.time && !(curP && !curP.staff && !['after'].includes(kind) && kind !== 'staff')) { const [gh, gm] = G.time.split(':').map(Number), g = new Date(now); g.setHours(gh, gm, 0, 0); if (now >= g) over = now - g; }
    return { label, endHM, left, nx, kind, over };
  }
  const IDLE0 = { style: 'dashboard', color: '', messages: {}, goHome: { on: false, time: '15:45', text: 'Time to head home!' } };
  function idleCfg(){ const c = Object.assign({}, IDLE0, T.idle || {}); c.messages = Object.assign({}, c.messages || {}); c.goHome = Object.assign({}, IDLE0.goHome, c.goHome || {}); return c; }
  const isIdle = () => MODE === 'auto' && !editMode && viewDate === Suite.dateKey(new Date()) && autoPick().idle;
  function idleHtml(){
    const I = idleInfo(), C = idleCfg(), msg = (C.messages[I.kind] || '').trim();
    const style = `st-${C.style || 'dashboard'}`, accent = C.color ? `--ia:${esc(C.color)};` : '';
    if (I.over != null) return `<div class="idle ${style}" style="${accent}"><div class="i-date">${esc(longDate(viewDate))}</div><div class="i-now">${esc(C.goHome.text || 'Time to head home!')}</div>
      <div class="i-left"><span>You've stayed</span> <b id="idleOver">${fmtLeft(I.over)}</b> <span>past ${Suite.fmt12(C.goHome.time)}</span></div></div>`;
    return `<div class="idle ${style}" style="${accent}"><div class="i-date">${esc(longDate(viewDate))}</div><div class="i-now">${esc(I.label)}</div>
      ${msg ? `<div class="i-msg">${esc(msg)}</div>` : ''}
      ${I.left != null && I.left > 0 ? `<div class="i-left"><span>ends in</span> <b id="idleLeft">${fmtLeft(I.left)}</b> <span>at ${Suite.fmt12(I.endHM)}</span></div>` : ''}
      ${I.nx ? `<div class="i-next">Next: ${esc(I.nx.name)} at ${Suite.fmt12(I.nx.start)}</div>` : ''}</div>`;
  }
  const fmtLeft = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };
  // keep the between-classes screen current: redraw when what's happening changes (Advisory → teacher time), otherwise just tick the countdown
  function updateIdle(){
    const now = document.querySelector('#stage .idle .i-now'); if (!now) return;
    const I = idleInfo();
    const showingOver = !!document.getElementById('idleOver');
    if (showingOver !== (I.over != null) || (!showingOver && (now.textContent !== I.label || !!document.getElementById('idleLeft') !== (I.left != null && I.left > 0)))) { render(); return; }
    if (showingOver) { document.getElementById('idleOver').textContent = fmtLeft(I.over); return; }
    const el = document.getElementById('idleLeft'); if (el && I.left != null) el.textContent = fmtLeft(I.left);
  }
  // Which class this window shows belongs to this window only, so a planning window can't change a live display.
  let MODE = (() => { try { return sessionStorage.getItem('suite:today-mode') || 'auto'; } catch (e) { return 'auto'; } })();
  const setMode = m => { MODE = m; try { sessionStorage.setItem('suite:today-mode', m); } catch (e) {} };
  const activeId = () => MODE === 'auto' ? autoPick().cid : (classes().some(c => c.id === MODE) ? MODE : autoPick().cid);

  /* ---------- which boards show, and their content ---------- */
  function boardLines(date, cid, type, rec){
    const b = (rec.boards || {})[type] || {};
    if ((type === 'due' || type === 'agenda') && b.source !== 'custom') {
      const plan = Suite.agendaFor(date, cid) || {};
      if (type === 'agenda') return (plan.items || []).map(t => ({ text: t, color: 'blue', level: 0 }));
      return plan.homework ? plan.homework.split('\n').filter(x => x.trim()).map(t => ({ text: t, color: 'blue', level: 0 })) : [];
    }
    return (b.lines || []).filter(l => (l.text || '').trim() || (l.html && l.html.replace(/<[^>]+>/g, '').trim()));
  }
  function screens(date, cid){
    const rec = dayFor(date, cid);
    return rec.lineup.filter(t => {
      if (!BOARDS[t] && !isCustom(t)) return false;            // retired boards (like the old Flag of the Week) are skipped
      if (editMode || t === 'welcome') return true;            // while editing, every board shows so you can type into it
      if (isCustom(t)) return true;
      return boardLines(date, cid, t, rec).length;
    });
  }
  const hiddenCount = (date, cid, type) => editMode ? 0 : boardLines(date, cid, type, dayFor(date, cid)).filter(l => l.reveal).length;

  /* ---------- drawing ---------- */

    const el = document.getElementById('bellRem'); if (!el) return;
    const B = bellCfg(), today = viewDate === Suite.dateKey(new Date());
    let info = B.on && today && !editMode ? bellInfo() : null;
    if (bellPreview > Date.now()) info = { p: { name: 'Period 2' }, left: 2 * 60000 + 30000, passing: false, brk: false, nx: { name: 'Period 3', start: '10:09' }, key: 'preview', preview: true };
    if (!info || info.staff || (lesson && !B.overLesson)) { el.hidden = true; return; }
    const limit = info.passing ? Infinity : B.minutes * 60000;
    if (info.left > limit || info.left <= 0) { el.hidden = true; return; }
    const secs = Math.ceil(info.left / 1000), mmss = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
    // a message is due once the time left drops under its mark; the chime plays once
    let msg = null;
    if (!info.passing && !info.brk) (B.messages || []).filter(x => x.text && x.min > 0).sort((a, b) => a.min - b.min).forEach(x => {
      if (info.left <= x.min * 60000 && !msg) { msg = x; const k = info.key + '|' + x.min; if (!fired.has(k) && info.left > x.min * 60000 - 3000) { fired.add(k); if (x.chime && Suite.chime) Suite.chime(); } else fired.add(k); }
    });
    const lead = info.passing ? 'Passing period' : info.brk ? info.p.name + ' ends in' : 'Class ends in';
    const next = info.nx ? `${info.passing ? '' : 'Next: '}${esc(info.nx.name)}${info.passing ? ' starts' : ''} at ${Suite.fmt12(info.nx.start)}` : '';
    el.innerHTML = `<div class="b-main"><span class="b-lead">${lead}</span><span class="b-time">${mmss}</span></div>${next ? `<div class="b-next">${next}</div>` : ''}${msg ? `<div class="b-msg">${esc(msg.text)}</div>` : ''}`;
    el.classList.toggle('warn', info.left <= B.minutes * 60000 && info.left > 60000);
    el.classList.toggle('urgent', info.left <= 60000);
    el.classList.toggle('hasmsg', !!msg);
    el.hidden = false;
  }
  setInterval(() => { updateBell(); updateIdle(); }, 500);

  /* ---------- suite tools: open one on top, or place one on a board ---------- */
  const TOOL_PAGES = { spinner: ['Name spinner', 'spinner.html'], groups: ['Partners and groups', 'activities.html', 'tool=groups'], noise: ['Noise meter', 'noise.html'], tally: ['Tally', 'activities.html', 'tool=tally'], points: ['Table points', 'tracker.html'], timer: ['Timer'] };
  const WIDGETS = { picker: ['Name picker', [1500, 760, 380, 240]], noise: ['Noise meter', [1440, 820, 440, 200]], points: ['Points standings', [1500, 640, 380, 380]], timer: ['Class timer', [1500, 820, 380, 200]] };
  function openTool(kind){
    if (kind === 'timer') { Suite.openTimer(); return; }
    const t = TOOL_PAGES[kind], cid = activeId();
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<button class="btn close" data-o="close">Back to the board</button><iframe title="${esc(t[0])}" src="${t[1]}?embed&proj#${t[2] ? t[2] + '&' : ''}class=${encodeURIComponent(cid || '')}"></iframe>`;
    document.body.appendChild(ov);
    const close = () => { ov.remove(); window.removeEventListener('message', onMsg); };
    const onMsg = ev => { if (ev.origin === location.origin && ev.data && ev.data.suite === 'close') close(); };
    window.addEventListener('message', onMsg);
    ov.addEventListener('click', ev => { if (ev.target.closest('[data-o="close"]')) close(); });
  }
  const toolMenu = (act, title, list) => `<span class="tmenu"><button class="btn" data-a="tmenu" aria-haspopup="true" title="${title}">${act === 'addtool' ? 'Add a tool' : 'Tools'} ▾</button><span class="tmenu-list" hidden>${Object.entries(list).map(([k, v]) => `<button data-a="${act}" data-id="${k}">${esc(v[0])}</button>`).join('')}</span></span>`;
  // the widgets themselves
  const picked = {};   // names already picked this session, per class
  function widgetHtml(kind, w){
    if (kind === 'picker') return `<div class="w-pick"><div class="w-name" data-w="name">${esc(w.last || '')}</div><button class="w-btn" data-w="pick">Pick a name</button></div>`;
    if (kind === 'noise') return `<div class="w-noise"><div class="w-nlab" data-w="nlab">${mic ? '' : 'Noise meter'}</div><div class="w-meter"><span data-w="nbar"></span><i style="left:${(Suite.get('noise', {}) || {}).line || 60}%"></i></div>${mic ? '' : '<button class="w-btn" data-w="mic">Start listening</button>'}</div>`;
    if (kind === 'timer') { const t = Suite.timerState(); return `<div class="w-timer"><div class="w-time" data-w="time">${Suite.fmtDuration(t.left || 0)}</div><div class="w-row">${[1, 3, 5].map(m => `<button class="w-btn sm" data-w="tstart" data-m="${m}">${m} min</button>`).join('')}<button class="w-btn sm" data-w="ttog">${t.state === 'running' ? 'Pause' : 'Go'}</button></div></div>`; }
    if (kind === 'points') {
      const c = classes().find(x => x.id === activeId()), T0 = Object.assign({ quarter: 1, week: 1, log: [] }, Suite.get('tracker', {}));
      if (!c || !Suite.feature('points')) return '<div class="w-pts muted">Points are turned off.</div>';
      const rows = Suite.activeTables(c).map(t => ({ t, n: T0.log.reduce((a, e) => a + (e.c === c.id && e.t === t.id && e.q === T0.quarter && e.w === T0.week ? e.d : 0), 0) })).sort((a, b) => b.n - a.n);
      return `<div class="w-pts"><div class="w-ph">${esc(Suite.word('team', { cap: true }))} points</div>${rows.map(r => `<div class="w-pr"><span class="dot" style="background:${esc(r.t.color)}"></span><span>${esc(r.t.name)}</span><b>${r.n}</b></div>`).join('')}</div>`;
    }
    return '';
  }
  // the noise meter widget shares the Noise meter page's calibration
  let mic = null;
  async function startMic(){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const ctx = new (window.AudioContext || window.webkitAudioContext)(), an = ctx.createAnalyser(); an.fftSize = 2048;
      const h1 = ctx.createBiquadFilter(), h2 = ctx.createBiquadFilter(); [h1, h2].forEach(f => { f.type = 'highpass'; f.frequency.value = 300; });
      ctx.createMediaStreamSource(stream).connect(h1); h1.connect(h2); h2.connect(an);
      mic = { stream, ctx, an, buf: new Float32Array(an.fftSize), level: 0 }; render(); micTick();
    } catch (e) { Suite.toast("The microphone isn't available here"); }
  }
  function micTick(){
    if (!mic) return;
    mic.an.getFloatTimeDomainData(mic.buf); let sum = 0; for (let i = 0; i < mic.buf.length; i++) sum += mic.buf[i] * mic.buf[i];
    const db = 20 * Math.log10(Math.sqrt(sum / mic.buf.length) + 1e-9), N = Object.assign({ line: 60, sens: 5, base: null }, Suite.get('noise', {}) || {});
    const floor = N.base != null ? N.base + 3 : -66 - (N.sens - 1) * 4, range = N.base != null ? 20 + (10 - N.sens) * 6 : 60;
    mic.level = mic.level * .88 + Math.max(0, Math.min(100, (db - floor) / range * 100)) * .12;
    document.querySelectorAll('[data-w="nbar"]').forEach(b => { b.style.width = mic.level.toFixed(1) + '%'; b.parentElement.parentElement.dataset.z = mic.level < N.line * .7 ? 'ok' : mic.level < N.line ? 'warn' : 'loud'; });
    document.querySelectorAll('[data-w="nlab"]').forEach(l => { l.textContent = mic.level < N.line * .7 ? 'Nice and quiet' : mic.level < N.line ? 'Getting loud' : 'Too loud'; });
    requestAnimationFrame(micTick);
  }
  window.addEventListener('pagehide', () => { if (mic) { mic.stream.getTracks().forEach(t => t.stop()); try { mic.ctx.close(); } catch (e) {} } });
  setInterval(() => { const t = Suite.timerState(); document.querySelectorAll('[data-w="time"]').forEach(el => { el.textContent = Suite.fmtDuration(t.left || 0); }); document.querySelectorAll('[data-w="ttog"]').forEach(b => { b.textContent = t.state === 'running' ? 'Pause' : 'Go'; }); }, 300);
  window.addEventListener('suite:change', e => { if (e.detail && e.detail.key === 'tracker' && document.querySelector('.w-pts')) render(); });
  $('#stage').addEventListener('click', e => {
    const b = e.target.closest('[data-w]'); if (!b || editMode) return;
    const w = b.dataset.w;
    if (w === 'pick') {
      const c = classes().find(x => x.id === activeId()); if (!c || !c.students.length) { Suite.toast('No students in this class yet'); return; }
      const sp = Suite.get('spinner', {}) || {}, a = sp.absent && sp.absent[c.id], away = a && a.date === Suite.dateKey(new Date()) ? new Set(a.ids) : new Set();
      const used = picked[c.id] = picked[c.id] || new Set(); let pool = c.students.filter(s => !away.has(s.id) && !used.has(s.id));
      if (!pool.length) { used.clear(); pool = c.students.filter(s => !away.has(s.id)); }
      const s = pool[Math.floor(Math.random() * pool.length)]; used.add(s.id);
      const box = b.closest('.w-pick').querySelector('[data-w="name"]'); box.textContent = s.name; box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    }
    else if (w === 'mic') startMic();
    else if (w === 'tstart') Suite.timerStart(+b.dataset.m * 60000);
    else if (w === 'ttog') Suite.timerToggle();
  });

  /* ---------- buttons and keys ---------- */
  document.addEventListener('click', e => { if (!e.target.closest('.tmenu')) document.querySelectorAll('.tmenu-list').forEach(x => { x.hidden = true; }); }, true);
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el) { if (!editMode && e.target.closest('#rTimer')) toggleTimer(); return; }
    const a = el.dataset.a, cid = activeId();
    if (a === 'mode') { setMode(el.dataset.id); screen = 0; reveal = 0; lesson = false; if (!timer.running) resetTimer(activeId()); render(); if (editing) renderDrawer(); }
    else if (a === 'next') next();
    else if (a === 'prev') prev();
    else if (a === 'go') { if (el.dataset.i === 'lesson') lesson = true; else { lesson = false; screen = +el.dataset.i; reveal = 0; } render(); }
    else if (a === 'timer') toggleTimer();
    else if (a === 'lesson') { lesson = true; render(); }
    else if (a === 'boards') { lesson = false; render(); }
    else if (a === 'openslides') openInSlides(cid);
    else if (a === 'edit') { editing = !editing; $('#drawer').hidden = !editing; if (editing) renderDrawer(); }
    else if (a === 'full') { full = !full; if (full && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); else if (!full && document.fullscreenElement) document.exitFullscreen().catch(() => {}); render(); }
    else if (a === 'startedit') startEdit();
    else if (a === 'dprev' || a === 'dnext' || a === 'dtoday') { viewDate = a === 'dtoday' ? Suite.dateKey(new Date()) : shiftDay(viewDate, a === 'dnext' ? 1 : -1); screen = 0; reveal = 0; lesson = false; render(); if (editing) renderDrawer(); }
    else if (a === 'dayprev' || a === 'daynext' || a === 'daytoday') { viewDate = a === 'daytoday' ? Suite.dateKey(new Date()) : shiftDay(viewDate, a === 'dayprev' ? -1 : 1); screen = 0; reveal = 0; lesson = false; render(); if (editing) renderDrawer(); }
    else if (a === 'piece') { const t = screens(viewDate, cid)[screen], r = editable(viewDate, cid), bd = r.boards[t] = r.boards[t] || clone(boardOf(r, t)); bd.hide = bd.hide || {}; if (el.checked) delete bd.hide[el.dataset.k]; else bd.hide[el.dataset.k] = true; save(); render(); return; }
    else if (a === 'tmenu') { const l = el.parentElement.querySelector('.tmenu-list'); document.querySelectorAll('.tmenu-list').forEach(x => { if (x !== l) x.hidden = true; }); l.hidden = !l.hidden; return; }
    else if (a === 'opentool') { el.closest('.tmenu-list').hidden = true; openTool(el.dataset.id); }
    else if (a === 'addtool') { el.closest('.tmenu-list').hidden = true; const r = editable(viewDate, cid), t = $('#stage').dataset.type, bd = r.boards[t] = r.boards[t] || clone(boardOf(r, t)); bd.tools = bd.tools || [];
      // find an open spot so new tools don't stack on top of each other
      const over = (a, b2) => a[0] < b2[0] + b2[2] && b2[0] < a[0] + a[2] && a[1] < b2[1] + b2[3] && b2[1] < a[1] + a[3];
      const box = WIDGETS[el.dataset.id][1].slice(); for (let n = 0; n < 12 && bd.tools.some(w => over(box, w.box)); n++) { box[0] -= box[2] + 20; if (box[0] < 0) { box[0] = 1920 - box[2] - 40; box[1] = Math.max(20, box[1] - box[3] - 20); } }
      bd.tools.push({ id: Suite.uid(), kind: el.dataset.id, box }); save(); render(); Suite.toast(WIDGETS[el.dataset.id][0] + ' added to this board. Drag it into place.'); }
    else if (a === 'editdone') endEdit();
    else if (a === 'settings') { editing = true; $('#drawer').hidden = false; renderDrawer(); }
    else if (a === 'xaddbox') { const lay = ownLayout($('#stage').dataset.look); lay.extras.push({ id: Suite.uid(), box: [760, 420, 460, 200], panel: 'none', html: '' }); save(); render().then(() => { const x = [...document.querySelectorAll('.x-fit[contenteditable]')].pop(); if (x) { x.focus(); document.execCommand('selectAll'); } }); }
  });
  document.addEventListener('pointerdown', e => {
    if (!editing || $('#drawer').hidden) return;
    if (e.target.closest('#drawer, .suite-dialog-back, .overlay, [data-a="edit"], [data-a="settings"], .tmenu')) return;
    editing = false; $('#drawer').hidden = true;
  });
  document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.a === 'daypick' && e.target.value) { viewDate = e.target.value; screen = 0; reveal = 0; lesson = false; render(); if (editing) renderDrawer(); } });
  document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.a2 === 'dpick' && e.target.value) { viewDate = e.target.value; screen = 0; reveal = 0; lesson = false; render(); if (editing) renderDrawer(); } });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && full) { full = false; render(); } });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('.suite-dialog') || document.querySelector('.overlay') || document.body.classList.contains('timer-open')) return;
    if (/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '') || (e.target && e.target.isContentEditable)) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (editMode) { if (k === 'Escape') endEdit(); return; }
    else if (editing && k !== 'Escape') return;      // letters are for typing while the edit drawer is open
    else if (k === 't' || k === 'T') toggleTimer();
    else if (k === 'r' || k === 'R') { resetTimer(); drawTimer(); renderRail(activeId()); }
    else if (k === 'l' || k === 'L') { lesson = !lesson; render(); }
    else if (k === 'e' || k === 'E') startEdit();
    else if (k === 'f' || k === 'F') { full = !full; render(); }
    else if (k === 'Escape') { if (editing) { editing = false; $('#drawer').hidden = true; } else if (full) { full = false; render(); } }
  });
  window.addEventListener('resize', () => requestAnimationFrame(fitAll));
  // the Today page never scrolls; if typing nudges it, put it back so the bar above the slide stays visible
  window.addEventListener('scroll', () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); });
  // refit whenever the slide or any box changes size, and once more after fonts finish loading
  if (window.ResizeObserver) { let rq = 0; const ro = new ResizeObserver(() => { cancelAnimationFrame(rq); rq = requestAnimationFrame(fitAll); }); ro.observe($('#stage')); }
  window.addEventListener('suite:change', e => {
    if (!e.detail || !(e.detail.external || e.detail.key === '*')) return;
    if (e.detail.key && e.detail.key !== 'today' && e.detail.key !== '*' && !['classes', 'agenda', 'events', 'schedule', 'courses'].includes(e.detail.key)) return;
    T = Object.assign(clone(BLANK), Suite.get('today', {})); T.layouts = T.layouts || {};
    if (lesson) { renderRail(activeId()); updateBell(); return; }         // the slides keep their place
    if (editMode && document.activeElement && document.activeElement.closest && document.activeElement.closest('#stage [data-f]')) return;   // don't redraw under your cursor
    render();
  });
  { const md = location.hash.match(/date=(\d{4}-\d{2}-\d{2})/), mc = location.hash.match(/class=([\w-]+)/);
    if (md) viewDate = md[1];
    if (mc && classes().some(c => c.id === decodeURIComponent(mc[1]))) setMode(decodeURIComponent(mc[1])); }
  Suite.mountNav('today');
  resetTimer(activeId()); lastCid = activeId();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(fitAll));
})();
