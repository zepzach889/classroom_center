<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · Classroom Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@400;500;600;700;800&family=Bungee&family=EB+Garamond:wght@700&family=Architects+Daughter&family=Chelsea+Market&family=Courier+Prime:ital,wght@1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=2026-10-03b">
<script src="shared/core.js?v=2026-10-03b"></script>
<script>window.PAGE_VERSION = '2026-10-03b';</script>
<style>
:root{--ink-blue:#27468a;--ink-red:#c4281c;--ink-green:#3f7d2b;--ink-date:#b8433b}
html,body{height:100%}
body{overflow:hidden;display:flex;flex-direction:column}
.tw{flex:1;min-height:0;display:flex;flex-direction:column}
/* control rail (suite style) */
.rail{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--paper);border-bottom:2px solid var(--rule)}
.rail .pills{display:flex;gap:6px;flex-wrap:wrap}
.rail .pills button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:transparent;border:2px solid var(--edge);border-radius:999px;padding:4px 14px;cursor:pointer;white-space:nowrap}
.rail .pills button[aria-checked="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.rail .status{flex:1;min-width:180px;font-size:14px;color:var(--ink-2);text-align:center}
.rail .status b{color:var(--ink)}
.rail .bar .btn{min-height:36px;padding:4px 14px;font-size:14px}
.steps{display:flex;gap:4px;align-items:center}
.steps i{width:10px;height:10px;border-radius:50%;border:2px solid var(--edge);display:inline-block;cursor:pointer}
.steps i.on{background:var(--land);border-color:var(--land)}
.steps i.lesson{border-radius:3px}
/* stage */
.stage-wrap{flex:1;min-height:0;display:grid;place-items:center;padding:10px;background:#0f1720}
.stage{position:relative;width:min(100%,calc((100vh - var(--navh,70px) - var(--railh,58px) - 20px) * 16 / 9));aspect-ratio:16/9;background:#333 center/cover no-repeat;border-radius:12px;overflow:hidden;container-type:inline-size}
body.full .stage-wrap{padding:0}
body.full .stage{width:min(100vw,100vh * 16 / 9);border-radius:0}
body.full #suite-nav,body.full .rail{display:none}
.region{position:absolute}
.region[hidden]{display:none}
.date{display:grid;place-items:center;text-align:center}
#dateText{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:calc(3.05cqw * var(--fit,1));color:var(--ink-date);text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.12em;white-space:nowrap}
.board{padding:1.2cqw 3cqw 1.4cqw}
.board-fit{height:100%;overflow:hidden;font-size:calc(2.2cqw * var(--fit,1))}
.heading{margin:0 0 .25em;text-align:center;font-family:"Architects Daughter","Comic Sans MS",cursive;font-weight:400;-webkit-text-stroke:.035em currentColor;font-size:2.1em;line-height:1.1;color:var(--ink-green);letter-spacing:.02em}
.lines{margin:0;padding:0 0 0 1.1em;font-family:"Chelsea Market","Trebuchet MS",sans-serif;font-weight:400;line-height:1.4;list-style:disc}
.lines b{font-weight:700}
.lines li{margin-bottom:.2em;padding-left:.15em}
.lines li.lv1{margin-left:1.6em;list-style-type:circle}
.lines li.lv2{margin-left:3.2em;list-style-type:square}
.lines li.hide{visibility:hidden}
.lines .emph{color:var(--ink-red);text-decoration:underline;text-decoration-thickness:.08em}
.cork{padding:1cqw 1.2cqw}
.cork-fit{height:100%;overflow:hidden;font-size:calc(1.9cqw * var(--fit,1))}
.have-out{margin:0 0 .2em;font-family:"Chelsea Market","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:1.45em;line-height:1.05;color:var(--ink-green);text-transform:uppercase;white-space:nowrap}
.have-list{margin:0;padding-left:1.1em;font-family:"Chelsea Market","Arial Rounded MT Bold",sans-serif;font-weight:400;line-height:1.35;color:var(--ink-blue);text-transform:uppercase}
.have-list li{white-space:nowrap}
.basicroom{position:absolute;inset:0;background:linear-gradient(180deg,#3f6f78 0%,#36616a 76%,#9a6e45 76%,#b78655 100%)}
.br-banner{position:absolute;background:#f7eedb;border:.45cqw solid #c79a45;border-radius:.5cqw;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.25)}
.br-board{position:absolute;background:#fbfbf8;border:.6cqw solid #b9c0c6;border-radius:.4cqw;box-shadow:0 .4cqw 1cqw rgba(0,0,0,.25)}
.br-cork{position:absolute;background:#c99a62;border:.7cqw solid #1f3d63;border-radius:.4cqw;box-shadow:inset 0 0 2cqw rgba(90,55,20,.35),0 .4cqw 1cqw rgba(0,0,0,.25)}
.rs{position:fixed;inset:0;z-index:90;background:rgba(10,16,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
.rs-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;width:min(1200px,96vw);color:#fff}
.rs-head h2{color:#fff;font-size:22px}
.rs-stage{position:relative;width:min(1200px,96vw,calc((100vh - 170px) * 16 / 9));aspect-ratio:16/9;background:#333 center/cover no-repeat;border-radius:8px;overflow:hidden;touch-action:none}
.rsbox{position:absolute;border:3px dashed var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);cursor:move;touch-action:none}
.rsbox span{position:absolute;left:4px;top:3px;background:var(--c);color:#fff;font:700 13px var(--sans);padding:1px 8px;border-radius:999px;pointer-events:none}
.rsbox i{position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid #fff;cursor:nwse-resize}
.rsbox.off{display:none}
.rs-note{color:#dfe6ec;font-size:14px;margin:0}
.bm{pointer-events:none}
.bm img{position:absolute;bottom:0;left:50%;height:100%;width:auto;max-width:none;transform:translateX(-50%)}
.rtb{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--sheet);padding:6px 0 8px;border-bottom:1.5px solid var(--rule);margin-bottom:10px}
.rtb button{font:inherit;font-size:14px;min-width:30px;height:30px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;padding:0 6px}
.rtb button:hover{border-color:var(--edge)}
.rtb .cdot{width:22px;min-width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--edge)}
.rtb select{font:inherit;font-size:13px;height:30px;border-radius:8px}
.rtb .sep{width:1px;height:22px;background:var(--rule);margin:0 2px}
.rline{min-height:30px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:4px 8px;font-family:"Chelsea Market",var(--sans);font-size:15px;line-height:1.35;outline:none}
.rline:focus{border-color:var(--sea);box-shadow:0 0 0 2px rgba(0,0,0,.05)}
.rline:empty::before{content:attr(data-ph);color:var(--ink-2)}
.lrow.lv1 .rline{margin-left:22px}.lrow.lv2 .rline{margin-left:44px}
.bmrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sched li{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:6px;align-items:center;padding:4px 0}
.sched{list-style:none;margin:6px 0;padding:0}
.timer{display:grid;place-items:center;border:0;padding:0;cursor:pointer;background:radial-gradient(ellipse at 50% 60%,#1a1712 0%,#07090b 70%)}
.bulbs{font-family:"Bungee",Impact,sans-serif;font-size:7.4cqw;letter-spacing:.06em;line-height:1;color:#ffd98a;background:radial-gradient(circle at 50% 50%,#fff6d6 0 28%,#ffc85a 34%,rgba(255,200,90,0) 52%) 0 0/.13em .13em;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 .08em rgba(255,196,80,.75)) drop-shadow(0 0 .25em rgba(255,160,40,.35))}
.timer.done .bulbs{animation:blink .6s steps(2,jump-none) 6}
@keyframes blink{50%{opacity:.25}}
/* flag of the week */
.flagboard{position:absolute;inset:0;background:#e9d9b6 center/cover no-repeat}
.flagboard.plain{background:radial-gradient(ellipse at 30% 30%,#f3e6c6,#dcc59a 70%,#c9ae7f)}
.fbox{position:absolute;background:#8fa1a8;border:.45cqw solid #fff;border-radius:1cqw;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.f-title{font-family:"EB Garamond",Georgia,serif;font-weight:700;font-size:3.1cqw;letter-spacing:.02em;padding-bottom:.6cqw;border-bottom:.3cqw solid #fff;width:82%;line-height:1.1}
.f-sub{font-family:"Courier Prime","Courier New",monospace;font-style:italic;font-weight:700;font-size:2.9cqw;margin-top:.8cqw}
.f-sub.answer{font-size:3.1cqw;color:#fff8d6}
.f-prompt{font-family:"Courier Prime","Courier New",monospace;font-style:italic;font-weight:700;font-size:1.75cqw;line-height:1.5;padding:0 2cqw}
.fimg{position:absolute;background:#fff;border:.45cqw solid #fff;border-radius:.6cqw;display:grid;place-items:center;overflow:hidden}
.fimg img{max-width:100%;max-height:100%;object-fit:contain}
.fimg .noimg{font-family:"Courier Prime",monospace;font-size:1.6cqw;color:#8a7d66;padding:2cqw;text-align:center}
.f-draw{position:absolute;right:3cqw;bottom:3cqw;font:700 1.5cqw var(--sans);background:var(--land);color:var(--on-land);border:0;border-radius:999px;padding:.8cqw 2cqw;cursor:pointer}
.flagboard .qmark{position:absolute;right:8cqw;top:50%;transform:translateY(-50%);font-family:"EB Garamond",serif;font-size:30cqw;color:rgba(120,90,50,.18);line-height:1}
/* lesson and overlay */
.lesson{position:absolute;inset:0;background:#0f1720;z-index:5}
.lesson iframe{width:100%;height:100%;border:0;display:block}
.lesson-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:.6em;padding:0 12cqw;font-size:1.6cqw;color:#f4efe4}
.lesson-empty .t{font-family:var(--serif);font-size:2.4em;color:var(--land)}
.overlay{position:fixed;inset:0;z-index:60;background:var(--paper)}
.overlay iframe{width:100%;height:100%;border:0}
.overlay .close{position:fixed;top:12px;right:12px;z-index:61}
/* editing drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:70;background:var(--sheet);color:var(--ink);border-left:2px solid var(--edge);box-shadow:-12px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:2px solid var(--rule)}
.dhead h2{font-size:22px}
.dbody{flex:1;overflow:auto;padding:12px 16px 20px}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:2px solid var(--rule)}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.daynav b{flex:1;text-align:center;font-family:var(--serif);font-weight:400;font-size:19px}
.scope{background:var(--wash);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.scope select{margin-left:6px}
details.sec{border:1.5px solid var(--rule);border-radius:14px;padding:8px 12px;margin-bottom:10px;background:var(--paper)}
details.sec>summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .muted{font-weight:400}
.lineup{list-style:none;margin:0;padding:0}
.lineup li{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--rule)}
.lineup li:first-child{border-top:0}
.lineup li span{flex:1}
.lineup .btn{min-height:0;padding:1px 9px;font-size:14px}
.lrow{display:grid;grid-template-columns:22px 1fr auto auto;gap:6px;align-items:start;margin-top:6px}
.lrow .sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge);cursor:pointer;padding:0}
.lrow input.field{width:100%;min-width:0}
.lrow.lv1 input.field{margin-left:22px;width:calc(100% - 22px)}
.lrow.lv2 input.field{margin-left:44px;width:calc(100% - 44px)}
.lrow .rv{font-size:12px;display:flex;gap:3px;align-items:center;white-space:nowrap}
.lrow .x{min-height:0;padding:1px 8px}
.src{display:flex;gap:12px;font-size:14px;margin:6px 0}
.src label{display:flex;gap:4px;align-items:center}
.fromplan{font-size:14px;background:var(--sheet);border:1.5px dashed var(--rule);border-radius:10px;padding:6px 10px;margin-top:6px}
.fromplan ul{margin:4px 0 0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--edge);border-radius:999px;background:var(--sheet);color:var(--ink);padding:3px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.lb{display:block;font-size:14px;font-weight:700;margin:8px 0 3px}
.dbody .field.wide{width:100%}
.note{font-size:13px;margin:4px 0 0}
.note.warn{color:var(--plum);font-weight:600}
.hintline{font-size:12px;color:var(--ink-2);margin:6px 0 0}
.lookrow{display:grid;grid-template-columns:1fr 160px;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--rule);font-size:15px}
.lookrow:first-of-type{border-top:0}
</style>
</head>
<body>
<header id="suite-nav"></header>
<div class="tw">
  <div class="rail" id="rail"></div>
  <main class="stage-wrap"><div class="stage" id="stage"></div></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Edit this day"></aside>
<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  const clone = x => JSON.parse(JSON.stringify(x));

  /* ---------- backgrounds and where the text goes (measured on 1920x1080) ---------- */
  // The built-in room is drawn, not a picture. Teachers upload their own rooms and bitmojis (saved in their browser).
  const LOOKS = {
    basic: { name: 'Simple classroom', basic: true, date: [520, 48, 880, 96], board: [470, 196, 980, 520], cork: [1560, 196, 300, 500], timer: [760, 790, 400, 210], bm: [70, 210, 380, 850] }
  };
  const BITMOJI = {};
  const BOARDS = {
    welcome:  { label: 'Welcome', heading: 'WELCOME!' },
    flag:     { label: 'Flag of the Week', heading: 'FLAG OF THE WEEK' },
    warmup:   { label: 'Warm-up', heading: 'WARM-UP' },
    returned: { label: 'Returned work', heading: 'Returned Work' },
    due:      { label: 'Things that are due', heading: 'THINGS THAT ARE DUE' },
    agenda:   { label: "Today's agenda", heading: "TODAY'S AGENDA" },
    custom:   { label: 'Custom board', heading: 'REMINDERS' }
  };
  const STARTER_LINES = [
    { color: 'blue', level: 0, text: 'Find your seat and get settled.' },
    { color: 'blue', level: 0, text: 'Get out the materials listed under Have Out.' },
    { color: 'green', level: 0, text: 'Start the warm-up when you are ready.' }];
  const COMMON = ['Pen or pencil', 'Notebook', 'Binder', 'Textbook', 'Laptop', 'Planner', 'Colored pencils', 'Calculator'];
  const INK = { blue: 'var(--ink-blue)', red: 'var(--ink-red)', green: 'var(--ink-green)' }, INK_ORDER = ['blue', 'red', 'green'];

  const BLANK = { mode: 'auto', rows: {}, days: {}, flags: {}, flagBg: null, custom: {}, bitmojis: {}, bmAdj: {} };
  let T = Object.assign(clone(BLANK), Suite.get('today', {}));
  const save = () => Suite.set('today', T);
  let viewDate = Suite.dateKey(new Date()), screen = 0, reveal = 0, lesson = false, full = false, editing = false, revealFlag = false;
  const urls = {};
  async function fileUrl(id){ if (!id) return null; if (urls[id]) return urls[id]; const r = await Suite.files.get(id); return r && r.blob ? (urls[id] = URL.createObjectURL(r.blob)) : null; }

  /* ---------- classes, courses, and each row's usual setup ---------- */
  const classes = () => Suite.classes();
  const rowKeyOf = cid => { const co = Suite.courseOf(cid); return co ? Suite.courseKey(co.id) : cid; };
  const rowName = cid => { const co = Suite.courseOf(cid); return co ? co.name : (classes().find(c => c.id === cid) || {}).name || ''; };
  function usual(cid){
    const key = rowKeyOf(cid);
    if (!T.rows[key]) {
      T.rows[key] = {
        look: 'basic', bitmoji: 'none', schedule: [], deckUrl: '', timer: { on: false, min: 3, auto: false },
        lineup: ['welcome', 'agenda'],
        haveOut: ['Pen or pencil', 'Notebook'],
        boards: {
          welcome: { heading: BOARDS.welcome.heading, lines: clone(STARTER_LINES) },
          warmup: { heading: BOARDS.warmup.heading, lines: [] },
          returned: { heading: BOARDS.returned.heading, lines: [] },
          due: { heading: BOARDS.due.heading, source: 'plan', lines: [] },
          agenda: { heading: BOARDS.agenda.heading, source: 'plan', lines: [] },
          custom: { heading: BOARDS.custom.heading, lines: [] }
        }
      };
      save();
    }
    return T.rows[key];
  }
  // the day's setup for a class: its own (one period), else its course's, else the usual
  function dayFor(date, cid){
    const d = T.days[date] || {}, own = d[cid], co = d[rowKeyOf(cid)];
    const u = usual(cid), rec = own || co;
    return rec ? Object.assign({}, { lineup: u.lineup, haveOut: u.haveOut, boards: u.boards, slideLink: '' }, rec) : { lineup: u.lineup, haveOut: u.haveOut, boards: u.boards, slideLink: '' };
  }
  let scope = 'course';   // edit for the course, or just this period
  function editable(date, cid){
    const key = scope === 'period' ? cid : rowKeyOf(cid);
    T.days[date] = T.days[date] || {};
    if (!T.days[date][key]) { const cur = dayFor(date, cid); T.days[date][key] = clone({ lineup: cur.lineup, haveOut: cur.haveOut, boards: cur.boards, slideLink: cur.slideLink || '' }); }
    return T.days[date][key];
  }

  /* ---------- which class is on screen ---------- */
  function autoPick(){
    const now = new Date(), day = Suite.scheduleFor(now), P = day.periods, st = Suite.periodStatus(P, now), list = classes();
    const real = i => { for (let k = i; k >= 0 && k < P.length; k++) if (!Suite.isPassing(P[k]) && !P[k].isBreak) return P[k]; return null; };
    const cur = st.cur >= 0 && !Suite.isPassing(P[st.cur]) && !P[st.cur].isBreak ? P[st.cur] : null;
    const p = cur || (st.next >= 0 ? real(st.next) : null) || (st.cur >= 0 ? real(st.cur + 1) : null);
    const c = p ? Suite.classForPeriod(p, list) : null;
    const same = c && c.name.trim().toLowerCase() === (p ? p.name : '').trim().toLowerCase();
    if (c) return { cid: c.id, text: cur ? `${same ? '' : p.name + ' '}until ${Suite.fmt12(p.end)}` : `up next${same ? '' : ': ' + p.name} at ${Suite.fmt12(p.start)}`, period: p };
    return { cid: (list[0] || {}).id, text: 'No class right now', period: null };
  }
  const activeId = () => T.mode === 'auto' ? autoPick().cid : T.mode;

  /* ---------- which boards show, and their content ---------- */
  const weekKey = date => { const [y, m, d] = date.split('-').map(Number), x = new Date(y, m - 1, d, 12); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return Suite.dateKey(x); };
  const flagFor = date => T.flags[weekKey(date)] || null;
  const isRevealDay = date => { const f = flagFor(date); if (!f) return false; const [y, m, d] = date.split('-').map(Number); return new Date(y, m - 1, d).getDay() === (f.revealDay || 5); };
  function boardLines(date, cid, type, rec){
    const b = (rec.boards || {})[type] || {};
    if ((type === 'due' || type === 'agenda') && b.source !== 'custom') {
      const plan = Suite.agendaFor(date, cid) || {};
      if (type === 'agenda') return (plan.items || []).map(t => ({ text: t, color: 'blue', level: 0 }));
      return plan.homework ? plan.homework.split('\n').filter(x => x.trim()).map(t => ({ text: t, color: 'blue', level: 0 })) : [];
    }
    return (b.lines || []).filter(l => (l.text || '').trim() || (l.html && l.html.replace(/<[^>]+>/g, '').trim()));
  }
  function screens(date, cid){
    const rec = dayFor(date, cid);
    return rec.lineup.filter(t => t === 'flag' ? !!flagFor(date) : t === 'welcome' || boardLines(date, cid, t, rec).length);
  }
  const hiddenCount = (date, cid, type) => type === 'warmup' ? boardLines(date, cid, type, dayFor(date, cid)).filter(l => l.reveal).length : type === 'flag' && isRevealDay(date) ? 1 : 0;

  /* ---------- drawing ---------- */
  const place = box => box ? `left:${box[0] / 19.2}%;top:${box[1] / 10.8}%;width:${box[2] / 19.2}%;height:${box[3] / 10.8}%` : 'display:none';
  const lineHtml = (l, hidden) => `<li class="lv${Math.min(2, l.level || 0)}${hidden ? ' hide' : ''}" style="color:${INK[l.color] || INK.blue}">${lineInner(l)}</li>`;
  const ordinal = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const longDate = k => { const [y, m, d] = k.split('-').map(Number), x = new Date(y, m - 1, d); return `${x.toLocaleDateString('en-US', { weekday: 'long' })}, ${x.toLocaleDateString('en-US', { month: 'long' })} ${ordinal(d)}, ${y}`; };

  /* ---------- room packs: rooms, text spots, and bitmojis in one file (kept off the website) ---------- */
  async function importPack(file){
    let pack;
    try { pack = JSON.parse(await file.text()); } catch (e) { Suite.toast("That file isn't a room pack"); return; }
    if (!pack || pack.app !== 'classroom-suite-room-pack') { Suite.toast("That file isn't a room pack"); return; }
    const toFile = async (dataUrl, name) => new File([await (await fetch(dataUrl)).blob()], name);
    const lookMap = {}, bmMap = {};
    for (const r of pack.rooms || []) { const meta = await Suite.files.put(await toFile(r.image, r.name + '.jpg')), id = 'room-' + Suite.uid(); T.custom[id] = { name: r.name, fileId: meta.id, layout: r.layout }; if (r.replaces) lookMap[r.replaces] = id; }
    for (const b of pack.bitmojis || []) { const meta = await Suite.files.put(await toFile(b.image, b.name + '.webp')), id = 'bm-' + Suite.uid(); T.bitmojis[id] = { name: b.name, fileId: meta.id }; if (b.adj) T.bmAdj[id] = b.adj; if (b.replaces) bmMap[b.replaces] = id; }
    if (pack.flagBackground) { const meta = await Suite.files.put(await toFile(pack.flagBackground, 'flag-background.jpg')); T.flagBg = meta.id; }
    // point existing setups that used the old built-in rooms and bitmojis at the imported ones
    const fix = o => { if (!o) return; if (lookMap[o.look]) o.look = lookMap[o.look]; if (bmMap[o.bitmoji]) o.bitmoji = bmMap[o.bitmoji]; };
    Object.values(T.rows).forEach(u => { const hadLegacy = !!lookMap[u.look]; fix(u); (u.schedule || []).forEach(fix); if (hadLegacy && !u.bitmoji && pack.defaultBitmoji && bmMap[pack.defaultBitmoji]) u.bitmoji = bmMap[pack.defaultBitmoji]; });
    Object.values(T.days).forEach(day => Object.values(day).forEach(fix));
    Object.keys(T.bmAdj).forEach(k => { if (bmMap[k]) { T.bmAdj[bmMap[k]] = T.bmAdj[bmMap[k]] || T.bmAdj[k]; delete T.bmAdj[k]; } });
    commit(true);
    Suite.toast(`Imported ${(pack.rooms || []).length} rooms and ${(pack.bitmojis || []).length} bitmojis`);
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el) { if (e.target.closest('#rTimer')) toggleTimer(); return; }
    const a = el.dataset.a, cid = activeId();
    if (a === 'mode') { T.mode = el.dataset.id; save(); screen = 0; reveal = 0; lesson = false; if (!timer.running) resetTimer(activeId()); render(); if (editing) renderDrawer(); }
    else if (a === 'next') next();
    else if (a === 'prev') prev();
    else if (a === 'go') { if (el.dataset.i === 'lesson') lesson = true; else { lesson = false; screen = +el.dataset.i; reveal = 0; } render(); }
    else if (a === 'timer') toggleTimer();
    else if (a === 'lesson') { lesson = true; render(); }
    else if (a === 'boards') { lesson = false; render(); }
    else if (a === 'openslides') openInSlides(cid);
    else if (a === 'edit') { editing = !editing; $('#drawer').hidden = !editing; if (editing) renderDrawer(); }
    else if (a === 'full') { full = !full; if (full && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); else if (!full && document.fullscreenElement) document.exitFullscreen().catch(() => {}); render(); }
    else if (a === 'drawing') openDrawing();
  });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && full) { full = false; render(); } });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('.suite-dialog') || document.querySelector('.overlay') || document.body.classList.contains('timer-open')) return;
    if (/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '') || (e.target && e.target.isContentEditable)) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (editing && k !== 'Escape') return;      // letters are for typing while the edit drawer is open
    else if (k === 't' || k === 'T') toggleTimer();
    else if (k === 'r' || k === 'R') { resetTimer(); drawTimer(); renderRail(activeId()); }
    else if (k === 'l' || k === 'L') { lesson = !lesson; render(); }
    else if (k === 'e' || k === 'E') { editing = !editing; $('#drawer').hidden = !editing; if (editing) renderDrawer(); }
    else if (k === 'f' || k === 'F') { full = !full; render(); }
    else if (k === 'Escape') { if (editing) { editing = false; $('#drawer').hidden = true; } else if (full) { full = false; render(); } }
  });
  window.addEventListener('resize', () => requestAnimationFrame(fitAll));
  window.addEventListener('suite:change', e => { if (e.detail && (e.detail.external || e.detail.key === '*')) { T = Object.assign(clone(BLANK), Suite.get('today', {})); render(); } });
  Suite.mountNav('today');
  resetTimer(activeId()); lastCid = activeId();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(fitAll));
})();
</script>
