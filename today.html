:root{--ink-blue:#27468a;--ink-red:#c4281c;--ink-green:#3f7d2b;--ink-date:#b8433b}

/* control rail (suite style) */
.rail{position:relative;display:flex;flex-direction:column;gap:8px;padding:8px 16px;background:var(--paper);border-bottom:2px solid var(--rule)}

.rail .clspick.on{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}

.rail .r1 .daybar{flex:0 0 auto}
.rail .r1 .status{flex:1 1 0;min-width:190px}

.rail [data-a="next"]{min-width:96px}
.rail .r2{gap:8px}
.rail .slot-timer{width:150px}.rail .slot-edit{width:158px}

.rail .r2 .btn,.rail .r2 a.btn{white-space:nowrap;flex:0 0 auto}
.dpick span{display:inline-block;min-width:17ch;text-align:center}
/* the editing helpers float over the top of the board, so the board never resizes */
.rail .edfloat{position:fixed;left:16px;bottom:14px;max-width:min(760px,calc(100vw - 32px));z-index:60;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.96);color:#1f2a33;border:2px solid var(--edge);border-radius:14px;padding:8px 12px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:14px}
.rail .edfloat .bar{flex-wrap:wrap}
.rail .pills{display:flex;gap:6px;flex-wrap:wrap}
.rail .pills button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:transparent;border:2px solid var(--edge);border-radius:999px;padding:4px 14px;cursor:pointer;white-space:nowrap}
.rail .pills button[aria-checked="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}

.steps{display:flex;gap:4px;align-items:center}

.stage-wrap{flex:1;min-height:0;display:grid;place-items:center;padding:10px;background:#0f1720}
.stage{position:relative;width:min(100%,calc((100vh - var(--navh,70px) - var(--railh,58px) - 20px) * 16 / 9));aspect-ratio:16/9;background:#333 center/cover no-repeat;border-radius:12px;overflow:hidden;container-type:inline-size}

body.full #suite-nav,body.full .rail{display:none}
.region{position:absolute}

.cork{padding:1cqw 1.2cqw}

.have-out{margin:0 0 .2em;font-family:"Chelsea Market","Arial Rounded MT Bold",sans-serif;font-weight:400;font-size:1.45em;line-height:1.05;white-space:normal;color:var(--ink-green);text-transform:uppercase}

.pic img{width:100%;height:100%;object-fit:contain}
.region{--sz:1}
.board-fit{font-size:calc(2.2cqw * var(--fit,1) * var(--sz,1))}
.cork-fit{font-size:calc(1.9cqw * var(--fit,1) * var(--sz,1))}
.lines{font-family:var(--bf,"Chelsea Market"),"Trebuchet MS",sans-serif}

  // linked boards live in My boards (T.library); any edited copy in a day or usual setup is moved back there when saving
  function moveLinked(){
