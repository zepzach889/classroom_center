<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating charts · Classroom Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=2026-10-06c">
<script src="shared/core.js?v=2026-10-06c"></script>
<script>window.PAGE_VERSION = '2026-10-06c';</script>
<style>
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pills button{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:transparent;border:2px solid var(--edge);border-radius:999px;padding:6px 18px;cursor:pointer}
.pills button[aria-current="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 14px}
.tooltitle{font-family:var(--serif);font-size:32px}
.help{font-size:15px;color:var(--ink-2);margin:-4px 0 14px}
.help b{color:var(--ink)}
.front{text-align:center;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);border:2px dashed var(--rule);border-radius:12px;padding:6px;margin:0 0 14px}
.front.bottom{margin:14px 0 0}
.room{display:grid;gap:18px}
.tbl{background:var(--sheet);border:2px solid var(--edge);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.tbl.off{opacity:.5;border-style:dashed}
.tbl h2{background:var(--tc);color:var(--tx);font-size:22px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tbl h2 span{font:600 13px var(--sans);opacity:.85}
.seats{display:grid;gap:6px;padding:10px 12px 12px}
.surface{height:14px;border-radius:999px;background:var(--wash);border:1.5px solid var(--rule);align-self:center}
.surface.v{height:auto;width:14px;justify-self:center;align-self:stretch}
.seat{font:inherit;min-height:48px;border:2px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink);font-size:15px;font-weight:600;padding:4px 6px;cursor:pointer;line-height:1.15;overflow-wrap:anywhere}
.seat.empty{color:var(--ink-2);font-weight:400;font-size:13px;border-style:dashed}
.seat:hover{border-color:var(--edge)}
.seat.cap{border-color:var(--land)}
.seat.cap::after{content:" (captain)";font-weight:400;font-size:12px;color:var(--ink-2)}
.seat.sel,.chip.sel{outline:3px solid var(--land);outline-offset:2px;border-color:var(--land)}
.seat.target{border-color:var(--sea);border-style:solid}
.seat:not(.empty),.chip{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
body.dragging,body.dragging *{cursor:grabbing!important}
.lifted{opacity:.35}
.over{outline:3px dashed var(--land);outline-offset:2px;background:var(--wash)}
.ghost{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-60%);background:var(--sea);color:var(--on-sea);font-weight:700;font-size:16px;padding:8px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
body.printing #printarea{width:1100px}
.loose{padding:0 12px 10px;display:flex;flex-wrap:wrap;gap:6px}
.loose:empty{display:none}
.chip{font:inherit;font-size:14px;font-weight:600;border:2px solid var(--rule);border-radius:999px;background:var(--paper);color:var(--ink);padding:3px 12px;cursor:pointer}
.roomsz{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--ink-2);margin-right:6px}
.roomsz .btn{min-height:0;padding:2px 9px}
.modes{display:inline-flex;border:2px solid var(--edge);border-radius:999px;overflow:hidden;margin:0 0 12px}
.modes button{font:inherit;font-size:15px;font-weight:600;border:0;background:var(--sheet);color:var(--ink);padding:7px 18px;cursor:pointer}
.modes button+button{border-left:2px solid var(--edge)}
.modes button[aria-current="true"]{background:var(--sea);color:var(--on-sea)}
.needs{background:var(--wash);border-left:4px solid var(--land);border-radius:10px;padding:8px 12px;margin:-4px 0 12px;font-size:15px}
.roomgrid{display:grid;gap:14px}
.rtbl{background:var(--sheet);border:2px solid var(--edge);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none;cursor:grab;min-height:120px}
.rtbl.off{opacity:.55;border-style:dashed}
.rt-h{background:var(--tc);color:var(--tx);font-family:var(--serif);font-size:20px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.rt-h .grip{font-family:var(--sans);opacity:.7;font-size:18px}
.rt-b{padding:8px 12px;font-size:15px;flex:1}
.rtbl .btn{margin:0 12px 10px;align-self:flex-start;min-height:0;padding:3px 14px;font-size:14px}
.slot{border:2px dashed var(--rule);border-radius:18px;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:13px}
.tdlg{max-width:520px}.tdlg .lb{display:block;font-size:14px;font-weight:700;margin:10px 0 3px}.tdlg .field:not(.num){width:100%}
.tdgrid{display:grid;grid-template-columns:auto auto 1fr;gap:10px 14px;margin-top:10px}
.tdgrid label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.tdgrid input[type=color]{width:52px;height:36px;border:1.5px solid var(--rule);border-radius:8px;background:none;padding:2px}
.checks{display:flex;gap:6px;align-items:center;font-size:15px;flex-wrap:wrap}
.shdlg{max-width:760px}
.shgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
.pairs{list-style:none;margin:6px 0;padding:0}.pairs li{display:flex;align-items:center;gap:6px;font-size:15px}
.pins{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;max-height:150px;overflow:auto}.pins label{display:flex;gap:5px;align-items:center;font-size:15px}
.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.pv{border:2px solid var(--edge);border-radius:12px;padding:0 0 8px;font-size:14px;overflow:hidden}
.pv b{display:flex;justify-content:space-between;background:var(--tc);color:var(--tx);padding:4px 10px;margin-bottom:6px}
.pv{padding-left:0}.pv>*:not(b){padding:0 10px}
.warn{color:var(--plum);font-weight:600;margin:10px 0 0}
@media (max-width:700px){.shgrid{grid-template-columns:1fr}.roomgrid{grid-template-columns:1fr 1fr!important}.rtbl,.slot{grid-row:auto!important;grid-column:auto!important}}
.tray{margin-top:18px;background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:12px 16px}
.tray h3{margin-bottom:6px}
.tray .list{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;align-items:center}
.tray.drop{border-style:dashed;cursor:pointer}
.empty-note{background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:28px;max-width:640px}
#exit-proj{display:none}
body.proj #suite-nav,body.proj .ctl{display:none!important}
body.proj #exit-proj{display:block;position:fixed;top:12px;right:12px;opacity:.55;z-index:40}
body.proj #exit-proj:hover,body.proj #exit-proj:focus{opacity:1}
body.proj .wrap{max-width:none;padding:20px 28px}
body.proj .seat{font-size:20px;min-height:60px}
body.proj .tbl h2{font-size:28px}
.printhead{display:none}
@media (max-width:760px){.room{grid-template-columns:1fr!important}.room .tbl{grid-row:auto!important;grid-column:auto!important}}
#seatprint{display:none}
@media print{
  body.printing-img > *:not(#seatprint){display:none!important}
  body.printing-img #seatprint{display:block}
  body.printing-img #seatprint img{display:block;width:100%;height:auto;max-height:7.6in;object-fit:contain}
  @page{size:landscape;margin:.4in}
  body{background:#fff}
  #suite-nav,.ctl,.backup-banner,#exit-proj{display:none!important}
  .wrap{max-width:none;padding:0}
  #printarea{width:1100px}
  .room{gap:12px}
  .front{margin-bottom:8px}.front.bottom{margin-top:8px}
  .printhead{display:block;font-family:var(--serif);font-size:26px;margin-bottom:8px}
  .tbl{break-inside:avoid;border-color:#111}
  .tbl h2{background:none!important;color:#111!important;border-bottom:2px solid #111}
  .seat{border-color:#999;background:#fff;color:#111}
  .seat.sel,.chip.sel{outline:none}
}
</style>
</head>
<body>
<header id="suite-nav"></header>
<button class="btn" id="exit-proj" data-a="proj">Exit projector view</button>
<div class="wrap" id="app"></div>
<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  let proj = Suite.startInProjector, sel = null;   // sel: the student waiting to be placed
  const UI = Object.assign({ cur: null, front: 'top', mode: 'seat' }, Suite.get('seating', {}));
  let lastSeats = null;
  const saveUI = () => Suite.set('seating', UI);
  { const m = location.hash.match(/class=([\w-]+)/); if (m) UI.cur = m[1]; }

  const classes = () => Suite.classes();
  const curClass = list => list.find(c => c.id === UI.cur) || list[0] || null;
  // Who is in which seat. Students with no seat (or a clashing one) wait beside their table.
  function seatMap(c, t){
    const seats = Array(t.seats).fill(null), loose = [];
    c.students.filter(s => s.tableId === t.id).sort((a, b) => a.name.localeCompare(b.name)).forEach(s => {
      if (Number.isInteger(s.seat) && s.seat >= 0 && s.seat < t.seats && !seats[s.seat]) seats[s.seat] = s; else loose.push(s);
    });
    return { seats, loose };
  }

  function render(){
    document.body.classList.toggle('proj', proj);
    const list = classes(), c = curClass(list);
    if (!c) { $('#app').innerHTML = `<div class="empty-note"><h2>Add your classes first</h2><p>Seating charts use your classes and rosters.</p><a class="btn primary" href="settings.html#classes">Go to Classes and rosters</a></div>`; return; }
    UI.cur = c.id;
    if (UI.mode === 'room' && !proj) { renderRoom(c, list); return; }
    const T = Suite.get('tracker', {}) || {}, caps = (T.captains || {})[c.id] || {};
    const lay = Suite.roomLayout(c.tables);
    const RS = roomSize(c, lay);
    const rowOf = t => UI.front === 'bottom' ? RS.rows - lay.at[t.id].row + 1 : lay.at[t.id].row;
    const unassigned = c.students.filter(s => !c.tables.some(t => t.id === s.tableId)).sort((a, b) => a.name.localeCompare(b.name));
    const btn = (s, cls) => `<button class="${cls}${sel === s.id ? ' sel' : ''}${caps[s.tableId] === s.name && cls === 'seat' ? ' cap' : ''}" data-a="stu" data-id="${esc(s.id)}">${esc(s.name)}</button>`;
    const tables = c.tables.map(t => {
      const m = seatMap(c, t), L = Suite.seatLayout(t);
      // grid lines: seats, plus a narrow track for the table surface when seats face each other
      const colOf = c2 => L.surface === 'v' && c2 >= 1 ? c2 + 2 : c2 + 1;
      const rowOf2 = r2 => L.surface === 'h' && r2 >= 1 ? r2 + 2 : r2 + 1;
      const where = i => { const p = L.pos(i); return `grid-row:${rowOf2(p.r)};grid-column:${colOf(p.c)}`; };
      const seatBtn = (s, i) => s ? btn(s, 'seat').replace('<button ', `<button style="${where(i)}" `) : `<button class="seat empty${sel ? ' target' : ''}" style="${where(i)}" data-a="seat" data-t="${esc(t.id)}" data-i="${i}" aria-label="Empty seat ${i + 1} at ${esc(t.name)}">Seat ${i + 1}</button>`;
      const surface = L.surface === 'h' ? '<div class="surface" style="grid-row:2;grid-column:1 / -1" aria-hidden="true"></div>'
        : L.surface === 'v' ? `<div class="surface v" style="grid-column:2;grid-row:1 / span ${L.rows}" aria-hidden="true"></div>` : '';
      const tracks = L.surface === 'v' ? 'minmax(0,1fr) 16px minmax(0,1fr)' : `repeat(${L.cols},minmax(0,1fr))`;
      const seatsHtml = surface + m.seats.map((s, i) => seatBtn(s, i)).join('');
      return `<div class="tbl${t.open ? '' : ' off'}" style="grid-row:${rowOf(t)};grid-column:${lay.at[t.id].col};--tc:${esc(t.color)};--tx:${Suite.textOn(t.color)}">
        <h2>${esc(t.name)}<span>${m.seats.filter(Boolean).length + m.loose.length} of ${t.seats}${t.open ? '' : ', not in use'}</span></h2>
        <div class="seats${L.surface === 'v' ? ' cols2' : ''}" style="grid-template-columns:${tracks}">${seatsHtml}</div>
        <div class="loose ctl">${m.loose.map(s => btn(s, 'chip')).join('')}</div>
      </div>`;
    }).join('');
    const front = `<div class="front${UI.front === 'bottom' ? ' bottom' : ''}">Front of the room</div>`;
    $('#app').innerHTML = `
      ${topTabs(list, c)}
      <div class="toolbar ctl"><div class="tooltitle">${esc(c.name)} seating chart</div>
        <div class="bar"><button class="btn" data-a="fill">Fill empty seats</button><button class="btn" data-a="shuffle">Shuffle seats</button>${lastSeats && lastSeats.classId === c.id ? '<button class="btn quiet" data-a="unshuffle">Undo shuffle</button>' : ''}
          <button class="btn" data-a="print">Print</button><button class="btn quiet" data-a="savepic" title="Save the chart as a picture you can print or share">Save as picture</button><button class="btn" data-a="proj">Projector view</button></div></div>
      ${needSeats(c) ? `<p class="needs ctl"><b>${needSeats(c)} student${needSeats(c) === 1 ? ' needs' : 's need'} a seat.</b> Drag them into place, or press Fill empty seats.</p>` : ''}
      <p class="help ctl">${sel ? `<b>${esc((c.students.find(s => s.id === sel) || {}).name || '')}</b> is selected. Tap a seat to move them there, or tap another student to trade places. Tap them again to cancel.`
        : 'Drag a name onto a seat to move them, or onto another student to trade places. Moving someone to a different table changes their table too. (You can also tap a name, then tap a seat.)'}</p>
      <div id="printarea"><div class="printhead">${esc(c.name)} seating chart</div>
      ${UI.front === 'top' ? front : ''}
      <div class="room" style="grid-template-columns:repeat(${RS.cols},minmax(0,1fr));grid-template-rows:repeat(${RS.rows},auto)">${tables}</div>
      ${UI.front === 'bottom' ? front : ''}</div>
      <div class="tray ctl${sel ? ' drop' : ''}" data-a="tray"><h3>Not at a table</h3>
        <div class="list">${unassigned.map(s => btn(s, 'chip')).join('') || `<span class="muted small">${sel ? 'Tap here to take the selected student out of their seat.' : 'Everyone has a table.'}</span>`}</div></div>`;
  }


  /* ---------- page tabs: classes, and the two modes ---------- */
  function topTabs(list, c){
    return `${list.length > 1 ? `<nav class="pills ctl" aria-label="Class periods">${list.map(k => `<button data-a="pick" data-id="${esc(k.id)}"${k.id === c.id ? ' aria-current="true"' : ''}>${esc(k.name)}</button>`).join('')}</nav>` : ''}
      <nav class="modes ctl" aria-label="Seating mode"><button data-a="mode" data-id="seat"${UI.mode !== 'room' ? ' aria-current="true"' : ''}>Seat students</button><button data-a="mode" data-id="room"${UI.mode === 'room' ? ' aria-current="true"' : ''}>Edit room</button></nav>`;
  }
  const needSeats = c => c.students.length - c.tables.reduce((n, t) => n + seatMap(c, t).seats.filter(Boolean).length, 0);

  /* ---------- Edit room: tables, seats, and where they sit ---------- */
  const roomSize = (c, lay) => ({ cols: Math.max(lay.cols, c.roomCols || 0, 1), rows: Math.max(lay.rows, c.roomRows || 0, 1) });
  const TEAM = () => Suite.word('team'), TEAMS = () => Suite.word('team', { plural: true });
  function arrangeLabel(t){ const o = Suite.seatOptions(t.seats).find(x => x.cols === Suite.seatLayout(t).cols); return o ? o.label : ''; }
  function renderRoom(c, list){
    const lay = Suite.roomLayout(c.tables), RS = roomSize(c, lay), set = c.roomCols && c.roomRows;
    const gc = set ? RS.cols : Math.max(3, lay.cols) + 1, gr = set ? RS.rows : lay.rows + 1, at = {};
    c.tables.forEach(t => { const p = lay.at[t.id]; at[p.row + ',' + p.col] = t; });
    const rowOf = r => UI.front === 'bottom' ? gr - r + 1 : r;
    let cells = '';
    for (let r = 1; r <= gr; r++) for (let k = 1; k <= gc; k++) {
      const t = at[r + ',' + k];
      cells += t ? `<div class="rtbl${t.open ? '' : ' off'}" data-a="tbl" data-id="${esc(t.id)}" style="grid-row:${rowOf(r)};grid-column:${k};--tc:${esc(t.color)};--tx:${Suite.textOn(t.color)}">
          <div class="rt-h"><span>${esc(t.name)}</span><span class="grip" aria-hidden="true">⠿</span></div>
          <div class="rt-b">${t.seats} seats<br><span class="muted small">${esc(arrangeLabel(t))}${t.open ? '' : ' · not in use'}</span></div>
          <button class="btn small" data-a="tedit" data-id="${esc(t.id)}">Edit</button></div>`
        : `<div class="slot" data-a="slot" data-r="${r}" data-c="${k}" style="grid-row:${rowOf(r)};grid-column:${k}"><span>Empty spot</span></div>`;
    }
    const front = `<div class="front${UI.front === 'bottom' ? ' bottom' : ''}">Front of the room</div>`;
    $('#app').innerHTML = `${topTabs(list, c)}
      <div class="toolbar ctl"><div class="tooltitle">${esc(c.name)} room</div>
        <div class="bar"><span class="roomsz">Room: ${gc} across, ${gr} deep <button class="btn quiet small" data-a="rsz" data-d="c-" aria-label="Remove a column"${gc <= Math.max(1, lay.cols) ? ' disabled' : ''}>− column</button><button class="btn quiet small" data-a="rsz" data-d="c+" aria-label="Add a column">+ column</button><button class="btn quiet small" data-a="rsz" data-d="r-" aria-label="Remove a row"${gr <= Math.max(1, lay.rows) ? ' disabled' : ''}>− row</button><button class="btn quiet small" data-a="rsz" data-d="r+" aria-label="Add a row">+ row</button></span><button class="btn" data-a="tadd">Add a ${esc(TEAM())}</button><button class="btn" data-a="flip">Front of room: ${UI.front === 'top' ? 'top' : 'bottom'}</button>${list.length > 1 ? `<button class="btn" data-a="tcopy">Use this room in every class</button>` : ''}</div></div>
      <p class="help ctl">Drag ${esc(TEAMS())} into the spots that match your room. Press Edit on a ${esc(TEAM())} to rename it, change its color or seats, or turn it off for ${esc(c.name)}.</p>
      ${UI.front === 'top' ? front : ''}<div class="roomgrid" style="grid-template-columns:repeat(${gc},minmax(0,1fr))">${cells}</div>${UI.front === 'bottom' ? front : ''}`;
  }
  // pin every table to its current spot, then trim empty rows and columns at the top and left
  function pinAll(c){ const lay = Suite.roomLayout(c.tables); c.tables.forEach(t => { t.row = lay.at[t.id].row; t.col = lay.at[t.id].col; }); }
  function tidy(c){ const r0 = Math.min(...c.tables.map(t => t.row)), c0 = Math.min(...c.tables.map(t => t.col)); c.tables.forEach(t => { t.row -= r0 - 1; t.col -= c0 - 1; }); }
  function editTable(c, list, t){
    const isNew = !t;
    t = t || { id: Suite.uid(), name: '', seats: 6, open: true, color: Suite.nextColor(c.tables), seatCols: 2 };
    const back = document.createElement('div'); back.className = 'suite-dialog-back';
    const opts = n => Suite.seatOptions(n).map(o => `<option value="${o.cols}"${Suite.seatLayout(Object.assign({}, t, { seats: n })).cols === o.cols ? ' selected' : ''}>${o.label}</option>`).join('');
    back.innerHTML = `<div class="suite-dialog tdlg" role="dialog" aria-modal="true" aria-labelledby="td-t">
      <h2 id="td-t">${isNew ? 'Add a ' + esc(TEAM()) : 'Edit ' + esc(t.name)}</h2>
      <label class="lb" for="td-name">Name</label><input class="field" id="td-name" value="${esc(t.name)}" placeholder="${esc(TEAM().charAt(0).toUpperCase() + TEAM().slice(1))} ${c.tables.length + 1}">
      <div class="tdgrid">
        <label>Color<input type="color" id="td-color" value="${esc(t.color)}"></label>
        <label>Seats<input class="field num" type="number" min="1" max="30" id="td-seats" value="${t.seats}"></label>
        <label>Seat arrangement<select id="td-cols">${opts(t.seats)}</select></label>
      </div>
      <label class="checks" style="margin-top:10px"><input type="checkbox" id="td-open"${t.open ? ' checked' : ''}> In use in ${esc(c.name)} <span class="muted small">(turn off to leave it empty in this class; it keeps its points)</span></label>
      <div class="suite-dialog-actions" style="justify-content:space-between">${isNew ? '<span></span>' : `<button class="btn quiet danger" data-d="del">Remove from ${esc(c.name)}</button>`}<span class="bar"><button class="btn" data-d="cancel">Cancel</button><button class="btn primary" data-d="save">${isNew ? 'Add' : 'Save'}</button></span></div></div>`;
    document.body.appendChild(back);
    const q = id => back.querySelector('#' + id);
    q('td-name').focus();
    q('td-seats').addEventListener('input', () => { const n = Math.max(1, Math.min(30, parseInt(q('td-seats').value, 10) || 1)); q('td-cols').innerHTML = opts(n); });
    const close = () => { back.remove(); document.removeEventListener('keydown', key, true); };
    const key = e => { if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); } };
    document.addEventListener('keydown', key, true);
    back.addEventListener('click', async e => {
      if (e.target === back) return close();
      const b = e.target.closest('[data-d]'); if (!b) return;
      if (b.dataset.d === 'cancel') return close();
      if (b.dataset.d === 'del') {
        close();
        if (!await Suite.dialog({ title: 'Remove ' + t.name + ' from ' + c.name + '?', body: 'Students sitting there move to "Not at a table."', ok: 'Remove', danger: true })) return;
        c.tables = c.tables.filter(x => x.id !== t.id); c.students.forEach(s => { if (s.tableId === t.id) { s.tableId = ''; delete s.seat; } });
        Suite.saveClasses(list); render(); return;
      }
      t.name = q('td-name').value.trim() || t.name || (TEAM().charAt(0).toUpperCase() + TEAM().slice(1)) + ' ' + (c.tables.length + 1);
      t.color = q('td-color').value; t.seats = Math.max(1, Math.min(30, parseInt(q('td-seats').value, 10) || 6)); t.seatCols = +q('td-cols').value; t.open = q('td-open').checked;
      if (isNew) {
        pinAll(c);
        const lay = Suite.roomLayout(c.tables), cols = Math.max(3, lay.cols), used = new Set(c.tables.map(x => x.row + ',' + x.col));
        for (let r = 1, placed = false; !placed; r++) for (let k = 1; k <= cols; k++) if (!used.has(r + ',' + k)) { t.row = r; t.col = k; placed = true; break; }
        c.tables.push(t);
      }
      c.students.forEach(s => { if (s.tableId === t.id && Number.isInteger(s.seat) && s.seat >= t.seats) delete s.seat; });
      close(); Suite.saveClasses(list); render();
    });
  }

  /* ---------- Shuffle seats ---------- */
  function openShuffle(c, list){
    let proposal = null;
    const back = document.createElement('div'); back.className = 'suite-dialog-back';
    const kids = c.students.slice().sort((a, b) => a.name.localeCompare(b.name));
    const nm = id => (c.students.find(s => s.id === id) || { name: '?' }).name;
    const draw = () => {
      const pinned = new Set(c.pinned || []), apart = c.apart || [], tables = c.tables.filter(t => t.open);
      const opts = kids.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
      back.innerHTML = `<div class="suite-dialog shdlg" role="dialog" aria-modal="true" aria-labelledby="sh-t">
        <h2 id="sh-t">Shuffle seats for ${esc(c.name)}</h2>
        <p>Students are spread across the ${esc(TEAMS())} in use, in proportion to their seats. Nothing changes until you press Apply.</p>
        <div class="shgrid">
          <div><b class="small">Keep apart</b>
            ${apart.length ? `<ul class="pairs">${apart.map((p, i) => `<li>${esc(nm(p[0]))} and ${esc(nm(p[1]))} <button class="btn quiet danger small" data-h="aprm" data-i="${i}" aria-label="Stop keeping them apart">×</button></li>`).join('')}</ul>` : '<p class="muted small" style="margin:4px 0">No pairs yet.</p>'}
            <div class="bar"><select id="ap1" aria-label="First student">${opts}</select><select id="ap2" aria-label="Second student">${opts}</select><button class="btn small" data-h="apadd">Keep apart</button></div></div>
          <div><b class="small">Stays where they are</b>
            <div class="pins">${kids.map(s => `<label><input type="checkbox" data-pin="${esc(s.id)}"${pinned.has(s.id) ? ' checked' : ''}> ${esc(s.name)}</label>`).join('') || '<span class="muted small">No students yet.</span>'}</div></div>
        </div>
        ${proposal ? `${proposal.conflicts ? `<p class="warn">${proposal.conflicts} keep-apart pair${proposal.conflicts === 1 ? ' is' : 's are'} still together. Try again, or turn on another ${esc(TEAM())}.</p>` : ''}
          <div class="preview">${tables.map(t => { const m = kids.filter(s => proposal.assign[s.id] === t.id);
            return `<div class="pv" style="--tc:${esc(t.color)};--tx:${Suite.textOn(t.color)}"><b>${esc(t.name)} <span>${m.length}/${t.seats}</span></b><span>${m.map(s => esc(s.name)).join(', ') || '<span class="muted">Empty</span>'}</span></div>`; }).join('')}</div>` : ''}
        <div class="suite-dialog-actions"><button class="btn" data-h="cancel">Cancel</button><button class="btn${proposal ? '' : ' primary'}" data-h="go"${kids.length && tables.length ? '' : ' disabled'}>${proposal ? 'Shuffle again' : 'Shuffle'}</button>${proposal ? '<button class="btn primary" data-h="apply">Apply these seats</button>' : ''}</div></div>`;
    };
    document.body.appendChild(back); draw();
    const close = () => { back.remove(); document.removeEventListener('keydown', key, true); render(); };
    const key = e => { if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); } };
    document.addEventListener('keydown', key, true);
    back.addEventListener('change', e => { const id = e.target.dataset.pin; if (!id) return; const set = new Set(c.pinned || []); if (e.target.checked) set.add(id); else set.delete(id); c.pinned = [...set]; Suite.saveClasses(list); });
    back.addEventListener('click', e => {
      if (e.target === back) return close();
      const b = e.target.closest('[data-h]'); if (!b) return;
      const h = b.dataset.h;
      if (h === 'cancel') return close();
      if (h === 'go') { proposal = Suite.proposeSeats(c); draw(); }
      else if (h === 'apadd') { const x = back.querySelector('#ap1').value, y = back.querySelector('#ap2').value; if (x === y) { Suite.toast('Pick two different students'); return; } c.apart = (c.apart || []).filter(p => !(p.includes(x) && p.includes(y))); c.apart.push([x, y]); Suite.saveClasses(list); draw(); }
      else if (h === 'aprm') { (c.apart || []).splice(+b.dataset.i, 1); Suite.saveClasses(list); draw(); }
      else if (h === 'apply' && proposal) {
        lastSeats = { classId: c.id, seats: Object.fromEntries(c.students.map(s => [s.id, [s.tableId, s.seat]])) };
        c.students.forEach(s => { const to = proposal.assign[s.id]; if (to && to !== s.tableId) { s.tableId = to; delete s.seat; } });
        c.tables.forEach(t => { const m = seatMap(c, t); m.loose.forEach(s => { const i = m.seats.indexOf(null); if (i > -1) { m.seats[i] = s; s.seat = i; } }); });
        Suite.saveClasses(list); close(); Suite.toast('New seats for ' + c.name);
      }
    });
  }

  /* ---------- drag and drop, for mouse and touch ---------- */
  let drag = null, justDragged = false;
  function dropTarget(x, y){
    const el = document.elementFromPoint(x, y); if (!el) return null;
    return drag && drag.kind === 'tbl' ? el.closest('[data-a="slot"], [data-a="tbl"]') : el.closest('[data-a="seat"], [data-a="stu"], [data-a="tray"]');
  }
  document.addEventListener('pointerdown', e => {
    if (e.button > 0 || e.target.closest('[data-a="tedit"]')) return;
    const el = e.target.closest('[data-a="stu"], [data-a="tbl"]'); if (!el) return;
    drag = { id: el.dataset.id, kind: el.dataset.a, x: e.clientX, y: e.clientY, el, on: false, ghost: null, over: null };
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.on) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      drag.on = true; sel = null;
      drag.ghost = document.createElement('div'); drag.ghost.className = 'ghost'; drag.ghost.textContent = drag.kind === 'tbl' ? drag.el.querySelector('.rt-h span').textContent : drag.el.textContent.replace(' (captain)', '');
      document.body.appendChild(drag.ghost); document.body.classList.add('dragging'); drag.el.classList.add('lifted');
    }
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    drag.lastX = e.clientX; drag.lastY = e.clientY;
    // near the top or bottom edge: scroll so you can reach tables (or the tray) that are off screen
    const top = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--navh')) || 70) + 30;
    drag.edge = e.clientY > window.innerHeight - 50 ? 1 : e.clientY < top ? -1 : 0;
    if (drag.edge && !drag.timer) drag.timer = setInterval(() => {
      if (!drag || !drag.edge) return;
      window.scrollBy(0, drag.edge * 14);
      const t = dropTarget(drag.lastX, drag.lastY);
      if (t !== drag.over) { if (drag.over) drag.over.classList.remove('over'); drag.over = t && t !== drag.el ? t : null; if (drag.over) drag.over.classList.add('over'); }
    }, 30);
    const t = dropTarget(e.clientX, e.clientY);
    if (t !== drag.over) { if (drag.over) drag.over.classList.remove('over'); drag.over = t && t !== drag.el ? t : null; if (drag.over) drag.over.classList.add('over'); }
    e.preventDefault();
  }, { passive: false });
  function endDrag(e, cancel){
    if (!drag) return;
    const d = drag; drag = null;
    if (d.timer) clearInterval(d.timer);
    if (!d.on) return;                       // it was a tap: the click handler takes over
    justDragged = true; setTimeout(() => { justDragged = false; }, 50);
    d.ghost.remove(); document.body.classList.remove('dragging');
    if (cancel) { render(); return; }
    const t = (drag = d, dropTarget(e.clientX, e.clientY)); drag = null;
    const list = classes(), c = curClass(list);
    if (!t || !c || t === d.el) { render(); return; }
    if (d.kind === 'tbl') {
      { const lay0 = Suite.roomLayout(c.tables), set = c.roomCols && c.roomRows; if (!set) { c.roomCols = Math.max(3, lay0.cols) + 1; c.roomRows = lay0.rows + 1; } }
      pinAll(c);
      const T1 = c.tables.find(x => x.id === d.id);
      if (t.dataset.a === 'slot') { const lay = Suite.roomLayout(c.tables), gr = lay.rows + 1, r = +t.dataset.r; T1.row = r; T1.col = +t.dataset.c; }
      else { const T2 = c.tables.find(x => x.id === t.dataset.id); [T1.row, T2.row] = [T2.row, T1.row]; [T1.col, T2.col] = [T2.col, T1.col]; }
      Suite.saveClasses(list); render(); return;
    }
    const A = c.students.find(x => x.id === d.id); if (!A) { render(); return; }
    if (t.dataset.a === 'seat') place(c, A.id, t.dataset.t, +t.dataset.i);
    else if (t.dataset.a === 'stu') {
      const B = c.students.find(x => x.id === t.dataset.id);
      const at = { t: A.tableId, s: A.seat }; A.tableId = B.tableId; if (Number.isInteger(B.seat)) A.seat = B.seat; else delete A.seat;
      B.tableId = at.t; if (Number.isInteger(at.s)) B.seat = at.s; else delete B.seat;
    }
    else if (t.dataset.a === 'tray') { A.tableId = ''; delete A.seat; }
    Suite.saveClasses(list); render();
  }
  document.addEventListener('pointerup', e => endDrag(e, false));
  document.addEventListener('pointercancel', e => endDrag(e, true));

  /* ---------- print the whole room on one landscape page ---------- */
  function fitForPrint(){
    const area = document.getElementById('printarea'); if (!area) return;
    document.body.classList.add('printing');
    area.style.zoom = '';
    const pageW = (11 - 0.8) * 96, pageH = (8.5 - 0.8) * 96 - 8;   // letter, landscape, 0.4in margins
    const z = Math.min(1, pageW / area.scrollWidth, pageH / area.scrollHeight);
    area.style.zoom = z.toFixed(3);
  }
  window.addEventListener('beforeprint', () => { if (!document.body.classList.contains('printing-img')) { const cv = chartCanvas(); if (cv) { let host = document.getElementById('seatprint'); if (!host) { host = document.createElement('div'); host.id = 'seatprint'; document.body.appendChild(host); } host.innerHTML = `<img alt="Seating chart" src="${cv.toDataURL('image/png')}">`; document.body.classList.add('printing-img'); const done = () => { document.body.classList.remove('printing-img'); window.removeEventListener('afterprint', done); }; window.addEventListener('afterprint', done); } } });
  // The Print button builds a page-sized copy of just the chart, measures it at that size, and scales it to fit one sheet.
  function chartCanvas(){
    const list = classes(), c = curClass(list); if (!c) return null;
    const T0 = Suite.get('tracker', {}) || {}, caps = (T0.captains || {})[c.id] || {};
    const W = 3300, H = 2550, M = 150, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    const font = (px, bold) => `${bold ? '700 ' : ''}${px}px Georgia, "Times New Roman", serif`;
    const fitText = (txt, maxW, maxH, start, bold) => { let px = start; g.font = font(px, bold); while (px > 14 && g.measureText(txt).width > maxW) { px -= 2; g.font = font(px, bold); } if (px > maxH * .8) { px = Math.floor(maxH * .8); g.font = font(px, bold); } return px; };
    const rrect = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
    g.fillStyle = '#111'; g.font = font(78, true); g.textBaseline = 'alphabetic'; g.fillText(c.name + ' seating chart', M, M + 60);
    const lay = Suite.roomLayout(c.tables), RS = roomSize(c, lay), cols = RS.cols, rows = RS.rows;
    const frontH = 70, top = M + 110, gap = 50;
    let gridTop = top, gridBottom = H - M;
    const drawFront = y => { g.setLineDash([18, 14]); g.strokeStyle = '#888'; g.lineWidth = 4; rrect(M, y, W - 2 * M, frontH, 16); g.stroke(); g.setLineDash([]); g.fillStyle = '#555'; g.font = font(40, true); g.textAlign = 'center'; g.fillText('FRONT OF THE ROOM', W / 2, y + 50); g.textAlign = 'left'; };
    if (UI.front === 'bottom') { drawFront(H - M - frontH); gridBottom = H - M - frontH - gap; } else { drawFront(top); gridTop = top + frontH + gap; }
    const cellW = (W - 2 * M - gap * (cols - 1)) / cols, cellH = (gridBottom - gridTop - gap * (rows - 1)) / rows;
    c.tables.forEach(t => {
      const p = lay.at[t.id], r = UI.front === 'bottom' ? rows - p.row + 1 : p.row;
      const x = M + (p.col - 1) * (cellW + gap), y = gridTop + (r - 1) * (cellH + gap);
      rrect(x, y, cellW, cellH, 26); g.lineWidth = 6; g.strokeStyle = t.open ? '#111' : '#999'; g.setLineDash(t.open ? [] : [20, 14]); g.stroke(); g.setLineDash([]);
      const headH = Math.min(110, cellH * .16);
      g.fillStyle = '#111'; const hp = fitText(t.name, cellW * .62, headH, 56, true); g.fillText(t.name, x + 30, y + headH * .5 + hp * .35);
      const m = seatMap(c, t), count = m.seats.filter(Boolean).length + m.loose.length;
      g.font = font(34); g.fillStyle = '#555'; g.textAlign = 'right'; g.fillText(t.open ? `${count} of ${t.seats}` : 'not in use', x + cellW - 30, y + headH * .5 + 12); g.textAlign = 'left';
      g.beginPath(); g.moveTo(x, y + headH); g.lineTo(x + cellW, y + headH); g.lineWidth = 4; g.strokeStyle = '#111'; g.stroke();
      // seats in the table's arrangement
      const L = Suite.seatLayout(t), pad = 26, ax = x + pad, ay = y + headH + pad, aw = cellW - 2 * pad, ah = cellH - headH - 2 * pad;
      const surf = 30, colsN = L.cols, rowsN = L.rows;
      const sw = (aw - (L.surface === 'v' ? surf + 20 : 0) - (colsN - 1) * 16) / colsN, sh = (ah - (L.surface === 'h' ? surf + 20 : 0) - (rowsN - 1) * 14) / rowsN;
      if (L.surface === 'v') { g.fillStyle = '#e8e8e8'; rrect(ax + sw + 10 + 8, ay, surf, ah, 12); g.fill(); }
      if (L.surface === 'h') { g.fillStyle = '#e8e8e8'; rrect(ax, ay + sh + 10 + 7, aw, surf, 12); g.fill(); }
      m.seats.forEach((st, i) => {
        const q = L.pos(i); let sx = ax + q.c * (sw + 16), sy = ay + q.r * (sh + 14);
        if (L.surface === 'v' && q.c >= 1) sx += surf + 20 - 16 + 16;
        if (L.surface === 'h' && q.r >= 1) sy += surf + 20;
        rrect(sx, sy, sw, sh, 14); g.lineWidth = 3; g.strokeStyle = st ? '#777' : '#bbb'; g.setLineDash(st ? [] : [10, 8]); g.stroke(); g.setLineDash([]);
        const label = st ? st.name : 'Seat ' + (i + 1), bold = st && caps[t.id] === st.name;
        g.fillStyle = st ? '#111' : '#999'; const px = fitText(label, sw - 20, sh, st ? 44 : 30, bold);
        g.textAlign = 'center'; g.fillText(label, sx + sw / 2, sy + sh / 2 + px * .35); g.textAlign = 'left';
      });
    });
    return cv;
  }
  function printChart(){
    const cv = chartCanvas(); if (!cv) return;
    let host = document.getElementById('seatprint');
    if (!host) { host = document.createElement('div'); host.id = 'seatprint'; document.body.appendChild(host); }
    host.innerHTML = `<img alt="Seating chart" src="${cv.toDataURL('image/png')}">`;
    document.body.classList.add('printing-img');
    const done = () => { document.body.classList.remove('printing-img'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    const img = host.querySelector('img');
    (img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; })).then(() => setTimeout(() => window.print(), 60));
  }
  function saveChartPicture(){
    const cv = chartCanvas(); if (!cv) return;
    const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = ((curClass(classes()) || {}).name || 'class').replace(/[^\w -]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '-seating-chart.png';
    document.body.appendChild(a); a.click(); a.remove();
  }

  window.addEventListener('afterprint', () => { document.body.classList.remove('printing'); const a = document.getElementById('printarea'); if (a) a.style.zoom = ''; });

  function place(c, sid, tid, seat){
    const s = c.students.find(x => x.id === sid); if (!s) return;
    const other = c.students.find(x => x !== s && x.tableId === tid && x.seat === seat);
    if (other) { other.tableId = s.tableId; if (Number.isInteger(s.seat)) other.seat = s.seat; else delete other.seat; }
    s.tableId = tid; s.seat = seat;
  }
  document.addEventListener('click', async e => {
    if (justDragged) return;
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, list = classes(), c = curClass(list);
    if (a === 'pick') { UI.cur = el.dataset.id; sel = null; saveUI(); render(); return; }
    if (a === 'proj') { proj = !proj; sel = null; render(); return; }
    if (a === 'print') { sel = null; render(); printChart(); return; }
    if (a === 'savepic') { saveChartPicture(); return; }
    if (a === 'flip') { UI.front = UI.front === 'top' ? 'bottom' : 'top'; saveUI(); render(); return; }
    if (a === 'mode') { UI.mode = el.dataset.id; sel = null; saveUI(); render(); return; }
    if (c && a === 'shuffle') { openShuffle(c, list); return; }
    if (c && a === 'unshuffle' && lastSeats) { c.students.forEach(s => { const v = lastSeats.seats[s.id]; if (v) { s.tableId = v[0]; if (Number.isInteger(v[1])) s.seat = v[1]; else delete s.seat; } }); lastSeats = null; Suite.saveClasses(list); render(); Suite.toast('Seats put back'); return; }
    if (c && a === 'tadd') { editTable(c, list, null); return; }
    if (c && a === 'rsz') {
      const lay0 = Suite.roomLayout(c.tables), set = c.roomCols && c.roomRows;
      let cols = set ? c.roomCols : Math.max(3, lay0.cols) + 1, rows = set ? c.roomRows : lay0.rows + 1; pinAll(c);
      const d = el.dataset.d;
      if (d === 'c+') cols++; else if (d === 'r+') rows++;
      else if (d === 'c-' && cols > lay0.cols) cols--; else if (d === 'r-' && rows > lay0.rows) rows--;
      c.roomCols = Math.max(1, cols); c.roomRows = Math.max(1, rows); Suite.saveClasses(list); render(); return;
    }
    if (c && a === 'tedit') { editTable(c, list, c.tables.find(x => x.id === el.dataset.id)); return; }
    if (c && a === 'tcopy') {
      if (!await Suite.dialog({ title: 'Use this room in every class?', body: 'Every other class gets these ' + TEAMS() + ', seats, colors, and spots. Students stay where their ' + TEAM() + ' still exists; others move to "Not at a table."', ok: 'Copy the room' })) return;
      pinAll(c);
      list.forEach(o => { if (o === c) return; o.tables = JSON.parse(JSON.stringify(c.tables)); o.roomCols = c.roomCols; o.roomRows = c.roomRows; o.students.forEach(s => { const t = o.tables.find(x => x.id === s.tableId); if (!t) { s.tableId = ''; delete s.seat; } else if (Number.isInteger(s.seat) && s.seat >= t.seats) delete s.seat; }); });
      Suite.saveClasses(list); render(); Suite.toast('Room copied to every class'); return;
    }
    if (!c) return;
    if (a === 'stu') {
      const id = el.dataset.id;
      if (!sel || sel === id) { sel = sel === id ? null : id; render(); return; }
      // trade places with another student
      const A = c.students.find(x => x.id === sel), B = c.students.find(x => x.id === id);
      const at = { t: A.tableId, s: A.seat }; A.tableId = B.tableId; if (Number.isInteger(B.seat)) A.seat = B.seat; else delete A.seat;
      B.tableId = at.t; if (Number.isInteger(at.s)) B.seat = at.s; else delete B.seat;
      sel = null; Suite.saveClasses(list); render(); return;
    }
    if (a === 'seat' && sel) { place(c, sel, el.dataset.t, +el.dataset.i); sel = null; Suite.saveClasses(list); render(); return; }
    if (a === 'tray' && sel && !e.target.closest('[data-a="stu"]')) {
      const s = c.students.find(x => x.id === sel); if (s) { s.tableId = ''; delete s.seat; }
      sel = null; Suite.saveClasses(list); render(); return;
    }
    if (a === 'fill') {
      let n = 0;
      c.tables.forEach(t => { const m = seatMap(c, t); m.loose.forEach(s => { const i = m.seats.indexOf(null); if (i > -1) { m.seats[i] = s; s.seat = i; n++; } }); });
      Suite.saveClasses(list); render(); Suite.toast(n ? 'Seated ' + n + ' student' + (n === 1 ? '' : 's') : 'Everyone at a table already has a seat');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || document.querySelector('.suite-dialog') || document.body.classList.contains('timer-open')) return;
    if (sel) { sel = null; render(); } else if (proj) { proj = false; render(); }
  });
  window.addEventListener('suite:change', e => { if (e.detail && (e.detail.external || e.detail.key === '*')) render(); });
  Suite.mountNav('seating');
  render();
})();
