<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Present · Classroom Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=2026-10-01b">
<script src="shared/core.js?v=2026-10-01b"></script>
<script>window.PAGE_VERSION = '2026-10-01b';</script>
<style>
.wrap{max-width:900px;margin:0 auto;padding:22px 20px 60px}
.wrap h1{font-size:34px;margin-bottom:6px}
.card{background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:22px;margin-bottom:8px}
.steps{margin:6px 0 0;padding-left:22px}
.steps li{margin-bottom:6px}
.lb{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
.field.wide{width:100%}
.decks{list-style:none;margin:0;padding:0}
.decks li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.decks li:first-child{border-top:0}
.decks .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.warn{color:var(--plum);font-weight:600;margin-top:8px}
/* presenting */
body.presenting{overflow:hidden}
body.presenting #suite-nav,body.presenting .wrap{display:none}
#stage{position:fixed;inset:0;background:#000;display:none}
body.presenting #stage{display:block}
#stage iframe.deck{width:100%;height:100%;border:0;display:block}
.tools{position:fixed;left:10px;bottom:10px;z-index:20;display:flex;gap:6px;align-items:center;background:rgba(20,28,38,.86);border-radius:999px;padding:5px;opacity:.35;transition:opacity .15s}
.tools:hover,.tools:focus-within{opacity:1}
.tools button{font:600 14px var(--sans);color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.tools button:hover{border-color:#fff}
.tools .sep{width:1px;height:22px;background:rgba(255,255,255,.3)}
#overlay{position:fixed;inset:0;z-index:30;background:var(--paper);display:none}
#overlay.on{display:block}
#overlay iframe{width:100%;height:100%;border:0}
#overlay .close{position:fixed;top:12px;right:12px;z-index:31;font-size:15px}
</style>
</head>
<body>
<header id="suite-nav"></header>
<div class="wrap" id="setup"></div>
<div id="stage">
  <iframe class="deck" id="deck" title="Slides" allowfullscreen></iframe>
  <div class="tools" role="toolbar" aria-label="Classroom tools">
    <button data-a="tool" data-id="timer">Timer</button>
    <button data-a="tool" data-id="spinner">Spinner</button>
    <button data-a="tool" data-id="points">Table points</button>
    <button data-a="tool" data-id="groups">Groups</button>
    <span class="sep"></span>
    <button data-a="full">Full screen</button>
    <button data-a="stop">Exit</button>
  </div>
</div>
<div id="overlay"><button class="btn close" data-a="close">Back to slides</button><iframe id="ovframe" title="Classroom tool"></iframe></div>
<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  const P = Object.assign({ decks: [], cur: null }, Suite.get('present', {}));
  const save = () => Suite.set('present', P);
  const PAGES = { spinner: 'spinner.html', points: 'tracker.html', groups: 'activities.html' };

  // Accepts a "Publish to the web" link, the embed code, or an embed link, and returns a link that can be shown here.
  function toEmbed(raw){
    let v = String(raw || '').trim();
    const src = v.match(/src=["']([^"']+)["']/); if (src) v = src[1];
    if (!/^https:\/\/docs\.google\.com\/presentation\//.test(v)) return { error: "That doesn't look like a Google Slides link." };
    const url = new URL(v);
    if (/\/d\/e\/[^/]+\/pub/.test(url.pathname)) url.pathname = url.pathname.replace(/\/pub(vid)?$/, '/embed');
    else if (/\/d\/[^/]+\/(edit|view|present|preview)(\/|$)/.test(url.pathname)) return { url: url.origin + url.pathname.replace(/\/(edit|view|present|preview)(\/.*)?$/, '/embed') + '?start=false&loop=false', editLink: true };
    if (!/\/embed$/.test(url.pathname)) return { error: 'Use the link from File, then Share, then Publish to the web.' };
    url.searchParams.set('start', 'false'); url.searchParams.set('loop', 'false');
    if (!url.searchParams.has('delayms')) url.searchParams.set('delayms', '60000');
    return { url: url.toString() };
  }

  function renderSetup(msg){
    $('#setup').innerHTML = `<h1>Present</h1>
      <p class="hint">Show your Google Slides here, with the timer, spinner, table points, and groups a click away on top of them.</p>
      <div class="card"><h2>Add a deck</h2>
        <ol class="steps">
          <li>In Google Slides, open <b>File</b>, then <b>Share</b>, then <b>Publish to the web</b>.</li>
          <li>Press <b>Publish</b>, then copy the link it shows.</li>
          <li>Paste it below. Published decks can be viewed by anyone with the link, unless your school limits publishing to your district.</li>
        </ol>
        <label class="lb" for="dlink">Published link</label>
        <input class="field wide" id="dlink" placeholder="https://docs.google.com/presentation/d/e/.../pub?start=false...">
        <label class="lb" for="dname">Name <span class="muted small">(optional)</span></label>
        <input class="field wide" id="dname" placeholder="Unit 2 daily deck">
        <div class="bar" style="margin-top:12px"><button class="btn primary" data-a="add">Save and present</button></div>
        ${msg ? `<p class="warn">${esc(msg)}</p>` : ''}
      </div>
      ${P.decks.length ? `<div class="card"><h2>Your decks</h2><ul class="decks">${P.decks.map(d => `<li><span class="nm">${esc(d.name)}</span>
          <button class="btn primary" data-a="go" data-id="${esc(d.id)}">Present</button><button class="btn quiet danger" data-a="del" data-id="${esc(d.id)}" aria-label="Remove ${esc(d.name)}">×</button></li>`).join('')}</ul>
        <p class="hint" style="margin:10px 0 0">Tip: click once on your slides so the arrow keys move between them. Edits in Google Slides can take a few minutes to show up here.</p></div>` : ''}`;
  }
  function present(d){
    P.cur = d.id; save();
    $('#deck').src = d.url;
    document.body.classList.add('presenting');
  }
  function stop(){
    closeTool(); document.body.classList.remove('presenting'); $('#deck').src = 'about:blank';
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    renderSetup();
  }
  function openTool(id){
    if (id === 'timer') { Suite.openTimer(); return; }
    const c = (Suite.get('tracker', {}) || {}).cur;
    $('#ovframe').src = PAGES[id] + '?embed&proj' + (id === 'groups' ? '#tool=groups' : c ? '#class=' + c : '');
    $('#overlay').classList.add('on');
  }
  function closeTool(){ $('#overlay').classList.remove('on'); $('#ovframe').src = 'about:blank'; $('#deck').focus(); }

  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a;
    if (a === 'add') {
      const r = toEmbed($('#dlink').value);
      if (r.error) { renderSetup(r.error); return; }
      const d = { id: Suite.uid(), name: $('#dname').value.trim() || 'Slides deck ' + (P.decks.length + 1), url: r.url };
      P.decks.unshift(d); save();
      if (r.editLink) Suite.toast('That was the editing link. If the slides don\'t appear, publish the deck first.');
      present(d);
    }
    else if (a === 'go') { const d = P.decks.find(x => x.id === el.dataset.id); if (d) present(d); }
    else if (a === 'del') { P.decks = P.decks.filter(x => x.id !== el.dataset.id); save(); renderSetup(); }
    else if (a === 'tool') openTool(el.dataset.id);
    else if (a === 'close') closeTool();
    else if (a === 'full') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
    else if (a === 'stop') stop();
  });
  // Tools opened on top ask to close with Esc (they send a message from inside).
  window.addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.suite === 'close') closeTool(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#overlay').classList.contains('on') && !document.body.classList.contains('timer-open')) closeTool(); });
  Suite.mountNav('present');
  renderSetup();
})();
</script>
</body>
</html>
