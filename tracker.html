<body>
<header id="suite-nav"></header>
<button class="btn" id="exit-proj" data-a="proj">Exit projector view</button>
<div class="wrap" id="app"></div>

<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  const MENU = [
    'Everyone shares at least once each class',
    'No talking during instructions all week',
    'Everyone starts the warm-up within 1 minute of the bell',
    'Table area clean before the bell, all 5 days',
    'Everyone prepared with materials at the start of class',
    'Zero reminders needed to transition between activities'
  ].join('\n');
  const DEF = { quarter: 1, week: 1, menu: MENU, log: [], goals: {}, streaks: {}, captains: {}, double: false, cur: null, rotateEvery: 1, captainLog: [], prizes: [] };
  let T, proj = Suite.startInProjector, picked = null, bump = null, moreOpen = false, showKeys = false, shopProj = false, histQ = null;
  /* ---------- Table Shop (per class): Earned = the quarter total; Available = Earned minus what's been spent this quarter ---------- */
  const SHOP_MENU = () => [
    { id: 'm1', tier: 'Economy', name: 'Skip-two-questions cards (one per table member)', cost: 5 },
    { id: 'm2', tier: 'Economy', name: 'Cold-call immunity cards (one per table member)', cost: 5 },
    { id: 'm3', tier: 'Economy', name: 'Drawing on the board (Friday)', cost: 5 },
    { id: 'm4', tier: 'Economy', name: 'Geography games (Friday)', cost: 5 },
    { id: 'm5', tier: 'Business', name: 'Free time in the pod (Friday)', cost: 10 },
    { id: 'm6', tier: 'Business', name: 'Write the next warm-up question', cost: 10 },
    { id: 'm7', tier: 'First Class', name: 'Assignment pass cards (one per table member)', cost: 20 },
    { id: 'm8', tier: 'First Class', name: 'Sit with a friend anywhere for one day', cost: 20 },
    { id: 'c1', tier: 'Group Charters', name: 'Game period', cost: 50 },
    { id: 'c2', tier: 'Group Charters', name: 'Unit deep dive (class picks the topic)', cost: 75 },
    { id: 'c3', tier: 'Group Charters', name: 'Wild card day (any history topic from a list)', cost: 100 }];
  const TIERS = ['Economy', 'Business', 'First Class', 'Group Charters'];
  const shopOf = cid => { T.shop = T.shop || {}; return T.shop[cid] || null; };
  const shopOn = cid => !!(shopOf(cid) && shopOf(cid).on);
  const isCharter = it => it.tier === 'Group Charters';
  const spent = (cid, tid, q) => ((shopOf(cid) || {}).buys || []).filter(b => b.q === (q || T.quarter)).reduce((n, b) => n + (b.parts || []).filter(x => x.t === tid).reduce((m, x) => m + x.amt, 0), 0);
  const avail = (cid, tid) => pts(cid, tid) - spent(cid, tid);

  function load(){ T = Object.assign({}, DEF, Suite.get('tracker', {})); ['goals','streaks','captains'].forEach(k => { T[k] = T[k] || {}; }); T.log = T.log || []; T.captainLog = T.captainLog || []; T.prizes = T.prizes || []; if (T.rotateEvery == null) T.rotateEvery = 1; }
  function save(){ Suite.set('tracker', T); }
  load();
  { const m = location.hash.match(/class=([\w-]+)/); if (m) T.cur = m[1]; }

  const classes = () => Suite.classes();
  const AUTO = Suite.autoClass('tracker');
  if (/class=/.test(location.hash)) AUTO.set(false);   // a link to a specific class turns Auto off for this window
  const curClass = list => { if (AUTO.on) { const id = Suite.classNow(); const c = id && list.find(x => x.id === id); if (c) return c; } return list.find(c => c.id === T.cur) || list[0] || null; };
  let lastAuto = null;
  setInterval(() => { if (!AUTO.on) return; const id = Suite.classNow(); if (id && id !== lastAuto) { lastAuto = id; render(); } }, 15000);
  const pts = (cid, tid, w) => T.log.reduce((a, e) => a + (e.c === cid && e.t === tid && e.q === T.quarter && (w === undefined || e.w === w) ? e.d : 0), 0);
  const gkey = (tid, w) => tid + '|' + T.quarter + '|' + (w == null ? T.week : w);
  const leaders = rows => { if (!rows.length) return []; const top = Math.max(...rows.map(r => r[1])); return top > 0 ? rows.filter(r => r[1] === top).map(r => r[0]) : []; };
  const weekLeaders = (c, w) => leaders(Suite.activeTables(c).map(t => [t.id, pts(c.id, t.id, w)]));
  const byQuarter = () => T.topBy !== 'week';
  const qThrough = (cid, tid, w) => T.log.reduce((n, e) => n + (e.c === cid && e.t === tid && e.q === T.quarter && e.w <= w ? e.d : 0), 0);
  const topLeaders = (c, w) => byQuarter() ? leaders(Suite.activeTables(c).map(t => [t.id, qThrough(c.id, t.id, w)])) : weekLeaders(c, w);
  function improved(c, w){
    if (w < 2) return null;
    if (!T.log.some(e => e.c === c.id && e.q === T.quarter && e.w === w)) return null;
    const rows = Suite.activeTables(c).map(t => { const now = pts(c.id, t.id, w), before = pts(c.id, t.id, w - 1); return [t.id, now > 0 && now > before ? now - before : 0]; });
    if (!rows.length) return null;
    const best = Math.max(...rows.map(r => r[1]));
    if (best <= 0) return [];   // no table earned more than the week before
    return rows.filter(r => r[1] === best).map(r => r[0]);
  }
  const tname = (c, id) => (c.tables.find(t => t.id === id) || { name: 'Removed table' }).name;
  const withScore = (c, ids, f) => ids.map(i => `${esc(tname(c, i))} <span class="muted">· ${esc(f(i))}</span>`).join(', ');
  const names = (c, ids) => ids && ids.length ? ids.map(i => esc(tname(c, i))).join(', ') : '<span class="muted">None yet</span>';

  const W = (k, o) => Suite.word(k, o);

  function shopPanel(c){
    const S = shopOf(c.id), act = Suite.activeTables(c), q = T.quarter, buys = (S.buys || []).filter(b => b.q === q);
    const charterDone = id => buys.some(b => b.itemId === id && b.kind === 'charter');
    const pooled = act.reduce((n, t) => n + Math.max(0, avail(c.id, t.id)), 0);
    const tierRows = TIERS.map(tier => { const items = (S.menu || []).filter(it => it.tier === tier); if (!items.length) return '';
      return `<div class="sh-tier"><h3>${esc(tier)}</h3>${items.map(it => isCharter(it) ? (() => { const done = charterDone(it.id), pct = Math.min(100, Math.round(pooled / it.cost * 100));
          return `<div class="sh-item ch"><div class="sh-n">${esc(it.name)} <span class="sh-c">${it.cost} pts</span></div>
            ${done ? '<div class="sh-done">Purchased!</div>' : `<div class="sh-bar${pooled >= it.cost ? ' ok' : ''}"><span style="width:${pct}%"></span></div><div class="sh-bt">${Math.min(pooled, it.cost)} / ${it.cost} if every ${esc(W('team'))} pooled</div>`}
            ${done ? '' : `<button class="btn small" data-a="shbuyc" data-id="${esc(it.id)}"${S.open ? '' : ' disabled title="The shop is closed"'}>Buy with pooled points…</button>`}</div>`; })()
        : `<div class="sh-item"><div class="sh-n">${esc(it.name)} <span class="sh-c">${it.cost} pts</span></div><button class="btn small" data-a="shbuy" data-id="${esc(it.id)}"${S.open ? '' : ' disabled title="The shop is closed"'}>Buy…</button></div>`).join('')}</div>`; }).join('');
    const qs = [...new Set((S.buys || []).map(b => b.q).concat([q]))].sort((a, b) => b - a), hq = histQ && qs.includes(histQ) ? histQ : q;
    const hist = (S.buys || []).filter(b => b.q === hq).slice().reverse();
    const tn = id => (c.tables.find(t => t.id === id) || { name: 'Removed' }).name;

      <div class="sh-bal">${act.map(t => { const a = avail(c.id, t.id); return `<div class="sh-b" style="--tc:${esc(t.color)}"><span class="sw"></span><b>${esc(t.name)}</b><span class="${a < 0 ? 'neg' : ''}">${a} available</span><span class="muted small">${pts(c.id, t.id)} earned</span></div>`; }).join('')}</div>
      <div class="sh-menu">${tierRows}</div>
      <details class="sh-hist"${hist.length ? '' : ''}><summary>Purchase history <span class="muted small">(${hist.length} this ${hq === q ? 'quarter' : 'Q' + hq})</span></summary>
        <div class="bar" style="margin:6px 0">${qs.length > 1 ? `<select data-c="shq">${qs.map(x => `<option value="${x}"${x === hq ? ' selected' : ''}>Quarter ${x}${x === q ? ' (now)' : ''}</option>`).join('')}</select>` : ''}${hq === q && buys.length ? '<button class="btn small quiet danger" data-a="shundo">Undo last purchase</button>' : ''}</div>
        ${hist.length ? `<table class="plain sh-ht"><thead><tr><th>When</th><th>Item</th><th>${esc(W('team', { cap: true }))}</th><th>Cost</th><th>Note</th></tr></thead><tbody>${hist.map(b => `<tr><td>${new Date(b.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</td><td>${esc(b.name)}${b.kind === 'charter' ? ' <span class="muted small">(charter)</span>' : ''}</td><td>${b.parts.map(x => esc(tn(x.t)) + (b.parts.length > 1 ? ' ' + x.amt : '')).join(', ')}</td><td>${b.cost}</td><td>${esc(b.note || '')}</td></tr>`).join('')}</tbody></table>` : '<p class="muted small">No purchases yet.</p>'}
      </details></section>`;
  }
  function shopProjHtml(c){
    const S = shopOf(c.id), act = Suite.activeTables(c), q = T.quarter, buys = (S.buys || []).filter(b => b.q === q);
    const pooled = act.reduce((n, t) => n + Math.max(0, avail(c.id, t.id)), 0);
    return `<div class="shp"><button class="btn" data-a="shproj" id="shp-exit">Exit shop view</button>
      <h1>Table Shop${S.open ? ' <span class="shp-open">OPEN</span>' : ''}</h1>
      <div class="shp-bal">${act.slice().sort((a, b) => avail(c.id, b.id) - avail(c.id, a.id)).map(t => { const a = avail(c.id, t.id); return `<div class="shp-card" style="--tc:${esc(t.color)};--tx:${Suite.textOn(t.color)}"><div class="shp-tn">${esc(t.name)}</div><div class="shp-av${a < 0 ? ' neg' : ''}">${a}</div><div class="shp-l">available</div><div class="shp-e">${pts(c.id, t.id)} earned</div></div>`; }).join('')}</div>
      <div class="shp-menu">${TIERS.map(tier => { const items = (S.menu || []).filter(it => it.tier === tier); if (!items.length) return '';
        return `<div class="shp-tier"><h2>${esc(tier)}</h2>${items.map(it => isCharter(it) ? (() => { const done = buys.some(b => b.itemId === it.id && b.kind === 'charter'), pct = Math.min(100, Math.round(pooled / it.cost * 100));
            return `<div class="shp-it ch"><div class="shp-row"><span>${esc(it.name)}</span><b>${it.cost}</b></div>${done ? '<div class="shp-done">Purchased!</div>' : `<div class="sh-bar big${pooled >= it.cost ? ' ok' : ''}"><span style="width:${pct}%"></span></div><div class="shp-bt">${Math.min(pooled, it.cost)} / ${it.cost} if everyone pooled</div>`}</div>`; })()
          : `<div class="shp-it"><div class="shp-row"><span>${esc(it.name)}</span><b>${it.cost}</b></div></div>`).join('')}</div>`; }).join('')}</div></div>`;
  }

  function render(){
    const useCaps = Suite.feature('captains'), useGoals = Suite.feature('goals');
    document.body.classList.toggle('nocaps', !useCaps);

    const goals = T.goals[c.id] || {};

        <div class="card-body">
          <div class="card-top">

          <div class="awards">
            <button class="plus" data-a="aw" data-id="${esc(t.id)}" data-d="1">+1</button>

            <button data-a="aw" data-id="${esc(t.id)}" data-d="2" data-note="Clean area">Clean +2</button>
            <button data-a="aw" data-id="${esc(t.id)}" data-d="1" data-note="Mostly clean">Mostly clean +1</button>
            <button class="wide hot" data-a="aw" data-id="${esc(t.id)}" data-d="3" data-note="Challenge">3-point challenge</button>
          </div>
        </div>
      </article>`;
    }).join('');

    // prizes
    const prev = T.week - 1;

    const weeksAs = captainWeeks(c);
    const capPanel = act.map(t => {

        ${members.length ? `<div class="capnames">${members.map(m => `<span class="${m.name === now ? 'is-now' : ''}">${esc(m.name)} <b>${weeksAs[m.id] || 0}</b></span>`).join('')}</div>` : '<div class="muted small">No students seated here.</div>'}</div>`;
    }).join('') || '<p class="muted">No tables in use.</p>';
    const due = ungiven(c);
    const mine = T.prizes.filter(x => x.c === c.id).slice().sort((a, b) => b.q - a.q || b.w - a.w || (a.kind === 'quarter') - (b.kind === 'quarter'));
    const record = mine.length ? `<div class="scroll"><table class="plain record">
        <thead><tr><th>When</th><th>Prize</th><th>Winner</th><th class="n">Handed out</th></tr></thead>
        <tbody>${mine.slice(0, 30).map(x => `<tr class="${x.given ? 'given' : ''}">
          <td>${x.kind === 'quarter' ? 'Quarter ' + x.q : 'Q' + x.q + ' week ' + x.w}</td><td>${PRIZE_NAMES[x.kind]}</td><td>${x.tables.map(y => esc(y.name)).join(', ')}</td>
          <td class="n"><input type="checkbox" data-c="given" data-id="${esc(x.id)}"${x.given ? ' checked' : ''} aria-label="${PRIZE_NAMES[x.kind]} handed out"></td></tr>`).join('')}</tbody>
      </table></div>`
      : '<p class="muted">Prizes are recorded here each time you end the week.</p>';
    const quarters = Array.from(new Set([T.quarter].concat(T.log.map(e => e.q)))).sort((a, b) => b - a);

    const opts = T.menu.split('\n').map(s => s.trim()).filter(Boolean);
    const weeks = Array.from({ length: T.week }, (_, i) => i + 1);
    const recent = T.log.filter(e => e.c === c.id).slice(-30).reverse();

    $('#app').innerHTML = `
      <nav class="classes" aria-label="Class periods"><button data-a="pick" data-id="auto"${AUTO.on ? ' aria-current="true"' : ''} title="Follows the bell schedule">Auto</button>${list.map(k => `<button data-a="pick" data-id="${esc(k.id)}"${!AUTO.on && k.id === c.id ? ' aria-current="true"' : ''}>${esc(k.name)}</button>`).join('')}</nav>
      <div class="statusbar">
        <div class="when">Quarter ${T.quarter}, week ${T.week}</div>
        <div class="bar">
          ${T.double ? '<button class="btn double-on" data-a="double" aria-pressed="true" title="Turn double points off">Double points on</button>' : ''}
          <button class="btn" data-a="undo">Undo last</button>
          <button class="btn" data-a="proj">Projector view</button>
          <span class="more"><button class="btn" data-a="more" aria-expanded="${moreOpen}" aria-haspopup="true">More<i class="caret" aria-hidden="true"></i></button>
            <span class="moremenu"${moreOpen ? '' : ' hidden'} role="menu">
              <button role="menuitem" data-a="double">${T.double ? 'Turn off double points' : 'Turn on double points'}</button>
              <button role="menuitem" data-a="endweek">End week ${T.week}</button>
              <button role="menuitem" data-a="keys">${showKeys ? 'Hide' : 'Show'} keyboard shortcuts</button>
            </span></span>
        </div>
      </div>
      ${picked ? `<div class="picked-note">Picked: <b>${esc(tname(c, picked))}</b>. Press + or −, C, M, or P. Esc to deselect.</div>` : ''}
      ${showKeys ? `<div class="keys hint">Press a ${esc(W('team'))}'s number, then <kbd>+</kbd> or <kbd>−</kbd>, <kbd>C</kbd> clean +2, <kbd>M</kbd> mostly clean +1, <kbd>P</kbd> 3-point challenge. <kbd>U</kbd> undo, <kbd>D</kbd> double points, <kbd>Esc</kbd> deselect, <kbd>?</kbd> show or hide this.</div>` : ''}
      <div class="proj-title">${esc(c.name)}<span>Quarter ${T.quarter}, week ${T.week}${T.double ? ' · Double points!' : ''}</span></div>
      ${act.length ? `<div class="cards room-grid" style="--cols:${lay.cols}">${cards}</div>`
        : `<div class="empty"><h2>No tables are in use for ${esc(c.name)}</h2><p>Turn tables on in Classes & settings.</p><a class="btn primary" href="settings.html#class=${esc(c.id)}">Open settings</a></div>`}

      <div class="panels">
        ${shopOn(c.id) ? shopPanel(c) : ''}

              <tr><td>Top table</td><td>${names(c, lead)}</td><td>${prev >= 1 ? (prevLead.length ? withScore(c, prevLead, id => byQuarter() ? qThrough(c.id, id, prev) + ' pts this quarter' : pts(c.id, id, prev) + ' pts') : '<span class="muted">No points that week</span>') : '<span class="muted">—</span>'}</td></tr>
              <tr><td>Most improved</td><td>${T.week === 1 ? '<span class="muted">Starts week 2</span>' : imp ? (imp.length ? names(c, imp) : '<span class="muted">No table ahead of last week yet</span>') : '<span class="muted">Waiting for points</span>'}</td>
                  <td>${prevImp ? (prevImp.length ? withScore(c, prevImp, id => { const a = pts(c.id, id, prev - 1), b2 = pts(c.id, id, prev); return '+' + (b2 - a) + ' (' + a + ' → ' + b2 + ')'; }) : '<span class="muted">No table beat its week ' + (prev - 1) + ' score</span>') : '<span class="muted">' + (prev === 1 ? 'Starts week 2' : '—') + '</span>'}</td></tr>

          ${act.map(t => { const g = goals[gkey(t.id)] || {}; return `<div class="goalrow">
            <span><span class="swatch" style="background:${esc(t.color)}"></span>${esc(t.name)}</span>
            <select data-c="goal" data-id="${esc(t.id)}" aria-label="${esc(t.name)} goal"><option value="">Choose a goal</option>
              ${opts.map(o => `<option${o === g.text ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>
            <label class="small"><input type="checkbox" data-c="met" data-id="${esc(t.id)}"${g.met ? ' checked' : ''}> Met</label></div>`; }).join('') || '<p class="muted">No tables in use.</p>'}
        </section>

        <section class="panel" aria-labelledby="h-weeks"><h2 id="h-weeks">This quarter by week</h2>
          <p class="hint" style="margin-top:0">Big number: the quarter total after that week. Small (+ or −): points earned that week. Badges: prizes won that week.</p>
          <div class="scroll"><table class="plain wrec">
            <thead><tr><th>${esc(W('team', { cap: true }))}</th>${weeks.map(w => `<th class="n${w === T.week ? ' now' : ''}">${w === T.week ? 'Wk ' + w + '<br><span class="sofar">so far</span>' : 'Wk ' + w}</th>`).join('')}</tr></thead>
            <tbody>${act.map(t => `<tr><td class="tm"><span class="swatch" style="background:${esc(t.color)}"></span>${esc(t.name)}</td>
              ${weeks.map(w => { const wp = pts(c.id, t.id, w), tot = qThrough(c.id, t.id, w), done = w < T.week;
                const all = act.map(x => qThrough(c.id, x.id, w)), place = 1 + all.filter(v => v > tot).length;
                const won = kind => T.prizes.some(x => x.c === c.id && x.q === T.quarter && x.w === w && x.kind === kind && x.tables.some(y => y.id === t.id));
                const badges = done ? (won('top') ? '🏆' : '') + (won('improved') ? '📈' : '') + (won('streak') ? '🔥' : '') : '';
                return `<td class="n wcell${done ? '' : ' now'}"><span class="wt">${tot}</span><span class="ww${wp < 0 ? ' neg' : ''}">${wp > 0 ? '+' : ''}${wp}</span>${done ? `<span class="wp${place === 1 ? ' p1' : ''}">${place}${place === 1 ? 'st' : place === 2 ? 'nd' : place === 3 ? 'rd' : 'th'}</span>` : ''}<span class="wb">${badges}</span></td>`; }).join('')}</tr>`).join('')}</tbody>
          </table></div>
          <p class="wlegend">🏆 Top ${esc(W('team'))} (${byQuarter() ? 'highest quarter total' : 'most points that week'}) · 📈 Most improved (biggest gain over the week before) · 🔥 Streak (top 2+ weeks in a row)</p>
        </section>

        <section class="panel capspanel" aria-labelledby="h-caps"><h2 id="h-caps">${esc(W('lead', { plural: true, cap: true }))}</h2>
          <p class="hint">${T.rotateEvery ? 'Captains change automatically every ' + (T.rotateEvery === 1 ? 'week' : T.rotateEvery + ' weeks') + ' when you end the week. The next captain is whoever has had the fewest turns.' : 'Captains only change when you pick them.'} Numbers are weeks as captain this year.</p>
          ${capPanel}
        </section>

        <section class="panel" aria-labelledby="h-record"><h2 id="h-record">Prize record${due.length ? ` <span class="duebadge">${due.length} to hand out</span>` : ''}</h2>
          ${record}
        </section>

        <section class="panel" aria-labelledby="h-log"><h2 id="h-log">Recent points</h2>
          <div class="log">${recent.map(e => `<div>Q${e.q} week ${e.w}: ${esc(tname(c, e.t))} ${e.d > 0 ? '+' : ''}${e.d}${e.note ? ' <span class="muted">(' + esc(e.note) + ')</span>' : ''}</div>`).join('') || '<span class="muted">No points yet this quarter.</span>'}</div>
        </section>
      </div>

      <details class="more"><summary>Tracker settings</summary>
        <div style="margin-top:12px;max-width:640px">
          <label for="menu"><b>Weekly goal menu</b></label>
          <p class="hint">One goal per line. Used by every class.</p>
          <textarea id="menu" rows="7">${esc(T.menu)}</textarea>
          <label for="rot" style="display:block;margin-top:16px"><b>Captain rotation</b></label>
          <select id="rot" data-c="rot" style="margin-top:4px">
            <option value="1"${T.rotateEvery === 1 ? ' selected' : ''}>New captains every week</option>
            <option value="2"${T.rotateEvery === 2 ? ' selected' : ''}>New captains every 2 weeks</option>
            <option value="0"${!T.rotateEvery ? ' selected' : ''}>Only when I pick them</option>
          </select>
          <select data-c="caporder" aria-label="Who's next">
            <option value="fair"${T.capOrder !== 'seat' ? ' selected' : ''}>Next: whoever has had the fewest turns</option>
            <option value="seat"${T.capOrder === 'seat' ? ' selected' : ''}>Next: the next seat at each table</option>
          </select>
          <label class="rv" style="display:flex;gap:8px;margin-top:16px"><input type="checkbox" data-c="shopon"${shopOn(c.id) ? ' checked' : ''}> <span><b>Table Shop for ${esc(c.name)}</b><br><span class="hint" style="margin:0">Tables spend points on privileges. Only this class; others are unchanged.</span></span></label>
          <label style="display:block;margin-top:16px"><b>Top table each week goes to</b>
            <select data-c="topby" style="display:block;margin-top:4px"><option value="quarter"${byQuarter() ? ' selected' : ''}>The highest quarter total so far</option><option value="week"${byQuarter() ? '' : ' selected'}>The most points that week</option></select></label>
          <p class="hint" style="margin-top:2px">Most improved is always the biggest jump from one week to the next. Weeks you've already ended keep their winners.</p>
          <label for="repq" style="display:block;margin-top:16px"><b>Quarter report</b></label>
          <p class="hint" style="margin-top:0">A spreadsheet file (CSV) with every class's weekly points, captains, and prizes. It opens in Google Sheets or Excel.</p>
          <div class="bar"><select id="repq">${quarters.map(q => `<option value="${q}">Quarter ${q}</option>`).join('')}</select>
            <button class="btn" data-a="report">Download report</button></div>
          <div class="bar" style="margin-top:18px">
            <button class="btn" data-a="newq">Start a new quarter</button>
            <button class="btn danger" data-a="resetpts">Reset all points</button>
          </div>
          <p class="hint" style="margin-top:8px">A new quarter starts every class at week 1 with zero points and clears streaks; earlier quarters stay in your backup. "Reset all points" erases points, goals, and streaks for every class.</p>
        </div>
      </details>`;
  }

  // "Final" most improved for a completed week (doesn't need current-week points check)
  function improvedFinal(c, w){
    const rows = Suite.activeTables(c).map(t => { const now = pts(c.id, t.id, w), before = pts(c.id, t.id, w - 1); return [t.id, now > 0 && now > before ? now - before : 0]; });
    if (!rows.length) return null;
    const best = Math.max(...rows.map(r => r[1]));
    if (best <= 0) return [];   // no table earned more than the week before
    return rows.filter(r => r[1] === best).map(r => r[0]);
  }


  /* ---------- captains ---------- */
  // Weeks each student has been captain (all year), from the history recorded at each "End week".
  function captainWeeks(c){
    const n = {};
    T.captainLog.forEach(x => { if (x.c === c.id && x.sid) n[x.sid] = (n[x.sid] || 0) + 1; });
    return n;
  }
  function lastCaptained(c){
    const last = {};
    T.captainLog.forEach(x => { if (x.c === c.id && x.sid) last[x.sid] = Math.max(last[x.sid] || 0, x.q * 100 + x.w); });
    return last;
  }
  // Next captain for a table: whoever has had the fewest weeks, then whoever went longest ago.
  function nextCaptain(c, tid){
    const members = c.students.filter(s => s.tableId === tid);
    if (!members.length) return null;
    const cur = (T.captains[c.id] || {})[tid];
    if (T.capOrder === 'seat') {   // follow the seating chart: the next seat around the table
      const bySeat = members.slice().sort((a, b) => (Number.isInteger(a.seat) ? a.seat : 99) - (Number.isInteger(b.seat) ? b.seat : 99) || a.name.localeCompare(b.name));
      const i = bySeat.findIndex(s => s.name === cur); return bySeat[(i + 1) % bySeat.length];
    }
    const weeks = captainWeeks(c), last = lastCaptained(c);
    const pool = members.length > 1 ? members.filter(s => s.name !== cur) : members;
    return pool.slice().sort((a, b) => (weeks[a.id] || 0) - (weeks[b.id] || 0) || (last[a.id] || 0) - (last[b.id] || 0) || a.name.localeCompare(b.name))[0];
  }
  function recordCaptains(c){
    const caps = T.captains[c.id] || {};
    Suite.activeTables(c).forEach(t => {
      const name = caps[t.id]; if (!name) return;
      const st = c.students.find(s => s.name === name && s.tableId === t.id) || c.students.find(s => s.name === name);
      T.captainLog.push({ c: c.id, q: T.quarter, w: T.week, t: t.id, sid: st ? st.id : '', name });
    });
  }
  function rotateCaptains(c){
    const caps = T.captains[c.id] = T.captains[c.id] || {};
    Suite.activeTables(c).forEach(t => { const n = nextCaptain(c, t.id); if (n) caps[t.id] = n.name; });
  }

  /* ---------- prize record ---------- */
  const PRIZE_NAMES = { top: 'Top table', improved: 'Most improved', streak: 'Streak bonus', quarter: 'Quarter champion' };
  function rescore(){
    const before = JSON.stringify([T.prizes, T.streaks]);
    const keepGiven = new Set(T.prizes.filter(x => x.given).map(x => [x.c, x.q, x.w, x.kind, x.tables.map(t => t.id).sort().join(',')].join('|')));
    T.prizes = T.prizes.filter(x => !(x.q === T.quarter && ['top', 'improved', 'streak'].includes(x.kind)));
    classes().forEach(k => {
      const s = {}; k.tables.forEach(t => { s[t.id] = 0; });
      for (let w = 1; w < T.week; w++) {
        const lead = topLeaders(k, w); k.tables.forEach(t => { s[t.id] = lead.includes(t.id) ? s[t.id] + 1 : 0; });
        recordPrizes(k, 'top', lead, w);
        if (w >= 2 && T.log.some(e => e.c === k.id && e.q === T.quarter && e.w === w)) recordPrizes(k, 'improved', improvedFinal(k, w), w);
        recordPrizes(k, 'streak', Suite.activeTables(k).filter(t => lead.includes(t.id) && s[t.id] >= 2).map(t => t.id), w);
      }
      T.streaks[k.id] = s;
    });
    T.prizes.forEach(x => { if (keepGiven.has([x.c, x.q, x.w, x.kind, x.tables.map(t => t.id).sort().join(',')].join('|'))) x.given = true; });
    if (JSON.stringify([T.prizes, T.streaks]) !== before) save();
  }
  function recordPrizes(c, kind, ids, w){
    if (!ids || !ids.length) return;
    T.prizes.push({ id: Suite.uid(), c: c.id, q: T.quarter, w: w || T.week, kind, tables: ids.map(id => ({ id, name: tname(c, id) })), given: false });
  }
  const ungiven = c => T.prizes.filter(x => x.c === c.id && !x.given);

  /* ---------- quarter report (CSV for Sheets or Excel) ---------- */
  function downloadReport(q){
    const cell = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const rows = [['Class', 'Week', 'Table', 'Points', 'Captain', 'Prizes']];
    const lastWeek = q === T.quarter ? T.week : Math.max(1, ...T.log.filter(e => e.q === q).map(e => e.w));
    classes().forEach(c => {
      const tables = c.tables.filter(t => t.open || T.log.some(e => e.c === c.id && e.t === t.id && e.q === q));
      for (let w = 1; w <= lastWeek; w++) tables.forEach(t => {
        const p = T.log.reduce((a, e) => a + (e.c === c.id && e.t === t.id && e.q === q && e.w === w ? e.d : 0), 0);
        const cap = (T.captainLog.find(x => x.c === c.id && x.q === q && x.w === w && x.t === t.id) || {}).name || '';
        const won = T.prizes.filter(x => x.c === c.id && x.q === q && x.w === w && x.kind !== 'quarter' && x.tables.some(y => y.id === t.id)).map(x => PRIZE_NAMES[x.kind]).join('; ');
        rows.push([c.name, w, t.name, p, cap, won]);
      });
      tables.forEach(t => {
        const total = T.log.reduce((a, e) => a + (e.c === c.id && e.t === t.id && e.q === q ? e.d : 0), 0);
        const champ = T.prizes.some(x => x.c === c.id && x.q === q && x.kind === 'quarter' && x.tables.some(y => y.id === t.id));
        rows.push([c.name, 'Quarter total', t.name, total, '', champ ? PRIZE_NAMES.quarter : '']);
      });
    });
    const csv = rows.map(r => r.map(cell).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
    a.download = 'table-points-quarter-' + q + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // Tables numbered the way they sit in the room: across the top row, then the next row.
  function keyOrder(c){
    const lay = Suite.roomLayout(c.tables);
    return Suite.activeTables(c).slice().sort((a, b) => lay.at[a.id].row - lay.at[b.id].row || lay.at[a.id].col - lay.at[b.id].col).map(t => t.id);
  }
  function award(c, tid, d, note){
    note = note || '';
    if (T.double && d > 0) { d *= 2; note = note ? note + ', double' : 'Double'; }
    T.log.push({ id: Suite.uid(), c: c.id, t: tid, d, w: T.week, q: T.quarter, note });
    save(); bump = tid; render(); setTimeout(() => { if (bump === tid) { bump = null; const el = document.querySelector('[data-card="' + tid + '"]'); if (el) el.classList.remove('bump'); } }, 650);
  }
  function undoLast(c){
    for (let i = T.log.length - 1; i >= 0; i--) {
      const x = T.log[i];
      if (x.c === c.id && x.q === T.quarter) {
        T.log.splice(i, 1);
        if (x.g && T.goals[c.id] && T.goals[c.id][x.g]) T.goals[c.id][x.g].met = false;
        save(); render(); Suite.toast('Removed ' + (x.d > 0 ? '+' : '') + x.d + ' from ' + tname(c, x.t));
        return;
      }
    }
    Suite.toast('Nothing to undo');
  }
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('.suite-dialog') || document.body.classList.contains('timer-open')) return;
    if (/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) return;
    const c = curClass(classes()); if (!c) return;
    const k = e.key;
    if (/^[1-9]$/.test(k)) {
      const order = keyOrder(c), id = order[+k - 1];
      if (!id) return;
      picked = picked === id ? null : id; render(); e.preventDefault(); return;
    }
    if (k === 'Escape' && picked) { picked = null; render(); e.stopImmediatePropagation(); return; }
    const acts = { '+': [1, ''], '=': [1, ''], '-': [-1, ''], '_': [-1, ''], 'c': [2, 'Clean area'], 'm': [1, 'Mostly clean'], 'p': [3, 'Challenge'] };
    const lk = k.length === 1 ? k.toLowerCase() : k;
    if (acts[lk]) {
      e.preventDefault();
      if (!picked) { Suite.toast('Press a table number first (1 to ' + keyOrder(c).length + ')'); return; }
      award(c, picked, acts[lk][0], acts[lk][1]); return;
    }
    if (k === '?') { e.preventDefault(); showKeys = !showKeys; render(); return; }
    if (lk === 'u') { e.preventDefault(); undoLast(c); }
    else if (lk === 'd') { e.preventDefault(); T.double = !T.double; save(); render(); Suite.toast(T.double ? 'Double points on' : 'Double points off'); }
  }, true);

  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-a]');
    if (moreOpen && (!el || el.dataset.a !== 'more')) { moreOpen = false; if (!el) { render(); return; } }
    if (!el) return;
    if (el.dataset.a === 'more') { moreOpen = !moreOpen; render(); return; }
    if (el.dataset.a === 'keys') { showKeys = !showKeys; render(); return; }
    const a = el.dataset.a, id = el.dataset.id;
    const c = curClass(classes());
    if (a === 'pick') { if (id === 'auto') AUTO.set(true); else { AUTO.set(false); T.cur = id; save(); } render(); }
    else if (a === 'proj') { proj = !proj; render(); }
    else if (a === 'shproj') { shopProj = !shopProj; render(); }
    else if (a === 'shundo') { const c = curClass(classes()), S = shopOf(c.id), q = T.quarter, i = (S.buys || []).map(b => b.q).lastIndexOf(q); if (i < 0) return; const b = S.buys[i];
      if (!await Suite.dialog({ title: 'Undo the last purchase?', body: `${b.name} (${b.cost} pts) goes back to the ${W('team', { plural: true })} that paid.`, ok: 'Undo it' })) return; S.buys.splice(i, 1); save(); render(); Suite.toast('Purchase undone'); }
    else if (a === 'shbuy') { const c = curClass(classes()), S = shopOf(c.id), it = S.menu.find(x => x.id === el.dataset.id); if (!it || !S.open) return;
      const act = Suite.activeTables(c), back = document.createElement('div'); back.className = 'suite-dialog-back';
      back.innerHTML = `<div class="suite-dialog" role="dialog" aria-modal="true"><h2>Buy: ${esc(it.name)}</h2><p>${it.cost} points. Which ${esc(W('team'))} is buying?</p>
        <div class="sh-pick">${act.map(t => { const av = avail(c.id, t.id), ok = av >= it.cost; return `<label class="rv${ok ? '' : ' no'}"><input type="radio" name="shb" value="${esc(t.id)}"${ok ? '' : ' disabled'}> ${esc(t.name)} <span class="muted small">(${av} available${ok ? '' : ': not enough'})</span></label>`; }).join('')}</div>
        <label class="lb" for="shn">Note <span class="muted small">(optional)</span></label><input class="field" id="shn" style="width:100%">
        <div class="suite-dialog-actions"><button class="btn" data-r="no">Cancel</button><button class="btn primary" data-r="yes">Buy it</button></div></div>`;
      document.body.appendChild(back);
      back.addEventListener('click', ev => { if (ev.target === back || ev.target.closest('[data-r="no"]')) return back.remove(); if (!ev.target.closest('[data-r="yes"]')) return;
        const r = back.querySelector('input[name="shb"]:checked'); if (!r) { Suite.toast('Pick a ' + W('team') + ' that can afford it'); return; }
        if (avail(c.id, r.value) < it.cost) { Suite.toast('Not enough points available'); return; }
        S.buys = S.buys || []; S.buys.push({ id: Suite.uid(), q: T.quarter, at: Date.now(), kind: 'item', itemId: it.id, name: it.name, cost: it.cost, note: back.querySelector('#shn').value.trim(), parts: [{ t: r.value, amt: it.cost }] });
        back.remove(); save(); render(); Suite.toast(`${(c.tables.find(t => t.id === r.value) || {}).name} bought ${it.name}`); }); }
    else if (a === 'shbuyc') { const c = curClass(classes()), S = shopOf(c.id), it = S.menu.find(x => x.id === el.dataset.id); if (!it || !S.open) return;
      const act = Suite.activeTables(c), back = document.createElement('div'); back.className = 'suite-dialog-back';
      back.innerHTML = `<div class="suite-dialog" role="dialog" aria-modal="true"><h2>Group Charter: ${esc(it.name)}</h2><p>Price: <b>${it.cost}</b> points. Enter how much each ${esc(W('team'))} puts in; the total must equal the price.</p>
        <div class="sh-pool">${act.map(t => { const av = Math.max(0, avail(c.id, t.id)); return `<label class="sh-pr"><span>${esc(t.name)} <span class="muted small">(${avail(c.id, t.id)} available)</span></span><input class="field num" type="number" min="0" max="${av}" step="1" value="0" data-pt="${esc(t.id)}" data-max="${av}"${av ? '' : ' disabled'}></label>`; }).join('')}</div>
        <div class="sh-tot">Total: <b id="sh-sum">0</b> / ${it.cost}</div>
        <label class="lb" for="shn">Note <span class="muted small">(optional)</span></label><input class="field" id="shn" style="width:100%">
        <div class="suite-dialog-actions"><button class="btn" data-r="no">Cancel</button><button class="btn primary" data-r="yes" disabled>Buy the charter</button></div></div>`;
      document.body.appendChild(back);
      const upd = () => { const inputs = [...back.querySelectorAll('[data-pt]')], sum = inputs.reduce((n, x) => n + (Math.max(0, Math.min(+x.dataset.max, parseInt(x.value, 10) || 0))), 0); back.querySelector('#sh-sum').textContent = sum; back.querySelector('[data-r="yes"]').disabled = sum !== it.cost; };
      back.addEventListener('input', upd);
      back.addEventListener('click', ev => { if (ev.target === back || ev.target.closest('[data-r="no"]')) return back.remove(); if (!ev.target.closest('[data-r="yes"]')) return;
        const parts = [...back.querySelectorAll('[data-pt]')].map(x => ({ t: x.dataset.pt, amt: parseInt(x.value, 10) || 0 })).filter(x => x.amt > 0);
        if (parts.some(x => x.amt > avail(c.id, x.t))) { Suite.toast('A ' + W('team') + ' is putting in more than it has'); return; }
        if (parts.reduce((n, x) => n + x.amt, 0) !== it.cost) { Suite.toast('The amounts must add up to ' + it.cost); return; }
        S.buys = S.buys || []; S.buys.push({ id: Suite.uid(), q: T.quarter, at: Date.now(), kind: 'charter', itemId: it.id, name: it.name, cost: it.cost, note: back.querySelector('#shn').value.trim(), parts });
        back.remove(); save(); render(); Suite.toast('Charter purchased: ' + it.name); }); }
    else if (a === 'shedit') { const c = curClass(classes()), S = shopOf(c.id), back = document.createElement('div'); back.className = 'suite-dialog-back';
      const draw = () => { back.innerHTML = `<div class="suite-dialog" role="dialog" aria-modal="true" style="max-width:640px"><h2>Edit the shop menu</h2>
        ${S.menu.map((it, i) => `<div class="sh-er"><select data-mi="${i}" data-mf="tier">${TIERS.map(t => `<option${t === it.tier ? ' selected' : ''}>${t}</option>`).join('')}</select><input class="field" data-mi="${i}" data-mf="name" value="${esc(it.name)}" style="flex:1;min-width:0"><input class="field num" type="number" min="1" data-mi="${i}" data-mf="cost" value="${it.cost}" style="width:70px"><button class="btn quiet danger small" data-mrm="${i}" aria-label="Remove">×</button></div>`).join('')}
        <div class="bar" style="margin-top:8px"><button class="btn small" data-madd="1">Add an item</button><button class="btn small quiet" data-mreset="1">Reset to the original menu</button></div>
        <p class="hint">Past purchases keep the name and price they had when bought.</p>
        <div class="suite-dialog-actions"><button class="btn primary" data-mdone="1">Done</button></div></div>`; };
      document.body.appendChild(back); draw();
      back.addEventListener('change', ev => { const i = ev.target.dataset.mi; if (i === undefined) return; const it = S.menu[+i], f = ev.target.dataset.mf; if (f === 'cost') it.cost = Math.max(1, parseInt(ev.target.value, 10) || 1); else it[f] = ev.target.value.trim() || it[f]; save(); });
      back.addEventListener('click', async ev => { const t = ev.target;
        if (t === back || t.closest('[data-mdone]')) { back.remove(); render(); return; }
        if (t.closest('[data-madd]')) { S.menu.push({ id: 'm' + Suite.uid(), tier: 'Economy', name: 'New item', cost: 5 }); save(); draw(); }
        else if (t.closest('[data-mrm]')) { S.menu.splice(+t.closest('[data-mrm]').dataset.mrm, 1); save(); draw(); }
        else if (t.closest('[data-mreset]')) { S.menu = SHOP_MENU(); save(); draw(); } }); }

    else if (!c) return;
    else if (a === 'aw') { award(c, id, +el.dataset.d, el.dataset.note || ''); }
    else if (a === 'double') { T.double = !T.double; save(); render(); }
    else if (a === 'undo') { undoLast(c); }
    else if (a === 'nextcap') {
      const n = nextCaptain(c, id); if (!n) return;
      (T.captains[c.id] = T.captains[c.id] || {})[id] = n.name; save(); render(); Suite.toast(n.name + ' is captain of ' + tname(c, id));
    }
    else if (a === 'report') { downloadReport(+document.getElementById('repq').value); }
    else if (a === 'endweek') {
      if (!await Suite.dialog({ title: 'End week ' + T.week + '?', body: 'This locks in this week\'s winners for every class and starts week ' + (T.week + 1) + '. For a short week, skip this so its points roll into next week.', ok: 'End week' })) return;
      const rotate = T.rotateEvery > 0 && T.week % T.rotateEvery === 0;
      classes().forEach(k => {
        const w = topLeaders(k, T.week), s = T.streaks[k.id] = T.streaks[k.id] || {};
        k.tables.forEach(t => { s[t.id] = w.includes(t.id) ? (s[t.id] || 0) + 1 : 0; });
        recordPrizes(k, 'top', w);
        if (T.week >= 2 && T.log.some(e => e.c === k.id && e.q === T.quarter && e.w === T.week)) recordPrizes(k, 'improved', improvedFinal(k, T.week));
        recordPrizes(k, 'streak', Suite.activeTables(k).filter(t => w.includes(t.id) && s[t.id] >= 2).map(t => t.id));
        recordCaptains(k);
        if (rotate) rotateCaptains(k);
      });
      T.week++; T.double = false; save(); render();
      Suite.toast('Week ' + T.week + ' started' + (rotate ? '. New captains are up.' : ''));
    }
    else if (a === 'newq') {
      if (!await Suite.dialog({ title: 'Start quarter ' + (T.quarter + 1) + '?', body: 'Every class goes back to week 1 with zero points, and streaks reset. Table Shop balances start fresh too; this quarter\'s purchase history is kept. Download a backup first if you want a record of this quarter.', ok: 'Start new quarter', danger: true })) return;
      classes().forEach(k => recordPrizes(k, 'quarter', leaders(Suite.activeTables(k).map(t => [t.id, pts(k.id, t.id)])), T.week));
      T.quarter++; T.week = 1; T.streaks = {}; T.double = false; save(); render();
    }
    else if (a === 'resetpts') {

      T.log = []; T.goals = {}; T.streaks = {}; T.prizes = []; T.captainLog = []; T.week = 1; T.quarter = 1; T.double = false; save(); render();
    }
  });

  document.addEventListener('change', e => {
    const el = e.target, k = el.dataset.c, id = el.dataset.id;
    const c = curClass(classes());
    if (el.id === 'menu') { T.menu = el.value; save(); render(); return; }
    if (!c || !k) return;
    if (k === 'rot') { T.rotateEvery = +el.value; save(); render(); return; }
    if (k === 'caporder') { T.capOrder = el.value; save(); render(); return; }
    if (k === 'shopon') { const c = curClass(classes()); T.shop = T.shop || {}; T.shop[c.id] = Object.assign({ on: false, open: false, menu: SHOP_MENU(), buys: [] }, T.shop[c.id] || {}); T.shop[c.id].on = el.checked; save(); render(); Suite.toast(el.checked ? 'Table Shop on for ' + c.name : 'Table Shop off (its history is kept)'); return; }
    if (k === 'shopopen') { const c = curClass(classes()); shopOf(c.id).open = el.checked; save(); render(); Suite.toast(el.checked ? 'Shop open' : 'Shop closed'); return; }
    if (k === 'shq') { histQ = +el.value; render(); return; }
    if (k === 'topby') { T.topBy = el.value; rescore(); save(); render(); Suite.toast(el.value === 'week' ? 'Top table: most points that week' : 'Top table: highest quarter total'); return; }
    if (k === 'given') { const x = T.prizes.find(p => p.id === id); if (x) { x.given = el.checked; save(); render(); } return; }
    if (k === 'cap') { (T.captains[c.id] = T.captains[c.id] || {})[id] = el.value; }
    else if (k === 'goal') { const g = T.goals[c.id] = T.goals[c.id] || {}; const key = gkey(id); g[key] = Object.assign({}, g[key], { text: el.value }); }
    else if (k === 'met') {
      const g = T.goals[c.id] = T.goals[c.id] || {}; const key = gkey(id); const was = !!(g[key] && g[key].met);
      if (el.checked && !was) T.log.push({ id: Suite.uid(), c: c.id, t: id, d: 2, w: T.week, q: T.quarter, note: 'Weekly goal', g: key });
      if (!el.checked && was) { const i = T.log.map(x => x.g).lastIndexOf(key); if (i > -1) T.log.splice(i, 1); }
      g[key] = Object.assign({}, g[key], { met: el.checked });
    }
    save(); render();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && shopProj && !document.querySelector('.suite-dialog')) { shopProj = false; render(); return; } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && proj && !document.querySelector('.suite-dialog')) { proj = false; render(); } });
  window.addEventListener('suite:change', e => { if (e.detail && (e.detail.external || e.detail.key === '*')) { load(); render(); } });

  function fitCards(){
    const g = document.querySelector('.cards'); if (!g || document.body.classList.contains('proj') || innerWidth <= 760) { if (g) g.classList.remove('fit1', 'fit2', 'fit3'); return; }
    g.classList.remove('fit1', 'fit2', 'fit3');
    const bottomOK = () => { const r = g.getBoundingClientRect(); return r.top + window.scrollY + r.height <= innerHeight - 8; };
    for (const step of ['fit1', 'fit2', 'fit3']) { if (bottomOK()) return; g.classList.add(step); }
  }
  window.addEventListener('resize', () => requestAnimationFrame(fitCards));
  { const baseRender = render; render = function(){ const r = baseRender.apply(this, arguments); fitCards(); return r; }; }
  Suite.mountNav('tracker');
  rescore();
  render();
})();
</script>
</body>
</html>
