<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Points · Classroom Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=2026-10-02d">
<script src="shared/core.js?v=2026-10-02d"></script>
<script>window.PAGE_VERSION = '2026-10-02d';</script>
<style>
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.classes{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding:2px}
.classes button{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:transparent;border:2px solid var(--edge);border-radius:999px;padding:6px 18px;cursor:pointer;white-space:nowrap}
.classes button:hover{background:var(--wash)}
.classes button[aria-current="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.statusbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.when{font-family:var(--serif);font-size:30px}
.more{position:relative;display:inline-flex}
.more .caret{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:4px}
.moremenu{position:absolute;right:0;top:calc(100% + 6px);z-index:25;min-width:210px;background:var(--sheet);border:2px solid var(--edge);border-radius:16px;padding:6px;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.moremenu[hidden]{display:none}
.moremenu button{font:inherit;font-size:15px;font-weight:600;text-align:left;background:none;border:0;border-radius:10px;padding:8px 12px;color:var(--ink);cursor:pointer}
.moremenu button:hover{background:var(--wash)}
.double-on{background:var(--land)!important;border-color:var(--land)!important;color:var(--on-land)!important}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.cards.room-grid{grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
@media (max-width:760px){.cards.room-grid{grid-template-columns:1fr}.cards.room-grid .card{grid-row:auto!important;grid-column:auto!important}}
.card{background:var(--sheet);border:2px solid var(--edge);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.card.lead{box-shadow:0 0 0 4px var(--edge),0 10px 0 4px rgba(12,20,30,.18)}
.band{background:var(--tc);color:var(--tx);min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 20px}
.band h2{font-size:25px;color:var(--tx)}
.band .speed i{background:var(--tx);opacity:.7}
.lead-tag{background:#FFFFFF;color:#1C2B3A;border:2px solid #1C2B3A;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.keynum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:#1C2B3A;font:700 14px var(--sans);margin-right:10px;vertical-align:4px}
.card.picked{outline:4px solid var(--land);outline-offset:4px}
@media (prefers-reduced-motion:no-preference){.card.bump .score{animation:bump .6s ease-out}@keyframes bump{30%{transform:scale(1.18);color:var(--land)}}}
.keys{margin:-6px 0 14px}
.picked-note{margin:-6px 0 12px;font-size:15px;color:var(--ink-2)}
body.proj .picked-note{display:none}
body.nocaps .cap,body.nocaps .capspanel,body.nocaps .nextcap{display:none!important}
body.nogoals .goalspanel{display:none!important}
.nextcap{min-height:0!important;padding:2px 10px!important;font-size:13px!important}
body.proj .nextcap{display:none}
.caprow{padding:8px 0;border-top:1px solid var(--rule)}
.caprow:first-of-type{border-top:0}
.caphead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.capnames{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.capnames span{font-size:14px;border:1.5px solid var(--rule);border-radius:999px;padding:1px 10px}
.capnames span b{font-weight:600;color:var(--ink-2);margin-left:2px}
.capnames span.is-now{border-color:var(--land);font-weight:600}
.duebadge{font:600 13px var(--sans);letter-spacing:.04em;background:var(--land);color:var(--on-land);border-radius:999px;padding:2px 10px;vertical-align:5px;margin-left:6px}
table.record tr.given td{color:var(--ink-2)}
table.record input{width:18px;height:18px}
.keys kbd{font:600 13px var(--sans);border:1.5px solid var(--edge);border-radius:6px;padding:0 6px;background:var(--sheet)}
body.proj .keys{display:none}
body.proj .keynum{width:34px;height:34px;font-size:18px}
.card-body{padding:10px 20px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.facts{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.score{font-family:var(--serif);font-size:62px;line-height:1}
.sub{font-size:15px;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.tag{font-size:13px;font-weight:600;border:1.5px solid var(--edge);border-radius:999px;padding:1px 10px;background:var(--paper)}
.cap{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2)}
.cap select{font-size:14px;padding:3px 8px;flex:1;min-width:0;max-width:170px}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.awards button{font:inherit;font-size:15px;font-weight:700;border-radius:999px;border:2px solid var(--edge);background:var(--sheet);color:var(--ink);min-height:44px;padding:6px 4px;cursor:pointer}
.awards button:hover{background:var(--wash)}
.awards .plus{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.awards .plus:hover{background:var(--sea);filter:brightness(1.15)}
.awards .minus{color:var(--plum);border-color:var(--plum)}
.awards .hot{background:var(--land);border-color:var(--land);color:var(--on-land)}
.awards .hot:hover{background:var(--land);filter:brightness(1.1)}
.awards .wide{grid-column:span 2}
.awards button:active{transform:scale(.97)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;margin-top:32px}
.panel>h2{font-size:22px;padding-bottom:6px;border-bottom:3px solid var(--land);margin-bottom:10px}
table.plain{width:100%;border-collapse:collapse;font-size:15px}
table.plain th{text-align:left;font-weight:400;color:var(--ink-2);font-size:14px;padding:4px 8px}
table.plain td{padding:6px 8px;border-top:1px solid var(--rule);vertical-align:top}
table.plain td.n{text-align:right;font-variant-numeric:tabular-nums}
.goalrow{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--rule)}
.goalrow:first-of-type{border-top:0}
.goalrow select{min-width:0;width:100%}
.log{font-size:14px;max-height:240px;overflow:auto}
.log div{padding:3px 0;border-top:1px solid var(--rule)}
details.more{margin-top:28px;background:var(--sheet);border:1px solid var(--rule);border-radius:20px;padding:10px 14px}
details.more summary{cursor:pointer;font-weight:700}
.empty{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;padding:28px;max-width:640px}
.empty h2{margin-bottom:8px}
#exit-proj{display:none}
/* projector view */
body.proj #suite-nav,body.proj .classes,body.proj .statusbar,body.proj .panels,body.proj details.more,body.proj .awards,body.proj .cap select{display:none!important}
body.proj #exit-proj{display:block;position:fixed;top:12px;right:12px;opacity:.5;z-index:5}
body.proj #exit-proj:hover,body.proj #exit-proj:focus{opacity:1}
body.proj .wrap{max-width:none;padding:28px 36px}
body.proj .proj-title{display:block}
.proj-title{display:none;font-family:var(--serif);font-size:44px;margin-bottom:22px}
.proj-title span{font-family:var(--sans);font-size:22px;font-weight:400;color:var(--ink-2);margin-left:14px}
body.proj .cards{gap:22px}
body.proj .band{min-height:70px;padding:8px 26px}
body.proj .band h2{font-size:36px}
body.proj .lead-tag{font-size:18px;padding:4px 16px}
body.proj .card-body{padding:14px 26px 24px}
body.proj .score{font-size:84px}
body.proj .sub,body.proj .cap{font-size:20px}
body.proj .cap.nocap{display:none}
body.proj .tag{font-size:18px;padding:2px 12px}
</style>
</head>
<body>
<header id="suite-nav"></header>
<button class="btn" id="exit-proj" data-a="proj">Exit projector view</button>
<div class="wrap" id="app"></div>

<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  const MENU = [
    'Everyone shares at least once each class',
    'No talking during instructions all week',
    'Everyone starts the warm-up within 1 minute of the bell',
    'Table area clean before the bell, all 5 days',
    'Everyone prepared with materials at the start of class',
    'Zero reminders needed to transition between activities'
  ].join('\n');
  const DEF = { quarter: 1, week: 1, menu: MENU, log: [], goals: {}, streaks: {}, captains: {}, double: false, cur: null, rotateEvery: 1, captainLog: [], prizes: [] };
  let T, proj = Suite.startInProjector, picked = null, bump = null, moreOpen = false, showKeys = false;

  function load(){ T = Object.assign({}, DEF, Suite.get('tracker', {})); ['goals','streaks','captains'].forEach(k => { T[k] = T[k] || {}; }); T.log = T.log || []; T.captainLog = T.captainLog || []; T.prizes = T.prizes || []; if (T.rotateEvery == null) T.rotateEvery = 1; }
  function save(){ Suite.set('tracker', T); }
  load();
  { const m = location.hash.match(/class=([\w-]+)/); if (m) T.cur = m[1]; }

  const classes = () => Suite.classes();
  const curClass = list => list.find(c => c.id === T.cur) || list[0] || null;
  const pts = (cid, tid, w) => T.log.reduce((a, e) => a + (e.c === cid && e.t === tid && e.q === T.quarter && (w === undefined || e.w === w) ? e.d : 0), 0);
  const gkey = (tid, w) => tid + '|' + T.quarter + '|' + (w == null ? T.week : w);
  const leaders = rows => { if (!rows.length) return []; const top = Math.max(...rows.map(r => r[1])); return top > 0 ? rows.filter(r => r[1] === top).map(r => r[0]) : []; };
  const weekLeaders = (c, w) => leaders(Suite.activeTables(c).map(t => [t.id, pts(c.id, t.id, w)]));
  function improved(c, w){
    if (w < 2) return null;
    if (!T.log.some(e => e.c === c.id && e.q === T.quarter && e.w === w)) return null;
    const rows = Suite.activeTables(c).map(t => [t.id, pts(c.id, t.id, w) - pts(c.id, t.id, w - 1)]);
    if (!rows.length) return null;
    const best = Math.max(...rows.map(r => r[1]));
    if (best <= 0) return [];   // nobody gained on last week
    return rows.filter(r => r[1] === best).map(r => r[0]);
  }
  const tname = (c, id) => (c.tables.find(t => t.id === id) || { name: 'Removed table' }).name;
  const names = (c, ids) => ids && ids.length ? ids.map(i => esc(tname(c, i))).join(', ') : '<span class="muted">None yet</span>';

  const W = (k, o) => Suite.word(k, o);
  function render(){
    const useCaps = Suite.feature('captains'), useGoals = Suite.feature('goals');
    document.body.classList.toggle('nocaps', !useCaps);
    document.body.classList.toggle('nogoals', !useGoals);
    document.body.classList.toggle('proj', proj);
    const list = classes();
    const c = curClass(list);
    if (!c) {
      $('#app').innerHTML = `<div class="empty"><h2>Add your classes first</h2>
        <p>The tracker uses the classes, tables, and rosters you set up once in Classes & settings.</p>
        <a class="btn primary" href="settings.html">Go to Classes & settings</a></div>`;
      return;
    }
    T.cur = c.id;
    const act = Suite.activeTables(c);
    const lead = weekLeaders(c, T.week);
    const imp = improved(c, T.week);
    const streaks = T.streaks[c.id] || {};
    const goals = T.goals[c.id] || {};
    const caps = T.captains[c.id] || {};

    const lay = Suite.roomLayout(c.tables);
    const order = keyOrder(c);
    if (picked && !order.includes(picked)) picked = null;
    const cards = act.map(t => {
      const members = c.students.filter(s => s.tableId === t.id);
      const g = goals[gkey(t.id)] || {};
      const isLead = lead.includes(t.id);
      const tags = [
        imp && imp.includes(t.id) ? '<span class="tag">Most improved</span>' : '',
        (streaks[t.id] || 0) >= 2 ? `<span class="tag">${streaks[t.id]}-week streak</span>` : '',
        g.met ? '<span class="tag">Goal met</span>' : ''
      ].join('');
      const capName = caps[t.id] || '';
      const wk = pts(c.id, t.id, T.week);
      const num = order.indexOf(t.id) + 1;
      return `<article class="card${isLead ? ' lead' : ''}${picked === t.id ? ' picked' : ''}${bump === t.id ? ' bump' : ''}" data-card="${esc(t.id)}" style="--tc:${esc(t.color)};--tx:${Suite.textOn(t.color)};grid-row:${lay.at[t.id].row};grid-column:${lay.at[t.id].col}">
        <div class="band"><h2>${num <= 9 ? `<span class="keynum" title="Press ${num} to pick this table">${num}</span>` : ''}${esc(t.name)}</h2>${isLead ? '<span class="lead-tag">Leading</span>' : '<span class="speed" aria-hidden="true"><i></i><i></i><i></i></span>'}</div>
        <div class="card-body">
          <div class="card-top">
            <div class="facts">
              <div class="sub">This quarter: ${pts(c.id, t.id)}</div>
              <div class="cap${capName ? '' : ' nocap'}"><span>${esc(W('lead', { cap: true }))}${proj && capName ? ': ' + esc(capName) : ''}</span>
                <select data-c="cap" data-id="${esc(t.id)}" aria-label="${esc(t.name)} captain">
                  <option value="">None</option>
                  ${members.map(s => `<option${s.name === capName ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}
                  ${capName && !members.some(s => s.name === capName) ? `<option selected>${esc(capName)}</option>` : ''}
                </select>${members.length > 1 ? `<button class="btn quiet nextcap" data-a="nextcap" data-id="${esc(t.id)}" title="Pick the next captain for ${esc(t.name)}">Next</button>` : ''}</div>
            </div>
            <div class="score" aria-label="${wk} points this week">${wk}</div>
          </div>
          <div class="tags">${tags}</div>
          <div class="awards">
            <button class="plus" data-a="aw" data-id="${esc(t.id)}" data-d="1">+1</button>
            <button class="minus" data-a="aw" data-id="${esc(t.id)}" data-d="-1">−1</button>
            <button data-a="aw" data-id="${esc(t.id)}" data-d="2" data-note="Clean area">Clean +2</button>
            <button data-a="aw" data-id="${esc(t.id)}" data-d="1" data-note="Mostly clean">Mostly clean +1</button>
            <button class="wide hot" data-a="aw" data-id="${esc(t.id)}" data-d="3" data-note="Challenge">3-point challenge</button>
          </div>
        </div>
      </article>`;
    }).join('');

    // prizes
    const prev = T.week - 1;
    const prevLead = prev >= 1 ? weekLeaders(c, prev) : [];
    const prevImp = prev >= 2 ? improvedFinal(c, prev) : null;
    const streakNow = lead.filter(id => (streaks[id] || 0) + 1 >= 2);
    const streakPrev = act.filter(t => (streaks[t.id] || 0) >= 2).map(t => t.id);
    const qLead = leaders(act.map(t => [t.id, pts(c.id, t.id)]));

    const weeksAs = captainWeeks(c);
    const capPanel = act.map(t => {
      const members = c.students.filter(s => s.tableId === t.id).sort((a, b) => a.name.localeCompare(b.name));
      const now = caps[t.id] || '', nx = nextCaptain(c, t.id);
      return `<div class="caprow"><div class="caphead"><span class="swatch" style="background:${esc(t.color)}"></span><b>${esc(t.name)}</b>
          <span class="muted small">${now ? 'Now: ' + esc(now) : 'No captain yet'}${nx && nx.name !== now ? ' · Up next: ' + esc(nx.name) : ''}</span></div>
        ${members.length ? `<div class="capnames">${members.map(m => `<span class="${m.name === now ? 'is-now' : ''}">${esc(m.name)} <b>${weeksAs[m.id] || 0}</b></span>`).join('')}</div>` : '<div class="muted small">No students seated here.</div>'}</div>`;
    }).join('') || '<p class="muted">No tables in use.</p>';
    const due = ungiven(c);
    const mine = T.prizes.filter(x => x.c === c.id).slice().sort((a, b) => b.q - a.q || b.w - a.w || (a.kind === 'quarter') - (b.kind === 'quarter'));
    const record = mine.length ? `<div class="scroll"><table class="plain record">
        <thead><tr><th>When</th><th>Prize</th><th>Winner</th><th class="n">Handed out</th></tr></thead>
        <tbody>${mine.slice(0, 30).map(x => `<tr class="${x.given ? 'given' : ''}">
          <td>${x.kind === 'quarter' ? 'Quarter ' + x.q : 'Q' + x.q + ' week ' + x.w}</td><td>${PRIZE_NAMES[x.kind]}</td><td>${x.tables.map(y => esc(y.name)).join(', ')}</td>
          <td class="n"><input type="checkbox" data-c="given" data-id="${esc(x.id)}"${x.given ? ' checked' : ''} aria-label="${PRIZE_NAMES[x.kind]} handed out"></td></tr>`).join('')}</tbody>
      </table></div>`
      : '<p class="muted">Prizes are recorded here each time you end the week.</p>';
    const quarters = Array.from(new Set([T.quarter].concat(T.log.map(e => e.q)))).sort((a, b) => b - a);

    const opts = T.menu.split('\n').map(s => s.trim()).filter(Boolean);
    const weeks = Array.from({ length: T.week }, (_, i) => i + 1);
    const recent = T.log.filter(e => e.c === c.id).slice(-30).reverse();

    $('#app').innerHTML = `
      <nav class="classes" aria-label="Class periods">${list.map(k => `<button data-a="pick" data-id="${esc(k.id)}"${k.id === c.id ? ' aria-current="true"' : ''}>${esc(k.name)}</button>`).join('')}</nav>
      <div class="statusbar">
        <div class="when">Quarter ${T.quarter}, week ${T.week}</div>
        <div class="bar">
          ${T.double ? '<button class="btn double-on" data-a="double" aria-pressed="true" title="Turn double points off">Double points on</button>' : ''}
          <button class="btn" data-a="undo">Undo last</button>
          <button class="btn" data-a="proj">Projector view</button>
          <span class="more"><button class="btn" data-a="more" aria-expanded="${moreOpen}" aria-haspopup="true">More<i class="caret" aria-hidden="true"></i></button>
            <span class="moremenu"${moreOpen ? '' : ' hidden'} role="menu">
              <button role="menuitem" data-a="double">${T.double ? 'Turn off double points' : 'Turn on double points'}</button>
              <button role="menuitem" data-a="endweek">End week ${T.week}</button>
              <button role="menuitem" data-a="keys">${showKeys ? 'Hide' : 'Show'} keyboard shortcuts</button>
            </span></span>
        </div>
      </div>
      ${picked ? `<div class="picked-note">Picked: <b>${esc(tname(c, picked))}</b>. Press + or −, C, M, or P. Esc to deselect.</div>` : ''}
      ${showKeys ? `<div class="keys hint">Press a ${esc(W('team'))}'s number, then <kbd>+</kbd> or <kbd>−</kbd>, <kbd>C</kbd> clean +2, <kbd>M</kbd> mostly clean +1, <kbd>P</kbd> 3-point challenge. <kbd>U</kbd> undo, <kbd>D</kbd> double points, <kbd>Esc</kbd> deselect, <kbd>?</kbd> show or hide this.</div>` : ''}
      <div class="proj-title">${esc(c.name)}<span>Quarter ${T.quarter}, week ${T.week}${T.double ? ' · Double points!' : ''}</span></div>
      ${act.length ? `<div class="cards room-grid" style="--cols:${lay.cols}">${cards}</div>`
        : `<div class="empty"><h2>No tables are in use for ${esc(c.name)}</h2><p>Turn tables on in Classes & settings.</p><a class="btn primary" href="settings.html#class=${esc(c.id)}">Open settings</a></div>`}

      <div class="panels">
        <section class="panel" aria-labelledby="h-prizes"><h2 id="h-prizes">Prizes</h2>
          <div class="scroll"><table class="plain">
            <thead><tr><th>Award</th><th>This week so far</th><th>${prev >= 1 ? 'Week ' + prev + ' final' : 'Last week'}</th></tr></thead>
            <tbody>
              <tr><td>Top table</td><td>${names(c, lead)}</td><td>${prev >= 1 ? names(c, prevLead) : '<span class="muted">—</span>'}</td></tr>
              <tr><td>Most improved</td><td>${T.week === 1 ? '<span class="muted">Starts week 2</span>' : imp ? (imp.length ? names(c, imp) : '<span class="muted">No table ahead of last week yet</span>') : '<span class="muted">Waiting for points</span>'}</td>
                  <td>${prevImp ? names(c, prevImp) : '<span class="muted">—</span>'}</td></tr>
              <tr><td>Streak bonus</td><td>${streakNow.length ? names(c, streakNow) + ' <span class="muted">if they hold on</span>' : '<span class="muted">None yet</span>'}</td>
                  <td>${prev >= 1 ? names(c, streakPrev) : '<span class="muted">—</span>'}</td></tr>
              <tr><td>Quarter leader</td><td colspan="2">${names(c, qLead)}</td></tr>
            </tbody></table></div>
          <p class="hint" style="margin-top:8px">Ties share the prize. Short week? Don't end it, and its points roll into the next week.</p>
        </section>

        <section class="panel goalspanel" aria-labelledby="h-goals"><h2 id="h-goals">Weekly goals</h2>
          <p class="hint">Pick each table's goal on Monday. Checking "Met" adds 2 points.</p>
          ${act.map(t => { const g = goals[gkey(t.id)] || {}; return `<div class="goalrow">
            <span><span class="swatch" style="background:${esc(t.color)}"></span>${esc(t.name)}</span>
            <select data-c="goal" data-id="${esc(t.id)}" aria-label="${esc(t.name)} goal"><option value="">Choose a goal</option>
              ${opts.map(o => `<option${o === g.text ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>
            <label class="small"><input type="checkbox" data-c="met" data-id="${esc(t.id)}"${g.met ? ' checked' : ''}> Met</label></div>`; }).join('') || '<p class="muted">No tables in use.</p>'}
        </section>

        <section class="panel" aria-labelledby="h-weeks"><h2 id="h-weeks">This quarter by week</h2>
          <div class="scroll"><table class="plain">
            <thead><tr><th>Table</th>${weeks.map(w => `<th class="n">Wk ${w}</th>`).join('')}<th class="n">Total</th></tr></thead>
            <tbody>${act.map(t => `<tr><td><span class="swatch" style="background:${esc(t.color)}"></span>${esc(t.name)}</td>
              ${weeks.map(w => `<td class="n">${pts(c.id, t.id, w)}</td>`).join('')}<td class="n"><b>${pts(c.id, t.id)}</b></td></tr>`).join('')}</tbody>
          </table></div>
        </section>

        <section class="panel capspanel" aria-labelledby="h-caps"><h2 id="h-caps">${esc(W('lead', { plural: true, cap: true }))}</h2>
          <p class="hint">${T.rotateEvery ? 'Captains change automatically every ' + (T.rotateEvery === 1 ? 'week' : T.rotateEvery + ' weeks') + ' when you end the week. The next captain is whoever has had the fewest turns.' : 'Captains only change when you pick them.'} Numbers are weeks as captain this year.</p>
          ${capPanel}
        </section>

        <section class="panel" aria-labelledby="h-record"><h2 id="h-record">Prize record${due.length ? ` <span class="duebadge">${due.length} to hand out</span>` : ''}</h2>
          ${record}
        </section>

        <section class="panel" aria-labelledby="h-log"><h2 id="h-log">Recent points</h2>
          <div class="log">${recent.map(e => `<div>Q${e.q} week ${e.w}: ${esc(tname(c, e.t))} ${e.d > 0 ? '+' : ''}${e.d}${e.note ? ' <span class="muted">(' + esc(e.note) + ')</span>' : ''}</div>`).join('') || '<span class="muted">No points yet this quarter.</span>'}</div>
        </section>
      </div>

      <details class="more"><summary>Tracker settings</summary>
        <div style="margin-top:12px;max-width:640px">
          <label for="menu"><b>Weekly goal menu</b></label>
          <p class="hint">One goal per line. Used by every class.</p>
          <textarea id="menu" rows="7">${esc(T.menu)}</textarea>
          <label for="rot" style="display:block;margin-top:16px"><b>Captain rotation</b></label>
          <select id="rot" data-c="rot" style="margin-top:4px">
            <option value="1"${T.rotateEvery === 1 ? ' selected' : ''}>New captains every week</option>
            <option value="2"${T.rotateEvery === 2 ? ' selected' : ''}>New captains every 2 weeks</option>
            <option value="0"${!T.rotateEvery ? ' selected' : ''}>Only when I pick them</option>
          </select>
          <label for="repq" style="display:block;margin-top:16px"><b>Quarter report</b></label>
          <p class="hint" style="margin-top:0">A spreadsheet file (CSV) with every class's weekly points, captains, and prizes. It opens in Google Sheets or Excel.</p>
          <div class="bar"><select id="repq">${quarters.map(q => `<option value="${q}">Quarter ${q}</option>`).join('')}</select>
            <button class="btn" data-a="report">Download report</button></div>
          <div class="bar" style="margin-top:18px">
            <button class="btn" data-a="newq">Start a new quarter</button>
            <button class="btn danger" data-a="resetpts">Reset all points</button>
          </div>
          <p class="hint" style="margin-top:8px">A new quarter starts every class at week 1 with zero points and clears streaks; earlier quarters stay in your backup. "Reset all points" erases points, goals, and streaks for every class.</p>
        </div>
      </details>`;
  }

  // "Final" most improved for a completed week (doesn't need current-week points check)
  function improvedFinal(c, w){
    const rows = Suite.activeTables(c).map(t => [t.id, pts(c.id, t.id, w) - pts(c.id, t.id, w - 1)]);
    if (!rows.length) return null;
    const best = Math.max(...rows.map(r => r[1]));
    if (best <= 0) return [];   // nobody gained on last week
    return rows.filter(r => r[1] === best).map(r => r[0]);
  }


  /* ---------- captains ---------- */
  // Weeks each student has been captain (all year), from the history recorded at each "End week".
  function captainWeeks(c){
    const n = {};
    T.captainLog.forEach(x => { if (x.c === c.id && x.sid) n[x.sid] = (n[x.sid] || 0) + 1; });
    return n;
  }
  function lastCaptained(c){
    const last = {};
    T.captainLog.forEach(x => { if (x.c === c.id && x.sid) last[x.sid] = Math.max(last[x.sid] || 0, x.q * 100 + x.w); });
    return last;
  }
  // Next captain for a table: whoever has had the fewest weeks, then whoever went longest ago.
  function nextCaptain(c, tid){
    const members = c.students.filter(s => s.tableId === tid);
    if (!members.length) return null;
    const cur = (T.captains[c.id] || {})[tid];
    const weeks = captainWeeks(c), last = lastCaptained(c);
    const pool = members.length > 1 ? members.filter(s => s.name !== cur) : members;
    return pool.slice().sort((a, b) => (weeks[a.id] || 0) - (weeks[b.id] || 0) || (last[a.id] || 0) - (last[b.id] || 0) || a.name.localeCompare(b.name))[0];
  }
  function recordCaptains(c){
    const caps = T.captains[c.id] || {};
    Suite.activeTables(c).forEach(t => {
      const name = caps[t.id]; if (!name) return;
      const st = c.students.find(s => s.name === name && s.tableId === t.id) || c.students.find(s => s.name === name);
      T.captainLog.push({ c: c.id, q: T.quarter, w: T.week, t: t.id, sid: st ? st.id : '', name });
    });
  }
  function rotateCaptains(c){
    const caps = T.captains[c.id] = T.captains[c.id] || {};
    Suite.activeTables(c).forEach(t => { const n = nextCaptain(c, t.id); if (n) caps[t.id] = n.name; });
  }

  /* ---------- prize record ---------- */
  const PRIZE_NAMES = { top: 'Top table', improved: 'Most improved', streak: 'Streak bonus', quarter: 'Quarter champion' };
  function recordPrizes(c, kind, ids, w){
    if (!ids || !ids.length) return;
    T.prizes.push({ id: Suite.uid(), c: c.id, q: T.quarter, w: w || T.week, kind, tables: ids.map(id => ({ id, name: tname(c, id) })), given: false });
  }
  const ungiven = c => T.prizes.filter(x => x.c === c.id && !x.given);

  /* ---------- quarter report (CSV for Sheets or Excel) ---------- */
  function downloadReport(q){
    const cell = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const rows = [['Class', 'Week', 'Table', 'Points', 'Captain', 'Prizes']];
    const lastWeek = q === T.quarter ? T.week : Math.max(1, ...T.log.filter(e => e.q === q).map(e => e.w));
    classes().forEach(c => {
      const tables = c.tables.filter(t => t.open || T.log.some(e => e.c === c.id && e.t === t.id && e.q === q));
      for (let w = 1; w <= lastWeek; w++) tables.forEach(t => {
        const p = T.log.reduce((a, e) => a + (e.c === c.id && e.t === t.id && e.q === q && e.w === w ? e.d : 0), 0);
        const cap = (T.captainLog.find(x => x.c === c.id && x.q === q && x.w === w && x.t === t.id) || {}).name || '';
        const won = T.prizes.filter(x => x.c === c.id && x.q === q && x.w === w && x.kind !== 'quarter' && x.tables.some(y => y.id === t.id)).map(x => PRIZE_NAMES[x.kind]).join('; ');
        rows.push([c.name, w, t.name, p, cap, won]);
      });
      tables.forEach(t => {
        const total = T.log.reduce((a, e) => a + (e.c === c.id && e.t === t.id && e.q === q ? e.d : 0), 0);
        const champ = T.prizes.some(x => x.c === c.id && x.q === q && x.kind === 'quarter' && x.tables.some(y => y.id === t.id));
        rows.push([c.name, 'Quarter total', t.name, total, '', champ ? PRIZE_NAMES.quarter : '']);
      });
    });
    const csv = rows.map(r => r.map(cell).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
    a.download = 'table-points-quarter-' + q + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // Tables numbered the way they sit in the room: across the top row, then the next row.
  function keyOrder(c){
    const lay = Suite.roomLayout(c.tables);
    return Suite.activeTables(c).slice().sort((a, b) => lay.at[a.id].row - lay.at[b.id].row || lay.at[a.id].col - lay.at[b.id].col).map(t => t.id);
  }
  function award(c, tid, d, note){
    note = note || '';
    if (T.double && d > 0) { d *= 2; note = note ? note + ', double' : 'Double'; }
    T.log.push({ id: Suite.uid(), c: c.id, t: tid, d, w: T.week, q: T.quarter, note });
    save(); bump = tid; render(); setTimeout(() => { if (bump === tid) { bump = null; const el = document.querySelector('[data-card="' + tid + '"]'); if (el) el.classList.remove('bump'); } }, 650);
  }
  function undoLast(c){
    for (let i = T.log.length - 1; i >= 0; i--) {
      const x = T.log[i];
      if (x.c === c.id && x.q === T.quarter) {
        T.log.splice(i, 1);
        if (x.g && T.goals[c.id] && T.goals[c.id][x.g]) T.goals[c.id][x.g].met = false;
        save(); render(); Suite.toast('Removed ' + (x.d > 0 ? '+' : '') + x.d + ' from ' + tname(c, x.t));
        return;
      }
    }
    Suite.toast('Nothing to undo');
  }
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('.suite-dialog') || document.body.classList.contains('timer-open')) return;
    if (/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) return;
    const c = curClass(classes()); if (!c) return;
    const k = e.key;
    if (/^[1-9]$/.test(k)) {
      const order = keyOrder(c), id = order[+k - 1];
      if (!id) return;
      picked = picked === id ? null : id; render(); e.preventDefault(); return;
    }
    if (k === 'Escape' && picked) { picked = null; render(); e.stopImmediatePropagation(); return; }
    const acts = { '+': [1, ''], '=': [1, ''], '-': [-1, ''], '_': [-1, ''], 'c': [2, 'Clean area'], 'm': [1, 'Mostly clean'], 'p': [3, 'Challenge'] };
    const lk = k.length === 1 ? k.toLowerCase() : k;
    if (acts[lk]) {
      e.preventDefault();
      if (!picked) { Suite.toast('Press a table number first (1 to ' + keyOrder(c).length + ')'); return; }
      award(c, picked, acts[lk][0], acts[lk][1]); return;
    }
    if (k === '?') { e.preventDefault(); showKeys = !showKeys; render(); return; }
    if (lk === 'u') { e.preventDefault(); undoLast(c); }
    else if (lk === 'd') { e.preventDefault(); T.double = !T.double; save(); render(); Suite.toast(T.double ? 'Double points on' : 'Double points off'); }
  }, true);

  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-a]');
    if (moreOpen && (!el || el.dataset.a !== 'more')) { moreOpen = false; if (!el) { render(); return; } }
    if (!el) return;
    if (el.dataset.a === 'more') { moreOpen = !moreOpen; render(); return; }
    if (el.dataset.a === 'keys') { showKeys = !showKeys; render(); return; }
    const a = el.dataset.a, id = el.dataset.id;
    const c = curClass(classes());
    if (a === 'pick') { T.cur = id; save(); render(); }
    else if (a === 'proj') { proj = !proj; render(); }
    else if (!c) return;
    else if (a === 'aw') { award(c, id, +el.dataset.d, el.dataset.note || ''); }
    else if (a === 'double') { T.double = !T.double; save(); render(); }
    else if (a === 'undo') { undoLast(c); }
    else if (a === 'nextcap') {
      const n = nextCaptain(c, id); if (!n) return;
      (T.captains[c.id] = T.captains[c.id] || {})[id] = n.name; save(); render(); Suite.toast(n.name + ' is captain of ' + tname(c, id));
    }
    else if (a === 'report') { downloadReport(+document.getElementById('repq').value); }
    else if (a === 'endweek') {
      if (!await Suite.dialog({ title: 'End week ' + T.week + '?', body: 'This locks in this week\'s winners for every class and starts week ' + (T.week + 1) + '. For a short week, skip this so its points roll into next week.', ok: 'End week' })) return;
      const rotate = T.rotateEvery > 0 && T.week % T.rotateEvery === 0;
      classes().forEach(k => {
        const w = weekLeaders(k, T.week), s = T.streaks[k.id] = T.streaks[k.id] || {};
        k.tables.forEach(t => { s[t.id] = w.includes(t.id) ? (s[t.id] || 0) + 1 : 0; });
        recordPrizes(k, 'top', w);
        if (T.week >= 2 && T.log.some(e => e.c === k.id && e.q === T.quarter && e.w === T.week)) recordPrizes(k, 'improved', improvedFinal(k, T.week));
        recordPrizes(k, 'streak', Suite.activeTables(k).filter(t => w.includes(t.id) && s[t.id] >= 2).map(t => t.id));
        recordCaptains(k);
        if (rotate) rotateCaptains(k);
      });
      T.week++; T.double = false; save(); render();
      Suite.toast('Week ' + T.week + ' started' + (rotate ? '. New captains are up.' : ''));
    }
    else if (a === 'newq') {
      if (!await Suite.dialog({ title: 'Start quarter ' + (T.quarter + 1) + '?', body: 'Every class goes back to week 1 with zero points, and streaks reset. Download a backup first if you want a record of this quarter.', ok: 'Start new quarter', danger: true })) return;
      classes().forEach(k => recordPrizes(k, 'quarter', leaders(Suite.activeTables(k).map(t => [t.id, pts(k.id, t.id)])), T.week));
      T.quarter++; T.week = 1; T.streaks = {}; T.double = false; save(); render();
    }
    else if (a === 'resetpts') {
      if (!await Suite.dialog({ title: 'Reset all points?', body: 'Points, weekly goals, streaks, prize records, and captain history are erased for every class. Classes, tables, current captains, and the goal menu stay.', ok: 'Reset points', danger: true })) return;
      T.log = []; T.goals = {}; T.streaks = {}; T.prizes = []; T.captainLog = []; T.week = 1; T.quarter = 1; T.double = false; save(); render();
    }
  });

  document.addEventListener('change', e => {
    const el = e.target, k = el.dataset.c, id = el.dataset.id;
    const c = curClass(classes());
    if (el.id === 'menu') { T.menu = el.value; save(); render(); return; }
    if (!c || !k) return;
    if (k === 'rot') { T.rotateEvery = +el.value; save(); render(); return; }
    if (k === 'given') { const x = T.prizes.find(p => p.id === id); if (x) { x.given = el.checked; save(); render(); } return; }
    if (k === 'cap') { (T.captains[c.id] = T.captains[c.id] || {})[id] = el.value; }
    else if (k === 'goal') { const g = T.goals[c.id] = T.goals[c.id] || {}; const key = gkey(id); g[key] = Object.assign({}, g[key], { text: el.value }); }
    else if (k === 'met') {
      const g = T.goals[c.id] = T.goals[c.id] || {}; const key = gkey(id); const was = !!(g[key] && g[key].met);
      if (el.checked && !was) T.log.push({ id: Suite.uid(), c: c.id, t: id, d: 2, w: T.week, q: T.quarter, note: 'Weekly goal', g: key });
      if (!el.checked && was) { const i = T.log.map(x => x.g).lastIndexOf(key); if (i > -1) T.log.splice(i, 1); }
      g[key] = Object.assign({}, g[key], { met: el.checked });
    }
    save(); render();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && proj && !document.querySelector('.suite-dialog')) { proj = false; render(); } });
  window.addEventListener('suite:change', e => { if (e.detail && (e.detail.external || e.detail.key === '*')) { load(); render(); } });

  Suite.mountNav('tracker');
  render();
})();
</script>
</body>
</html>
