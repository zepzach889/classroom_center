<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise meter · Classroom Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=2026-10-02a">
<script src="shared/core.js?v=2026-10-02a"></script>
<script>window.PAGE_VERSION = '2026-10-02a';</script>
<style>
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 16px}
.tooltitle{font-family:var(--serif);font-size:32px}
.card{background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:14px 18px}
.empty{background:var(--sheet);border:2px solid var(--edge);border-radius:20px;padding:28px;max-width:680px}
.empty h2{margin-bottom:8px}
#exit-proj{display:none}
body.proj #suite-nav,body.proj .ctl{display:none!important}
body.proj #exit-proj{display:block;position:fixed;top:12px;right:12px;opacity:.55;z-index:40}
body.proj #exit-proj:hover,body.proj #exit-proj:focus{opacity:1}
body.proj .wrap{max-width:none;padding:24px 36px}
/* ---------- noise meter ---------- */
.nbox{--z:#5E806B;background:var(--sheet);border:2px solid var(--edge);border-radius:24px;padding:28px 30px;text-align:center}
.nbox[data-zone="warn"]{--z:#C99A3E}
.nbox[data-zone="loud"]{--z:#B84A32}
.nlabel{font-family:var(--serif);font-size:clamp(44px,7vw,96px);color:var(--z);line-height:1.05;margin-bottom:22px}
.nmeter{position:relative;height:64px;border:3px solid var(--edge);border-radius:999px;background:var(--wash);overflow:hidden}
.nmeter span{position:absolute;left:0;top:0;bottom:0;background:var(--z);width:0;transition:width .08s linear}
.nline{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--ink)}
.nquiet{margin-top:18px;font-size:22px}
.nquiet b{font-family:var(--serif);font-weight:400;font-size:34px;margin-left:6px;font-variant-numeric:tabular-nums}
.ncal{margin-top:14px;font-size:16px;border-color:var(--land)}
.ncontrols{margin-top:16px;display:flex;flex-wrap:wrap;gap:16px 30px;align-items:center}
.ncontrols label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.ncontrols input[type=range]{width:260px;accent-color:var(--sea)}
body.proj .nmeter{height:90px}

</style>
</head>
<body>
<header id="suite-nav"></header>
<button class="btn" id="exit-proj" data-a="proj">Exit projector view</button>
<div class="wrap" id="app"></div>
<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  // Settings (and the calibration) used to live with the Activities page; carry them over once.
  let N = Suite.get('noise', null);
  if (!N) { const old = (Suite.get('activities', {}) || {}).noise; N = Object.assign({ line: 60, sens: 5, base: null }, old || {}); Suite.set('noise', N); }
  N = Object.assign({ line: 60, sens: 5, base: null }, N);
  const saveN = () => Suite.set('noise', N);
  let proj = false;
  /* ================= noise meter ================= */
  let mic = null, micErr = '';
  async function micStart(){
    micErr = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micErr = 'unsupported'; render(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const an = ctx.createAnalyser(); an.fftSize = 2048;
      // Two high-pass stages cut the low rumble of fans; voices sit well above 300 Hz.
      const hp1 = ctx.createBiquadFilter(), hp2 = ctx.createBiquadFilter();
      [hp1, hp2].forEach(f => { f.type = 'highpass'; f.frequency.value = 300; f.Q.value = 0.7; });
      ctx.createMediaStreamSource(stream).connect(hp1); hp1.connect(hp2); hp2.connect(an);
      mic = { stream, ctx, an, buf: new Float32Array(an.fftSize), level: 0, quiet: 0, last: performance.now(), cal: null };
      render(); micLoop();
    } catch (e) { micErr = e && e.name === 'NotAllowedError' ? 'blocked' : 'unavailable'; render(); }
  }
  function startCalibration(){
    if (!mic) return;
    mic.cal = { samples: [], until: performance.now() + 5000 }; render();
  }
  function finishCalibration(){
    const v = mic.cal.samples.slice().sort((a, b) => a - b);
    mic.cal = null;
    if (v.length < 10) { Suite.toast("Couldn't hear the room. Try again."); render(); return; }
    N.base = v[Math.floor(v.length * 0.9)];   // the loud end of "quiet", so the fan's ups and downs count as zero
    mic.level = 0; mic.quiet = 0; saveN(); render(); Suite.toast('Calibrated to your room');
  }
  function micStop(){
    if (!mic) return;
    mic.stream.getTracks().forEach(t => t.stop()); try { mic.ctx.close(); } catch (e) {}
    mic = null;
  }
  const zone = lvl => lvl < N.line * 0.7 ? 'ok' : lvl < N.line ? 'warn' : 'loud';
  const ZONE_TEXT = { ok: 'Nice and quiet', warn: 'Getting loud', loud: 'Too loud' };
  function micLoop(){
    if (!mic) return;
    mic.an.getFloatTimeDomainData(mic.buf);
    let sum = 0; for (let i = 0; i < mic.buf.length; i++) sum += mic.buf[i] * mic.buf[i];
    const db = 20 * Math.log10(Math.sqrt(sum / mic.buf.length) + 1e-9);                 // about -100 (silent) to 0 (very loud)
    if (mic.cal) { mic.cal.samples.push(db); if (performance.now() >= mic.cal.until) finishCalibration(); }
    // Calibrated: zero is the quiet room (fan included). Sensitivity sets how much louder counts as "full".
    // Not calibrated: sensitivity moves the floor; 1 is far less sensitive than before.
    const calibrated = N.base != null;
    const floor = calibrated ? N.base + 3 : -66 - (N.sens - 1) * 4;
    const range = calibrated ? 20 + (10 - N.sens) * 6 : 60;
    const lvl = Math.max(0, Math.min(100, (db - floor) / range * 100));
    mic.level = mic.level * 0.88 + lvl * 0.12;
    const now = performance.now(), dt = now - mic.last; mic.last = now;
    if (mic.level < N.line) mic.quiet += dt;
    const z = zone(mic.level), bar = document.getElementById('nbar'), lab = document.getElementById('nlabel'), q = document.getElementById('nquiet'), box = document.getElementById('nbox');
    if (bar) bar.style.width = mic.level.toFixed(1) + '%';
    if (box) box.dataset.zone = z;
    if (lab) lab.textContent = ZONE_TEXT[z];
    if (q) q.textContent = Suite.fmtDuration(mic.quiet);
    requestAnimationFrame(micLoop);
  }
  function noiseView(){
    const head = `<div class="toolbar ctl"><div class="tooltitle">Noise meter</div><div class="bar">${mic ? `<button class="btn${N.base == null ? ' primary' : ''}" data-a="ncal"${mic.cal ? ' disabled' : ''}>${N.base == null ? 'Calibrate' : 'Recalibrate'}</button><button class="btn" data-a="nstop">Stop listening</button>` : ''}<button class="btn" data-a="proj">Projector view</button></div></div>`;
    if (mic && mic.cal) return head + `<div class="nbox"><div class="nlabel" style="color:var(--ink)">Listening to the room…</div>
        <p style="margin:0 auto;font-size:20px">Keep the room quiet for 5 seconds, with the fan running the way it usually does.</p></div>`;
    if (!mic) return head + `<div class="empty">
        <h2>${micErr === 'blocked' ? 'The microphone is blocked' : micErr ? "This computer can't use a microphone here" : 'Listen to the room'}</h2>
        <p>${micErr === 'blocked' ? 'The browser (or your school) has blocked microphone access for this site. You can allow it from the lock or camera icon in the address bar, if your school permits it.'
          : micErr ? 'No microphone was found, or this browser does not allow one on this page.'
          : 'The meter shows how loud the room is, compared with a line you set. Nothing is recorded or saved; the sound never leaves this computer.'}</p>
        <button class="btn primary" data-a="nstart">${micErr ? 'Try again' : 'Start listening'}</button></div>`;
    return head + `<div class="nbox" id="nbox" data-zone="ok">
        <div class="nlabel" id="nlabel">Nice and quiet</div>
        <div class="nmeter" aria-hidden="true"><span id="nbar"></span><i class="nline" style="left:${N.line}%"></i></div>
        <div class="nquiet">Time under the line: <b id="nquiet">0:00</b> <button class="btn quiet small ctl" data-a="nreset">Reset</button></div>
      </div>
      ${N.base == null ? `<div class="card ctl ncal"><b>Calibrate for your room.</b> With the fan on and the class quiet, press <b>Calibrate</b>. The meter then measures only the noise above that, so the fan reads as zero. You only need to do it again if the room changes.</div>`
        : `<p class="hint ctl" style="margin-top:10px">Calibrated to your room. If the fan or the room changes, press Recalibrate. <a href="#" data-a="nclear">Clear calibration</a></p>`}
      <div class="card ctl ncontrols">
        <label>Where's the line? <input type="range" min="15" max="95" value="${N.line}" data-c="nline" aria-label="Loudness line"></label>
        <label>Microphone sensitivity <input type="range" min="1" max="10" value="${N.sens}" data-c="nsens" aria-label="Microphone sensitivity"></label>
        <p class="hint" style="margin:0">Set the line at your normal work-time volume. Lower the sensitivity if the meter jumps too easily, raise it if it barely moves.</p>
      </div>`;
  }


  function render(){
    document.body.classList.toggle('proj', proj);
    $('#app').innerHTML = noiseView();
  }
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a;
    if (a === 'proj') { proj = !proj; render(); }
    else if (a === 'nstart') micStart();
    else if (a === 'nstop') { micStop(); render(); }
    else if (a === 'nreset' && mic) { mic.quiet = 0; }
    else if (a === 'ncal') startCalibration();
    else if (a === 'nclear') { e.preventDefault(); N.base = null; saveN(); render(); }
  });
  document.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.c;
    if (k === 'nline') { N.line = +e.target.value; saveN(); }
    else if (k === 'nsens') { N.sens = +e.target.value; saveN(); }
  });
  document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.c === 'nline') { N.line = +e.target.value; const l = document.querySelector('.nline'); if (l) l.style.left = e.target.value + '%'; } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && proj && !document.querySelector('.suite-dialog') && !document.body.classList.contains('timer-open')) { proj = false; render(); } });
  window.addEventListener('pagehide', micStop);
  Suite.mountNav('noise');
  render();
})();
</script>
</body>
</html>
