<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner · Classroom Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=2026-10-16i">
<script src="shared/core.js?v=2026-10-16i"></script>
<script>window.PAGE_VERSION = '2026-10-16i';</script>
<style>
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar h1{font-size:34px}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav .wk{font-family:var(--serif);font-size:22px;min-width:220px;text-align:center}
.banner{background:var(--wash);border:2px dashed var(--rule);border-radius:16px;padding:12px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.gridwrap{overflow-x:auto}
table.plan{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed;min-width:900px}
table.plan th{font-weight:600;text-align:left;vertical-align:bottom;padding:4px 6px}
table.plan th.day{font-size:15px}
table.plan th.day span{display:block;font-size:12px;font-weight:500;color:var(--ink-2)}
table.plan th.day.today{color:var(--land)}
.ubar{display:block;align-self:stretch;height:16px;margin:-2px -4px 4px;padding:0 6px;border-radius:6px;background:color-mix(in srgb,var(--uc) 22%,transparent);border-left:4px solid var(--uc);font:700 11px/16px var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.udot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle}
.cswatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}.cswatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--sheet) inset}
.tday{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;background:#2f6fd0;color:#fff;border-radius:999px;padding:1px 8px}
details.students{margin-top:14px;border:1.5px solid var(--rule);border-radius:12px;padding:8px 12px;background:var(--paper)}
details.students summary{cursor:pointer;font-weight:700}
details.students textarea{width:100%}
.subday{display:block;margin-top:3px;font:700 11px var(--sans);letter-spacing:.04em;background:var(--plum);color:#fff;border-radius:999px;padding:1px 8px;width:max-content}
.sitem{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:6px;align-items:center;margin-top:6px}
.sitem textarea{grid-column:1 / span 2}.sitem .fname{font-weight:600}
.stc{border:1.5px dashed var(--rule);border-radius:10px;padding:8px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.dayoff{display:block;margin-top:3px;font:600 11px var(--sans);color:var(--ink-2);background:none;border:1px dashed var(--rule);border-radius:999px;padding:1px 8px;cursor:pointer}
.dayoff:hover{border-color:var(--edge);color:var(--ink)}
table.plan th.rowh{width:170px;vertical-align:top;background:var(--sheet);border:2px solid var(--edge);border-radius:14px;padding:10px 12px}
.rowh .nm{font-family:var(--serif);font-size:19px;font-weight:400;display:block}
.rowh .secs{font-size:12px;color:var(--ink-2);display:block;margin:2px 0 6px}
.rowh .btn{min-height:0;padding:3px 10px;font-size:13px}
td.cell{vertical-align:top;padding:0}
.cellbtn{font:inherit;text-align:left;width:100%;min-height:118px;background:var(--sheet);color:var(--ink);border:2px solid var(--rule);border-radius:14px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.cellbtn:hover{border-color:var(--edge)}
.cellbtn.empty{border-style:dashed;color:var(--ink-2);align-items:center;justify-content:center;font-size:14px}
.cellbtn.off{background:repeating-linear-gradient(135deg,var(--wash) 0 10px,var(--paper) 10px 20px);border-style:dashed;cursor:default;color:var(--ink-2);align-items:center;justify-content:center;font-size:13px}
.cellbtn .tg{font-weight:700;font-size:14px;line-height:1.25}
.cellbtn ol{margin:0;padding-left:18px;font-size:13px;line-height:1.3}
.cellbtn .hw{font-size:12px;color:var(--ink-2)}
.cellbtn.ev{min-height:52px;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:4px}
.cellbtn.ev.empty{min-height:52px}
.evrow th.rowh{padding:8px 12px}
.evchip.mine{background:var(--wash);color:var(--ink);border:1.5px dashed var(--edge)}
.evchip{background:var(--sea);color:var(--on-sea);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.evlist{list-style:none;margin:0;padding:0}.evlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--rule)}.evlist li:first-child{border-top:0}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.evgrid label{display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:700}
.mrow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;align-items:center;margin-top:6px}
.mrow .fname{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.own{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--land);color:var(--on-land);border-radius:999px;padding:1px 8px}
.cellbtn .own{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--land);color:var(--on-land);border-radius:999px;padding:1px 8px}
td.today .cellbtn{box-shadow:inset 0 3px 0 var(--land)}
/* editor */
.ed{max-width:620px}
.ed .lb{display:block;font-size:14px;font-weight:700;margin:12px 0 3px}
.ed .field,.ed textarea,.ed select{width:100%}
.ed .scope{background:var(--wash);border-radius:12px;padding:8px 12px;font-size:14px;margin-top:4px}
.ed .scope .bar{margin-top:6px}
.courses li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--rule)}
.courses li:first-child{border-top:0}
.courses .nm{flex:1;font-weight:600}
.courses ul{list-style:none;margin:0 0 10px;padding:0}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.checks label{display:flex;gap:5px;align-items:center;font-size:15px}
.printonly{display:none}
@media print{
  @page{size:landscape;margin:.4in}
  body{background:#fff}
  #suite-nav,.noprint,.backup-banner{display:none!important}
  .wrap{max-width:none;padding:0}
  .printonly{display:block;font-family:var(--serif);font-size:24px;margin-bottom:6px}
  .gridwrap{overflow:visible}
  table.plan{min-width:0;border-spacing:3px}
  table.plan th.rowh{width:120px;border:1.5px solid #111;border-radius:6px;padding:5px 7px}
  .rowh .btn{display:none}
  .cellbtn{min-height:0;border:1px solid #999;border-radius:6px;padding:5px 6px;background:#fff;color:#111}
  .cellbtn.empty{visibility:hidden}
  .cellbtn .own,.cellbtn .tday{background:#fff;color:#111;border:1px solid #111}
  .evchip{background:#fff;color:#111;border:1px solid #111}
  .cellbtn ol,.cellbtn .tg{font-size:11px}
}
</style>
</head>
<body>
<header id="suite-nav"></header>
<div class="wrap" id="app"></div>
<script>
(function(){
  const $ = q => document.querySelector(q);
  const esc = Suite.esc;
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  const keyOf = d => Suite.dateKey(d);
  const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const monday = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); const wd = x.getDay(); x.setDate(x.getDate() - (wd === 0 ? 6 : wd - 1)); return x; };
  let week = monday(new Date());
  { const m = location.hash.match(/date=(\d{4}-\d{2}-\d{2})/); if (m) week = monday(parse(m[1])); }

  // Rows: each course, then any class that isn't in a course.
  function rows(){
    const cl = Suite.classes(), co = Suite.courses();
    const inCourse = new Set(co.flatMap(c => c.classIds || []));
    return co.map(c => ({ kind: 'course', id: c.id, key: Suite.courseKey(c.id), name: c.name, classes: cl.filter(k => (c.classIds || []).includes(k.id)) }))
      .concat(cl.filter(k => !inCourse.has(k.id)).map(k => ({ kind: 'class', id: k.id, key: k.id, name: k.name, classes: [k] })));
  }
  const days = () => DAYS.map((n, i) => { const d = new Date(week); d.setDate(week.getDate() + i); return d; });
  function mergeable(){
    const A = Suite.agendaAll(), same = (x, y) => JSON.stringify(x) === JSON.stringify(y);
    return Suite.courses().some(co => Object.values(A).some(day => { const ck = Suite.courseKey(co.id), ids = (co.classIds || []).filter(id => day[id]); return ids.length && (!day[ck] || ids.some(id => same(day[id], day[ck]))); }));
  }
  const matText = e => { const m = e && e.materials || []; if (!m.length) return ''; const l = m.filter(x => x.kind === 'link').length, f = m.length - l; return [l ? l + ' link' + (l > 1 ? 's' : '') : '', f ? f + ' file' + (f > 1 ? 's' : '') : ''].filter(Boolean).join(', '); };
  const summary = e => e ? `${e.target ? `<span class="tg">${esc(e.target)}</span>` : ''}${e.items && e.items.length ? `<ol>${e.items.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}${e.homework ? `<span class="hw">Homework: ${esc(e.homework)}</span>` : ''}${matText(e) ? `<span class="hw">${matText(e)}</span>` : ''}` : '';

  function render(){
    const R = rows(), D = days(), A = Suite.agendaAll(), today = keyOf(new Date());
    const fri = D[4], label = D[0].toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' to ' + fri.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    const offs = Suite.getSchedule().special, outs = (Suite.get('sub', {}) || {}).out || {};
    const head = D.map(d => { const sc = Suite.scheduleFor(d), k = keyOf(d), off = offs.find(x => x.date === k && x.scheduleId === 'none');
      return `<th class="day${k === today ? ' today' : ''}">${d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}<span>${esc(sc.periods.length ? sc.scheduleName || sc.label : sc.label)}</span>
        ${outs[k] ? '<span class="subday">Sub day</span>' : ''}
        <button class="dayoff noprint" data-a="${off ? 'dayon' : 'dayoff'}" data-date="${k}">${off ? 'Undo day off' : 'Mark day off'}</button>${off ? '' : `<button class="dayoff noprint" data-a="subout" data-date="${k}">${outs[k] ? 'Not out after all' : "I'm out"}</button>`}</th>`; }).join('');
    const evRow = `<tr class="evrow"><th class="rowh" scope="row"><span class="nm">Events</span><span class="secs">School events, plus your own (⏳ counts down on the dashboard)</span></th>${D.map(d => {
        const k = keyOf(d), ev = Suite.eventsOn(k);
        return `<td class="cell${k === today ? ' today' : ''}"><button class="cellbtn ev${ev.length ? '' : ' empty'}" data-a="events" data-date="${k}" aria-label="School events on ${d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}">${ev.length ? ev.map(x => `<span class="evchip${x.mine ? ' mine' : ''}" title="${x.mine ? 'Just for you' : ''}">${x.countdown ? '⏳ ' : ''}${esc(x.title)}</span>`).join('') : '+ Event'}</button></td>`; }).join('')}</tr>`;
    const body = evRow + R.map(r => `<tr><th class="rowh" scope="row"><span class="nm">${esc(r.name)}</span>
        ${r.kind === 'course' ? `<span class="secs">${r.classes.map(c => esc(c.name)).join(', ') || 'No sections yet'}</span>` : ''}
        <button class="btn quiet noprint" data-a="shift" data-row="${esc(r.key)}">Shift plans…</button></th>
      ${D.map(d => {
        const k = keyOf(d), sc = Suite.scheduleFor(d), day = A[k] || {};
        if (!sc.periods.length) return `<td class="cell"><div class="cellbtn off">${esc(sc.label)}</div></td>`;
        const e = day[r.key], own = r.kind === 'course' ? r.classes.filter(c => day[c.id]) : [];
        return `<td class="cell${k === today ? ' today' : ''}"><button class="cellbtn${e || own.length ? '' : ' empty'}" data-a="edit" data-row="${esc(r.key)}" data-date="${k}" aria-label="Plan for ${esc(r.name)} on ${d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}">
          ${(() => { const un = Suite.unitFor(r.key, k); if (!un) return ''; const prev = new Date(d); prev.setDate(prev.getDate() - 1); const first = k === un.start || d.getDay() === 1 || !Suite.unitFor(r.key, keyOf(prev)) || Suite.unitFor(r.key, keyOf(prev)).id !== un.id;
            return `<span class="ubar" style="--uc:${esc(un.color || '#6a8caf')}" title="${esc(un.name)}">${first ? esc(un.name) : ''}</span>`; })()}
          ${e ? summary(e) : own.length || boardHasText(todayRec(k, r.key)) ? '' : '+ Plan'}${boardHasText(todayRec(k, r.key)) ? '<span class="tday" title="Student boards are ready for the Today screen">Today ready</span>' : ''}${own.length ? `<span class="own" title="These periods have their own plan this day instead of the course plan">Own plan: ${esc(own.map(c => c.name.replace(/^Period\s*/i, 'P')).join(', '))}</span>` : ''}</button></td>`;
      }).join('')}</tr>`).join('');
    $('#app').innerHTML = `
      <div class="toolbar noprint"><h1>Planner</h1>
        <div class="weeknav"><button class="btn" data-a="prev" aria-label="Previous week">‹ Previous</button><span class="wk">${esc(label)}</span><button class="btn" data-a="next" aria-label="Next week">Next ›</button><button class="btn quiet" data-a="now">This week</button></div>
        <div class="bar"><button class="btn" data-a="copyweek" title="Copy this week's plans to another week">Copy week…</button><button class="btn" data-a="units">Units</button><button class="btn" data-a="subprint" title="Print sub plans for the days you're out this week">Print sub plans</button><button class="btn" data-a="daysoff">Days off</button><button class="btn" data-a="courses">Courses</button><button class="btn primary" data-a="print">Print this week</button></div></div>
      <div class="printonly">Plans for ${esc(label)}</div>
      ${mergeable() ? `<div class="banner noprint"><span><b>Some days still have a separate plan for each period</b>, saved before you set up courses. Combine the ones that match into the course plan? Periods with a different plan keep their own.</span><button class="btn primary" data-a="merge">Combine them</button></div>` : ''}
      ${!Suite.courses().length && Suite.classes().length > 1 ? `<div class="banner noprint"><span><b>Teach the same lesson to several periods?</b> Group them into a course, and you'll plan once for all of them.</span><button class="btn primary" data-a="courses">Set up courses</button></div>` : ''}
      ${R.length ? `<div class="gridwrap"><table class="plan"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table></div>`
        : '<div class="banner"><span>Add your classes in Classes and rosters first.</span><a class="btn primary" href="settings.html#classes">Classes and rosters</a></div>'}
      <p class="hint noprint" style="margin-top:12px">Click any day to plan it. Plans show on the dashboard for the class in session and print on the substitute page. An <span class="own" style="display:inline-block">Own plan</span> tag means those periods have their own plan that day instead of the course plan; open the day to see it or switch them back.</p>`;
  }

  /* ---------- the Today screen's student boards, prepared from here ---------- */
  const TODAY_BOARDS = [['welcome', 'Welcome', 'WELCOME!'], ['warmup', 'Warm-up', 'WARM-UP'], ['returned', 'Returned work', 'Returned Work']];
  const BOARD_HEADS = { agenda: "TODAY'S AGENDA", due: 'THINGS THAT ARE DUE' };
  const todayStore = () => Object.assign({ rows: {}, days: {} }, Suite.get('today', {}) || {});
  const todayRec = (date, key) => ((todayStore().days || {})[date] || {})[key] || null;
  const linesToText = lines => (lines || []).map(l => '-'.repeat(Math.min(2, l.level || 0)) + (l.level ? ' ' : '') + (l.reveal ? '? ' : '') + (l.text || '').trim()).join('\n');
  function textToLines(txt, old){
    return txt.split('\n').map(x => x.replace(/\s+$/, '')).filter(x => x.trim()).map((x, i) => {
      const m = x.match(/^\s*(-{0,2})\s*(\?\s+)?(.*)$/), text = m[3].trim(), prev = (old || [])[i];
      const line = { text, level: m[1].length, color: prev && prev.color || 'blue', reveal: !!m[2] };
      if (prev && (prev.text || '').trim() === text && prev.html) line.html = prev.html;   // keep formatting added on the Today screen
      return line;
    });
  }
  function boardHasText(rec){ return !!rec && Object.values(rec.boards || {}).some(b => (b.lines || []).some(l => (l.text || '').trim())); }
  function saveStudents(date, key, values, extra){
    const T = todayStore(); T.days = T.days || {}; const day = T.days[date] = T.days[date] || {};
    const rec = day[key] = day[key] || {}; rec.boards = rec.boards || {};
    let changed = false;
    values.forEach(([id, heading, txt, custom]) => {
      const cur = rec.boards[id], before = linesToText(cur && cur.lines);
      if (custom && !cur) { rec.boards[id] = { heading, lines: textToLines(txt, []) }; changed = true; return; }   // a new custom board counts, even before it has lines
      if (custom && cur && cur.heading !== heading) { cur.heading = heading; changed = true; }
      if (txt.trim() === before.trim() && !(custom && !cur && txt.trim())) return;
      if (!cur && !txt.trim()) return;
      rec.boards[id] = Object.assign({ heading }, cur || {}, { lines: textToLines(txt, cur && cur.lines) }); changed = true;
    });
    if (extra) {
      const have = extra.haveOut.split(',').map(x => x.trim()).filter(Boolean), had = rec.haveOut || [];
      if (have.join('|') !== had.join('|')) { if (have.length) rec.haveOut = have; else delete rec.haveOut; changed = true; }
      Object.entries(extra.sources || {}).forEach(([id, v]) => { const cur = rec.boards[id]; if ((cur && cur.source || 'plan') !== v) { rec.boards[id] = Object.assign({ heading: id === 'due' ? 'THINGS THAT ARE DUE' : "TODAY'S AGENDA", lines: [] }, cur || {}, { source: v }); changed = true; } });
      if ((extra.slideLink || '') !== (rec.slideLink || '')) { if (extra.slideLink) rec.slideLink = extra.slideLink; else delete rec.slideLink; changed = true; }
    }
    if (!changed) { if (!Object.keys(rec.boards).length && Object.keys(rec).length === 1) { delete day[key]; Suite.set('today', T); } return; }
    // make sure boards with something on them are in the day's lineup
    const base = rec.lineup || ((T.rows || {})[key] || {}).lineup || ['welcome', 'agenda'];
    const lineup = base.slice();
    values.forEach(([id, , , custom]) => { if (rec.boards[id] && ((rec.boards[id].lines || []).length || custom) && !lineup.includes(id)) { const at = Math.max(lineup.indexOf('welcome') + 1, 0); lineup.splice(at + (id === 'returned' && lineup.includes('warmup') ? 1 : 0), 0, id); } });
    rec.lineup = lineup;
    Suite.set('today', T);
  }

  const backToToday = () => { const m = location.hash.match(/from=today/), d = location.hash.match(/date=([\d-]+)/), c = location.hash.match(/class=([\w-]+)/); if (m && d && c) setTimeout(() => { location.href = `today.html#date=${d[1]}&class=${c[1]}`; }, 350); };
  /* ---------- editing a day ---------- */
  function openEditor(rowKey, dateKey, classOnly){
    const R = rows(), r = R.find(x => x.key === rowKey); if (!r) return;
    const A = Suite.agendaAll(), day = A[dateKey] || {};
    const target = classOnly || r.key;                // what we're editing: the course, or one period
    const one = classOnly ? r.classes.find(c => c.id === classOnly) : null;
    const e = day[target] || (classOnly ? day[r.key] : null) || { target: '', items: [], homework: '' };
    const when = parse(dateKey).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const back = document.createElement('div'); back.className = 'suite-dialog-back';
    back.innerHTML = `<div class="suite-dialog ed" role="dialog" aria-modal="true" aria-labelledby="ed-t">
      <h2 id="ed-t">${esc(one ? one.name : r.name)} · ${esc(when)}</h2>
      ${r.kind === 'course' ? `<div class="scope">${one
          ? `Just <b>${esc(one.name)}</b>. The rest of ${esc(r.name)} keeps the course plan.<div class="bar"><button class="btn quiet small" data-e="course">Back to the course plan</button>${day[one.id] ? `<button class="btn quiet danger small" data-e="unown">Use the course plan for ${esc(one.name)} again</button>` : ''}</div>`
          : `For every section: ${r.classes.map(c => esc(c.name) + (day[c.id] ? ' (changed)' : '')).join(', ') || 'none yet'}.<div class="bar"><label class="small" for="ed-one">Change one period only:</label><select id="ed-one"><option value="">Choose…</option>${r.classes.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div>`}</div>` : ''}
      <label class="lb" for="ed-target">Learning target</label><input class="field" id="ed-target" value="${esc(e.target || '')}" placeholder="I can explain the main idea of today's reading.">
      <label class="lb" for="ed-items">Agenda <span class="muted small">(one step per line)</span></label><textarea id="ed-items" rows="6">${esc((e.items || []).join('\n'))}</textarea>
      <label class="lb" for="ed-hw">Homework</label><input class="field" id="ed-hw" value="${esc(e.homework || '')}" placeholder="Optional">
      <span class="lb">Links and files <span class="muted small">(slides, docs, handouts; they show on the dashboard and the sub packet)</span></span>
      <p class="hintline" style="margin-top:0">A Google Slides link here also becomes the lesson slides on the Today screen.</p>
      <div id="ed-mats"></div>
      <div class="bar" style="margin-top:6px"><button class="btn small" data-e="addlink">Add a link</button><label class="btn small">Attach a file<input type="file" id="ed-file" multiple hidden></label></div>
      <details class="students subsec"><summary>For the sub</summary>
        <p class="hintline">Notes, links, and files only the sub sees, for ${esc(classOnly ? (r.classes.find(c => c.id === classOnly) || {}).name || '' : r.name)} on this day. The plan above and its links and files print in the sub packet automatically. Changes here save right away.</p>
        <div id="subitems"></div>

        <h2 id="un-t">Units</h2>
        <p class="hintline" style="margin-top:0">A unit is a name and dates for a course. It shows as a band in the Planner, and can switch Today's background and bitmoji when it starts.</p>
        ${list.length ? `<ul class="evlist">${list.map(x => `<li><span><span class="udot" style="background:${esc(x.color || '#6a8caf')}"></span><b>${esc(x.name)}</b> <span class="muted small">${esc(rowName(x.key))} · ${fmt(x.start)} to ${fmt(x.end)}</span></span><span class="bar"><button class="btn quiet small" data-u="edit" data-id="${esc(x.id)}">Edit</button><button class="btn quiet danger small" data-u="del" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.name)}">×</button></span></li>`).join('')}</ul>` : '<p class="muted">No units yet.</p>'}
        <h3 style="margin-top:14px">${u ? 'Edit unit' : 'Add a unit'}</h3>
        <div class="evgrid"><label>Course or class<select id="un-key">${R.map(r => `<option value="${esc(r.key)}"${u && u.key === r.key ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label><label>Name<input class="field" id="un-name" value="${esc(u ? u.name : '')}" placeholder="Ancient Egypt"></label></div>
        <div class="evgrid"><label>Starts<input type="date" class="field" id="un-start" value="${esc(u ? u.start : keyOf(days()[0]))}"></label><label>Ends <span class="muted small">(optional)</span><input type="date" class="field" id="un-end" value="${esc(u ? u.end || '' : '')}"></label></div>
        <div class="bar" style="margin-top:8px"><span class="small" style="font-weight:700">Color</span>${UCOLORS.map(c => `<button class="cswatch${(u ? u.color : UCOLORS[list.length % UCOLORS.length]) === c ? ' on' : ''}" data-u="color" data-c="${c}" style="background:${c}" aria-label="Color" type="button"></button>`).join('')}</div>
        <div class="evgrid"><label>Today background<select id="un-look">${looks.map(([k, n]) => `<option value="${esc(k)}"${u && (u.look || '') === k ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label><label>Today bitmoji<select id="un-bm">${bms.map(([k, n]) => `<option value="${esc(k)}"${u && (u.bitmoji || '') === k ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label></div>
        <details class="students"${o.showQuestion || o.countdown || o.pacing || o.shift ? ' open' : ''}><summary>Extras (optional)</summary>
          <label class="rv"><input type="checkbox" id="un-q"${o.showQuestion ? ' checked' : ''}> Show an essential question on the Today screen</label>
          <input class="field" id="un-qt" style="width:100%" value="${esc(o.question || '')}" placeholder="How did rivers shape early civilizations?">
          <label class="rv"><input type="checkbox" id="un-cd"${o.countdown ? ' checked' : ''}> Count down to the unit's end on the dashboard</label>
          <label class="rv"><input type="checkbox" id="un-pace"${o.pacing ? ' checked' : ''}> Show "Day 7 of 23" on the dashboard and sub plans</label>
          <label class="rv"><input type="checkbox" id="un-shift"${o.shift ? ' checked' : ''}> When I shift plans for a snow day, move this unit's end date too</label>
        </details>
        <div class="suite-dialog-actions"><button class="btn" data-u="close">Done</button>${u ? '<button class="btn" data-u="new">New unit</button>' : ''}<button class="btn primary" data-u="save" data-id="${u ? esc(u.id) : ''}">${u ? 'Save changes' : 'Add unit'}</button></div></div>`;
      back._color = u ? u.color : UCOLORS[list.length % UCOLORS.length];
    };
    document.body.appendChild(back); draw(editId);
    const close = () => { back.remove(); render(); };
    back.addEventListener('click', async e => {
      if (e.target === back) return close();
      const b = e.target.closest('[data-u]'); if (!b) return;
      const v = b.dataset.u, q = id => back.querySelector('#' + id);
      if (v === 'close') close();
      else if (v === 'new') draw();
      else if (v === 'edit') draw(b.dataset.id);
      else if (v === 'color') { back._color = b.dataset.c; back.querySelectorAll('.cswatch').forEach(x => x.classList.toggle('on', x === b)); }
      else if (v === 'del') { const snap = Suite.snapshot(['units']), gone = Suite.units().find(x => x.id === b.dataset.id); Suite.saveUnits(Suite.units().filter(x => x.id !== b.dataset.id)); draw(); Suite.undoToast((gone ? gone.name : 'Unit') + ' deleted', snap); }
      else if (v === 'save') {
        const name = q('un-name').value.trim(); if (!name) { Suite.toast('Give the unit a name'); return; }
        let start = q('un-start').value, end = q('un-end').value; if (!start) { Suite.toast('Pick a start date'); return; } if (end && end < start) [start, end] = [end, start];
        const item = { id: b.dataset.id || Suite.uid(), key: q('un-key').value, name, start, end, color: back._color, look: q('un-look').value, bitmoji: q('un-bm').value,
          opts: { showQuestion: q('un-q').checked, question: q('un-qt').value.trim(), countdown: q('un-cd').checked, pacing: q('un-pace').checked, shift: q('un-shift').checked } };
        const L = Suite.units(), i = L.findIndex(x => x.id === item.id); if (i > -1) L[i] = item; else L.push(item); Suite.saveUnits(L); draw(); Suite.toast('Unit saved');
      }
    });
  }
  // move a unit's dates along with a snow-day shift (only units that opted in)
  function shiftUnits(keys, from, n){
    const step = (k, dir) => { const d = parse(k); let left = Math.abs(n); while (left > 0) { d.setDate(d.getDate() + dir); if (Suite.scheduleFor(d).periods.length) left--; } return keyOf(d); };
    const L = Suite.units(); let moved = 0;
    L.forEach(u => { if (!keys.includes(u.key) || !(u.opts || {}).shift) return; const dir = n > 0 ? 1 : -1;
      if (u.end && u.end >= from) { u.end = step(u.end, dir); moved++; } if (u.start > from) u.start = step(u.start, dir); });
    if (moved) Suite.saveUnits(L); return moved;
  }


  /* ---------- planning shortcuts: copy a week, repeat a day weekly ---------- */
  function copyDay(from, to, keys, replace){
    const A = Suite.agendaAll(), T = Suite.get('today', {}) || {}; T.days = T.days || {};
    let n = 0;
    keys.forEach(k => {
      const src = (A[from] || {})[k]; if (!src) return;
      if (!replace && (A[to] || {})[k]) return;
      Suite.saveAgenda(to, [k], JSON.parse(JSON.stringify(src))); n++;
      const tr = (T.days[from] || {})[k]; if (tr) { T.days[to] = T.days[to] || {}; if (replace || !T.days[to][k]) T.days[to][k] = JSON.parse(JSON.stringify(tr)); }
    });
    Suite.set('today', T); return n;
  }
  function shortcutDialog(title, body, fields, go){
    const back = document.createElement('div'); back.className = 'suite-dialog-back';
    back.innerHTML = `<div class="suite-dialog ed" role="dialog" aria-modal="true"><h2>${title}</h2><p>${body}</p>${fields}
      <label class="rv" style="margin-top:10px"><input type="checkbox" id="sc-rep"> Replace days that already have a plan</label>
      <div class="suite-dialog-actions"><button class="btn" data-k="x">Cancel</button><button class="btn primary" data-k="go">Copy</button></div></div>`;
    document.body.appendChild(back);
    back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-k="x"]')) return back.remove(); if (e.target.closest('[data-k="go"]')) { const msg = go(back, back.querySelector('#sc-rep').checked); if (msg !== false) { back.remove(); render(); Suite.toast(msg); } } });
  }
  function openCopyWeek(){
    const D = days(), next = new Date(D[0]); next.setDate(next.getDate() + 7);
    shortcutDialog('Copy this week', `Copies every plan from the week of ${D[0].toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}, plus what students see on Today, to another week (Monday to Monday, and so on).`,
      `<label class="lb" for="cw-to">To the week of</label><input type="date" class="field" id="cw-to" value="${keyOf(next)}">`,
      (back, replace) => {
        const v = back.querySelector('#cw-to').value; if (!v) return false;
        const to = monday(parse(v)), keys = rows().flatMap(r => [r.key].concat(r.kind === 'course' ? r.classes.map(c => c.id) : []));
        let n = 0; D.forEach((d, i) => { const t = new Date(to); t.setDate(t.getDate() + i); n += copyDay(keyOf(d), keyOf(t), keys, replace); });
        return n ? `Copied ${n} plan${n === 1 ? '' : 's'} to the week of ${to.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}` : 'Nothing to copy (or those days already have plans)';
      });
  }
  function openRepeat(rowKey, dateKey){
    const end = parse(dateKey); end.setDate(end.getDate() + 28);
    shortcutDialog('Repeat weekly', `Copies this ${parse(dateKey).toLocaleDateString(undefined, { weekday: 'long' })} plan to every ${parse(dateKey).toLocaleDateString(undefined, { weekday: 'long' })} until the date you pick, skipping days with no school.`,
      `<label class="lb" for="rw-to">Until</label><input type="date" class="field" id="rw-to" value="${keyOf(end)}">`,
      (back, replace) => {
        const until = back.querySelector('#rw-to').value; if (!until) return false;
        let n = 0; const d = parse(dateKey); d.setDate(d.getDate() + 7);
        while (keyOf(d) <= until) { if (Suite.scheduleFor(d).periods.length) n += copyDay(dateKey, keyOf(d), [rowKey], replace); d.setDate(d.getDate() + 7); }
        return n ? `Repeated on ${n} day${n === 1 ? '' : 's'}` : 'Nothing copied (save the plan first, or those days already have plans)';
      });
  }

  /* ---------- school events ---------- */
  function openEvents(dateKey, editId){
    const back = document.createElement('div'); back.className = 'suite-dialog-back';
    const when = parse(dateKey).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const draw = (id) => {
      const list = Suite.eventsOn(dateKey), ev = id ? Suite.events().find(x => x.id === id) : null;
      back.innerHTML = `<div class="suite-dialog ed" role="dialog" aria-modal="true" aria-labelledby="ev-t">
        <h2 id="ev-t">School events · ${esc(when)}</h2>
        ${list.length ? `<ul class="evlist">${list.map(x => `<li><span><b>${esc(x.title)}</b>${x.end && x.end !== x.start ? ` <span class="muted small">(${esc(parse(x.start).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }))} to ${esc(parse(x.end).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }))})</span>` : ''}${x.note ? `<br><span class="muted small">${esc(x.note)}</span>` : ''}</span>
          <span class="bar"><button class="btn quiet small" data-v="edit" data-id="${esc(x.id)}">Edit</button><button class="btn quiet danger small" data-v="del" data-id="${esc(x.id)}" aria-label="Remove ${esc(x.title)}">×</button></span></li>`).join('')}</ul>` : '<p class="muted">Nothing yet on this day.</p>'}
        <h3 style="margin-top:14px">${ev ? 'Edit event' : 'Add an event'}</h3>
        <label class="lb" for="ev-title">What's happening</label><input class="field" id="ev-title" value="${esc(ev ? ev.title : '')}" placeholder="Spirit day, state testing, field trip...">
        <div class="evgrid"><label>Starts<input type="date" class="field" id="ev-start" value="${esc(ev ? ev.start : dateKey)}"></label><label>Ends <span class="muted small">(for events longer than a day)</span><input type="date" class="field" id="ev-end" value="${esc(ev ? (ev.end || ev.start) : dateKey)}"></label></div>
        <label class="lb" for="ev-note">Note <span class="muted small">(optional)</span></label><input class="field" id="ev-note" value="${esc(ev ? ev.note || '' : '')}" placeholder="Wear green and gold">
        <label class="rv"><input type="checkbox" id="ev-cd"${ev && ev.countdown ? ' checked' : ''}> Count down to it on the dashboard</label>
        <label class="rv" style="margin-left:26px">at <input type="time" class="field" id="ev-time" value="${esc(ev ? ev.time || '' : '')}" style="width:130px"> <span class="muted small">(optional; leave empty to count down to the day)</span></label>
        <label class="rv"><input type="checkbox" id="ev-mine"${ev && ev.mine ? ' checked' : ''}> Just for me (don't show it on the Today screen or the sub page)</label>
        <div class="suite-dialog-actions"><button class="btn" data-v="close">Done</button><button class="btn primary" data-v="save" data-id="${ev ? esc(ev.id) : ''}">${ev ? 'Save changes' : 'Add event'}</button></div></div>`;
      back.querySelector('#ev-title').focus();
    };
    document.body.appendChild(back); draw(editId);
    const close = () => { back.remove(); document.removeEventListener('keydown', key, true); render(); };
    const key = e => { if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); } };
    document.addEventListener('keydown', key, true);
    back.addEventListener('click', e => {
      if (e.target === back) return close();
      const b = e.target.closest('[data-v]'); if (!b) return;
      const v = b.dataset.v;
      if (v === 'close') close();
      else if (v === 'edit') draw(b.dataset.id);
      else if (v === 'del') { const snap = Suite.snapshot(['events']); const gone = Suite.events().find(x => x.id === b.dataset.id); Suite.saveEvents(Suite.events().filter(x => x.id !== b.dataset.id)); draw(); Suite.undoToast((gone ? gone.title : 'Event') + ' deleted', snap); }
      else if (v === 'save') {
        const title = back.querySelector('#ev-title').value.trim(); if (!title) { Suite.toast('Add a name for the event'); return; }
        let start = back.querySelector('#ev-start').value || dateKey, end = back.querySelector('#ev-end').value || start;
        if (end < start) [start, end] = [end, start];
        const list = Suite.events(), id = b.dataset.id, item = { id: id || Suite.uid(), title, start, end, note: back.querySelector('#ev-note').value.trim(), countdown: back.querySelector('#ev-cd').checked, mine: back.querySelector('#ev-mine').checked, time: back.querySelector('#ev-time').value || '' };
        const i = list.findIndex(x => x.id === id); if (i > -1) list[i] = item; else list.push(item);
        Suite.saveEvents(list); draw();
      }
    });
  }

  /* ---------- courses ---------- */
  function openCourses(){
    const back = document.createElement('div'); back.className = 'suite-dialog-back';
    const draw = () => {
      const co = Suite.courses(), cl = Suite.classes();
      back.innerHTML = `<div class="suite-dialog ed" role="dialog" aria-modal="true" aria-labelledby="co-t">
        <h2 id="co-t">Courses</h2>
        <p>A course is a group of periods that get the same lesson, like all the sections of one grade or subject. You plan once for the course, and each period can still be changed on its own.</p>
        <div class="courses">${co.length ? `<ul>${co.map(c => `<li><span class="nm">${esc(c.name)}</span><span class="muted small">${cl.filter(k => (c.classIds || []).includes(k.id)).map(k => esc(k.name)).join(', ')}</span>
          <button class="btn quiet small" data-c="edit" data-id="${esc(c.id)}">Edit</button><button class="btn quiet danger small" data-c="del" data-id="${esc(c.id)}" aria-label="Remove ${esc(c.name)}">×</button></li>`).join('')}</ul>` : '<p class="muted">No courses yet.</p>'}</div>
        <div class="suite-dialog-actions" style="justify-content:space-between"><button class="btn" data-c="add">Add a course</button><button class="btn primary" data-c="done">Done</button></div></div>`;
    };
    const edit = id => {
      const co = Suite.courses(), cl = Suite.classes(), c = co.find(x => x.id === id) || { id: Suite.uid(), name: '', classIds: [] };
      const taken = new Set(co.filter(x => x.id !== c.id).flatMap(x => x.classIds || []));
      back.innerHTML = `<div class="suite-dialog ed" role="dialog" aria-modal="true" aria-labelledby="co-t">
        <h2 id="co-t">${c.name ? 'Edit ' + esc(c.name) : 'New course'}</h2>
        <label class="lb" for="co-name">Name</label><input class="field" id="co-name" value="${esc(c.name)}" placeholder="6th grade science">
        <span class="lb">Periods in this course</span>
        <div class="checks">${cl.map(k => `<label${taken.has(k.id) ? ' title="Already in another course"' : ''}><input type="checkbox" value="${esc(k.id)}"${(c.classIds || []).includes(k.id) ? ' checked' : ''}${taken.has(k.id) ? ' disabled' : ''}> ${esc(k.name)}</label>`).join('')}</div>
        <div class="suite-dialog-actions"><button class="btn" data-c="back">Cancel</button><button class="btn primary" data-c="save" data-id="${esc(c.id)}">Save course</button></div></div>`;
      back.querySelector('#co-name').focus();
    };
    document.body.appendChild(back); draw();
    const close = () => { back.remove(); document.removeEventListener('keydown', onKey, true); render(); };
    const onKey = ev => { if (ev.key === 'Escape') { ev.stopImmediatePropagation(); close(); } };
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('click', async ev => {
      if (ev.target === back) return close();
      const b = ev.target.closest('[data-c]'); if (!b) return;
      const k = b.dataset.c;
      if (k === 'done') close();
      else if (k === 'add') edit(null);
      else if (k === 'edit') edit(b.dataset.id);
      else if (k === 'back') draw();
      else if (k === 'del') { const snap = Suite.snapshot(['courses', 'agenda', 'units', 'decks']); Suite.saveCourses(Suite.courses().filter(x => x.id !== b.dataset.id)); draw(); Suite.undoToast('Course removed. Its periods keep any plans made just for them.', snap); }
      else if (k === 'save') {
        const name = back.querySelector('#co-name').value.trim(), ids = [...back.querySelectorAll('.checks input:checked')].map(x => x.value);
        if (!name) { Suite.toast('Give the course a name'); return; }
        const co = Suite.courses(), i = co.findIndex(x => x.id === b.dataset.id), c = { id: b.dataset.id, name, classIds: ids };
        if (i > -1) co[i] = c; else co.push(c);
        Suite.saveCourses(co); Suite.mergeIntoCourses(); draw();
      }
    });
  }

  /* ---------- snow days: shift a row's plans ---------- */
  async function openShift(rowKey){
    const r = rows().find(x => x.key === rowKey); if (!r) return;
    const back = document.createElement('div'); back.className = 'suite-dialog-back';
    const first = days().find(d => Suite.scheduleFor(d).periods.length) || days()[0];
    back.innerHTML = `<div class="suite-dialog ed" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <h2 id="sh-t">Shift ${esc(r.name)} plans</h2>
      <p>Moves every plan from a day onward, skipping weekends and days with no school. Use it when a snow day or assembly takes a class day away.</p>
      <label class="lb" for="sh-from">Starting with</label><input type="date" class="field" id="sh-from" value="${keyOf(first)}">
      <label class="lb" for="sh-n">Move them</label><select id="sh-n">${[1, 2, 3].map(n => `<option value="${n}">${n} school day${n > 1 ? 's' : ''} later</option>`).join('')}<option value="-1">1 school day earlier</option></select>
      <label class="checks" style="margin-top:12px"><input type="checkbox" id="sh-off"> Also mark the starting day as <b>no school</b> on the bell schedule</label>
      <div class="suite-dialog-actions"><button class="btn" data-s="cancel">Cancel</button><button class="btn primary" data-s="go">Shift plans</button></div></div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.addEventListener('click', ev => {
      if (ev.target === back) return close();
      const b = ev.target.closest('[data-s]'); if (!b) return;
      if (b.dataset.s === 'cancel') return close();
      const from = back.querySelector('#sh-from').value, n = +back.querySelector('#sh-n').value;
      if (!from) return;
      if (back.querySelector('#sh-off').checked) { const S = Suite.getSchedule(); if (!S.special.some(d => d.date === from)) S.special.push({ date: from, label: 'No school', scheduleId: 'none' }); Suite.saveSchedule(S); }
      const keys = [r.key].concat(r.kind === 'course' ? r.classes.map(c => c.id) : []);
      const moved = Suite.shiftPlans(keys, from, n), um = shiftUnits(keys, from, n);
      close(); render(); Suite.toast((moved ? 'Moved ' + moved + ' plan' + (moved === 1 ? '' : 's') : 'No plans to move from that day on') + (um ? ' and ' + um + ' unit end date' + (um === 1 ? '' : 's') : ''));
    });
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a;
    if (a === 'prev' || a === 'next') { week.setDate(week.getDate() + (a === 'next' ? 7 : -7)); week = new Date(week); render(); }
    else if (a === 'now') { week = monday(new Date()); render(); }
    else if (a === 'edit') openEditor(el.dataset.row, el.dataset.date, null);
    else if (a === 'courses') openCourses();
    else if (a === 'daysoff') openDaysOff();
    else if (a === 'units') openUnits();
    else if (a === 'copyweek') openCopyWeek();
    else if (a === 'subout') { const S = Object.assign({}, Suite.get('sub', {}) || {}); S.out = Object.assign({}, S.out || {}); if (S.out[el.dataset.date]) delete S.out[el.dataset.date]; else S.out[el.dataset.date] = true; Suite.set('sub', S); render(); }
    else if (a === 'subprint') { const D = days(), outs = (Suite.get('sub', {}) || {}).out || {}, any = D.some(d => outs[keyOf(d)]); location.href = `sub.html#from=${keyOf(D[0])}&to=${keyOf(D[D.length - 1])}${any ? '&out=1' : ''}`; }
    else if (a === 'dayoff') { (async () => { const name = await Suite.dialog({ title: 'Mark ' + parse(el.dataset.date).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + ' as a day off?', input: 'No school', ok: 'Mark day off' }); if (name) { setDaysOff([el.dataset.date], name); render(); } })(); }
    else if (a === 'dayon') { clearDaysOff([el.dataset.date]); render(); }
    else if (a === 'events') openEvents(el.dataset.date);
    else if (a === 'merge') { const n = Suite.mergeIntoCourses(); render(); Suite.toast(n ? 'Combined ' + n + ' matching plan' + (n === 1 ? '' : 's') : 'Nothing to combine'); }
    else if (a === 'shift') openShift(el.dataset.row);
    else if (a === 'print') window.print();
  });
  window.addEventListener('suite:change', e => { if (e.detail && (e.detail.external || e.detail.key === '*')) render(); });
  Suite.mountNav('planner');
  render();
  // arriving from the dashboard with a class and date: open that day
  { const m = location.hash.match(/date=(\d{4}-\d{2}-\d{2})/), c = location.hash.match(/class=([\w-]+)/);
    if (m && c) { const r = rows().find(x => x.classes.some(k => k.id === c[1])); if (r) openEditor(r.key, m[1], null); } }
})();
</script>
</body>
